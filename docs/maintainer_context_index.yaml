schema_version: 1
kind: maintainer_context_index
purpose:
  summary: 只路由 Clean MMW U0、两个保留 baseline、DeepSense6G 和数据隔离边界。
agent_context:
  root: docs/agent_context/README.md
task_routes:
  - id: model
    context_path: docs/agent_context/models.md
    authority_paths:
      - openspec/specs/u0-mainline/spec.md
    owner_modules:
      - src/kd_sensing/models/
      - src/kd_sensing/losses/
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_u_mask_beam_jepa.py tests/test_amber_full_architecture.py tests/test_component_registry.py -q
  - id: data
    context_path: docs/agent_context/data.md
    authority_paths:
      - openspec/specs/clean-data-integrity/spec.md
      - openspec/specs/repo-boundaries/spec.md
    owner_modules:
      - src/kd_sensing/data/
      - src/kd_sensing/engine/data_factory.py
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_clean_inner_protocol.py tests/test_train_only_normalization.py tests/test_deepsense6g_dataset.py -q
  - id: config
    context_path: docs/agent_context/configs.md
    authority_paths:
      - openspec/specs/u0-mainline/spec.md
      - openspec/specs/clean-data-integrity/spec.md
    owner_modules:
      - src/kd_sensing/config/
      - configs/mmw/
      - configs/deepsense6g/
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_config_load_characterization.py -q
  - id: cli
    context_path: docs/agent_context/cli.md
    authority_paths:
      - openspec/specs/repo-boundaries/spec.md
      - pyproject.toml
    owner_modules:
      - src/kd_sensing/cli/
      - scripts/
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_cli_help.py tests/test_cli_strict_overrides.py tests/test_architecture_boundaries.py -q
  - id: openspec
    context_path: docs/agent_context/README.md
    authority_paths:
      - openspec/specs/
      - AGENTS.md
    owner_modules:
      - openspec/
    focused_validation:
      - openspec validate --all --strict
