schema_version: 1
kind: maintainer_context_index
purpose:
  summary: 路由四模态 topology-probing 主线、稳定 baseline、正式 MMW protocol 与 DeepSense6G。
agent_context:
  root: docs/agent_context/README.md
task_routes:
  - id: model
    context_path: docs/agent_context/models.md
    authority_paths:
      - openspec/specs/u0-mainline/spec.md
      - openspec/specs/four-modal-topology-predictor/spec.md
      - openspec/changes/add-uncertainty-adaptive-local-probing/specs/four-modal-topology-predictor/spec.md
      - openspec/changes/add-uncertainty-adaptive-local-probing/specs/sensing-guided-local-beam-probing/spec.md
    owner_modules:
      - src/kd_sensing/models/
      - src/kd_sensing/losses/
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_four_modal_topology_predictor.py tests/test_beam_posterior.py tests/test_u_mask_beam_jepa.py tests/test_component_registry.py -q
  - id: data
    context_path: docs/agent_context/data.md
    authority_paths:
      - openspec/specs/clean-data-integrity/spec.md
      - openspec/specs/mmw-id-stratified-block-protocol/spec.md
      - openspec/specs/repo-boundaries/spec.md
    owner_modules:
      - src/kd_sensing/data/
      - src/kd_sensing/engine/data_factory.py
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_mmw_trajectory_split.py tests/test_train_only_normalization.py tests/test_training_final_test_policy.py tests/test_deepsense6g_dataset.py -q
  - id: config
    context_path: docs/agent_context/configs.md
    authority_paths:
      - openspec/specs/u0-mainline/spec.md
      - openspec/specs/clean-data-integrity/spec.md
    owner_modules:
      - src/kd_sensing/config/
      - configs/mmw/
      - configs/deepsense6g/
      - tools/configs/topology_predictor/
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_config_load_characterization.py -q
  - id: cli
    context_path: docs/agent_context/cli.md
    authority_paths:
      - openspec/specs/repo-boundaries/spec.md
      - pyproject.toml
    owner_modules:
      - src/kd_sensing/cli/
      - scripts/
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_cli_help.py tests/test_cli_strict_overrides.py tests/test_architecture_boundaries.py -q
  - id: experiments
    context_path: docs/agent_context/README.md
    authority_paths:
      - openspec/specs/repo-boundaries/spec.md
      - openspec/specs/clean-data-integrity/spec.md
    owner_modules:
      - tools/
    notes: 原生四模态拓扑预测与 sensing-guided local beam probing 是唯一 active research mainline；旧分阶段融合、sparse CSI 与兼容入口均已退出 active surface。
    focused_validation:
      - conda run -n kd_mm_beam pytest tests/test_four_modal_topology_predictor.py tests/test_beam_probe_diagnostic.py -q
      - conda run -n kd_mm_beam python scripts/verify_compile.py
  - id: openspec
    context_path: docs/agent_context/README.md
    authority_paths:
      - openspec/specs/
      - AGENTS.md
    owner_modules:
      - openspec/
    focused_validation:
      - openspec validate --all --strict
