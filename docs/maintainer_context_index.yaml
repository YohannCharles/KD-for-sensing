schema_version: 1
kind: maintainer_context_index
purpose:
  summary: >
    Machine-readable maintainer context for AI agents, maintainers, and static
    architecture guardrails. This file centralizes routing and governance facts
    that were previously repeated across Markdown prose and pytest constants.
  stable_path: docs/maintainer_context_index.yaml
  authority_boundaries:
    does_not_replace:
      - openspec/specs/
      - README.md
      - AGENTS.md
      - docs/project_surface_inventory.md
    inventory_role: explanatory audit notes, historical caveats, and hotspot rationale
    openspec_role: behavioral requirements and architecture contracts
    readme_role: install, quickstart, and compact workflow index
  runtime_contract:
    runtime_config: false
    training_config: false
    imported_by_runtime: false
    no_runtime_side_effects: true
    validation_reads_source_docs_specs_tests_only: true

routing:
  task_types:
    - id: model_forward_registry
      lifecycle: current
      labels:
        - 模型
        - forward
        - registry
      read_first:
        - openspec/specs/model-architecture-extension-contract/spec.md
        - openspec/specs/modular-sequence-model/spec.md
        - openspec/specs/component-registry/spec.md
        - README.md
        - docs/project_surface_inventory.md
      primary_paths:
        - src/kd_sensing/models/
        - src/kd_sensing/registries.py
        - src/kd_sensing/engine/batch.py
        - src/kd_sensing/engine/runtime.py
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
      model_extension_routes:
        - config-only baseline
        - component baseline
        - whole-model exception
        - workflow/paper reproduction
    - id: data_batch_contract
      lifecycle: current
      labels:
        - 数据
        - batch
        - dataset contract
      read_first:
        - openspec/specs/dataset-runtime-contracts/spec.md
        - openspec/specs/modality-contracts/spec.md
        - README.md
        - docs/project_surface_inventory.md
      primary_paths:
        - src/kd_sensing/data/
        - src/kd_sensing/engine/batch.py
        - src/kd_sensing/engine/runtime.py
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
    - id: config_virtual_config
      lifecycle: current
      labels:
        - 配置
        - virtual config
      read_first:
        - openspec/specs/canonical-config-resolution/spec.md
        - openspec/specs/configurable-multimodal-fusion/spec.md
        - README.md
        - docs/project_surface_inventory.md
      primary_paths:
        - src/kd_sensing/config/
        - configs/
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_config_load_characterization.py -q
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
    - id: cli_scripts
      lifecycle: current
      labels:
        - CLI
        - scripts
      read_first:
        - README.md
        - pyproject.toml
        - docs/project_surface_inventory.md
        - openspec/specs/project-architecture/spec.md
      primary_paths:
        - src/kd_sensing/cli/
        - scripts/
        - pyproject.toml
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_cli_help.py -q
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
      guardrails:
        - Do not restore retired route console scripts, compatibility wrappers, or legacy root scripts.
    - id: diagnostics_viewer
      lifecycle: current
      labels:
        - 诊断
        - viewer
        - visual analysis
      read_first:
        - openspec/specs/modality-visual-diagnostics/spec.md
        - openspec/specs/jepa-visual-analysis-suite/spec.md
        - openspec/specs/jepa-gps-shortcut-benchmark/spec.md
        - README.md
        - docs/project_surface_inventory.md
      primary_paths:
        - src/kd_sensing/diagnostics/
        - src/kd_sensing/cli/export_viewer_manifest.py
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_modality_visual_diagnostics.py -q
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
    - id: runtime_outputs_cache_cleanup
      lifecycle: current
      labels:
        - 输出产物
        - cache
        - cleanup
      read_first:
        - openspec/specs/runtime-artifact-cleanup/spec.md
        - openspec/specs/experiment-run-index/spec.md
        - README.md
        - docs/project_surface_inventory.md
      primary_paths:
        - src/kd_sensing/utils/runtime_output_layout.py
        - src/kd_sensing/cli/cleanup_runtime_artifacts.py
        - src/kd_sensing/cli/organize_runtime_outputs.py
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_runtime_artifact_cleanup.py -q
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
      guardrails:
        - Default tests and governance checks must not read or write local runtime artifacts.
    - id: openspec_artifact
      lifecycle: current
      labels:
        - OpenSpec artifact
      read_first:
        - openspec/specs/project-architecture/spec.md
        - docs/project_surface_inventory.md
      primary_paths:
        - openspec/specs/
        - openspec/changes/
      validation_commands:
        - openspec validate <change> --strict
      guardrails:
        - Active change artifacts can guide implementation; archived changes are historical context only.
    - id: documentation_lifecycle
      lifecycle: current
      labels:
        - 文档生命周期
      read_first:
        - AGENTS.md
        - docs/agent_navigation.md
        - docs/project_surface_inventory.md
        - openspec/specs/spec-lifecycle-boundaries/spec.md
      primary_paths:
        - README.md
        - AGENTS.md
        - docs/
        - openspec/specs/
      validation_commands:
        - conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
      guardrails:
        - README remains a quickstart and short index; do not turn it into a governance database.

governance:
  entrypoints:
    lifecycle_values:
      - package_cli
      - thin_cli_alias
      - research_diagnostic
      - dataset_preparation
      - shell_orchestration
    package_cli:
      - name: kd-sensing-train
        target: kd_sensing.cli.train:main
        lifecycle: package_cli
        owner_module: kd_sensing.engine.trainer
        responsibility: parser/config glue for training workflow
        output_boundary: ignored outputs/ and logs/ runtime artifacts
      - name: kd-sensing-evaluate
        target: kd_sensing.cli.evaluate:main
        lifecycle: package_cli
        owner_module: kd_sensing.engine.evaluator
        responsibility: parser/config glue for evaluation workflow
        output_boundary: ignored outputs/evaluations/ or explicit user path
      - name: kd-sensing-preprocess
        target: kd_sensing.cli.preprocess:main
        lifecycle: package_cli
        owner_module: kd_sensing.preprocessing
        responsibility: parser/config glue for registered preprocessing actions
        output_boundary: dataset preparation target or explicit user path
      - name: kd-sensing-runs
        target: kd_sensing.cli.runs:console_main
        lifecycle: package_cli
        owner_module: kd_sensing.diagnostics.run_index
        responsibility: local run-index diagnostic CLI
        output_boundary: read-only/stdout unless explicit user path is provided
      - name: kd-sensing-clean-runtime-artifacts
        target: kd_sensing.cli.cleanup_runtime_artifacts:main
        lifecycle: package_cli
        owner_module: kd_sensing.diagnostics.runtime_artifact_cleanup
        responsibility: runtime artifact cleanup manifest CLI
        output_boundary: ignored outputs/cleanup_manifests/ with explicit confirmed deletion only
      - name: kd-sensing-organize-runtime-outputs
