_base_: ../_base.yaml
data:
  dataloader:
    train_batch_size: 64
    validation_batch_size: 64
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
evaluation:
  pcpf_diagnostics:
    comparison_budget:
      id: pcpf_trajectory_r0_r7_budget_v1
      stage_epochs:
        stage1_expert: 40
        stage2_risk: 20
        stage3_fusion: 10
      stage_learning_rates:
        stage1_expert: 0.0005
        stage2_risk: 0.0005
        stage3_fusion: 0.0001
      train_batch_size: 64
      validation_batch_size: 64
      scheduler: none
output:
  dir: outputs/pcpf_trajectory_r0
