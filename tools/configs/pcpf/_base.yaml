_base_: ../../../configs/mmw/_base.yaml
experiment:
  name: PCPF-T
  claim_ineligible: true
model:
  primary:
    type: pcpf_temporal_risk_fusion
    modalities: [image, radar, gps, lidar]
    image_channels: 3
    radar_channels: 2
    lidar_channels: 3
    gps_input_size: 3
    d_model: 64
    num_classes: 64
    num_pred: 1
    seq_length: 5
    dropout: 0.1
    beam_proto_temperature: 0.1
    training_stage: stage1_expert
    fusion_mode: uniform
    prototype_topology_id: cyclic_index_v1
    temporal_transformer:
      num_layers: 2
      num_heads: 4
      dim_feedforward: 128
      dropout: 0.1
      norm_first: true
      causal: false
      adapter_enabled: true
    probability_head:
      hidden_dim: 64
      min_logvar: -8.0
      max_logvar: 4.0
      initial_logvar: -4.0
    risk:
      enabled_components: [var, proto, temp, conflict]
      coefficient_init: [1.0, 1.0, 1.0, 0.25]
      bias_init: 0.0
      normalization_epsilon: 0.000001
    fusion:
      temperature_min: 0.05
      temperature_init: 1.0
      tau_min: 0.05
      tau_init: 1.0
      eta_init: 1.0
      train_eta: false
      finetune_risk_coefficients: false
      use_static_capability: true
      static_prior_source: train_risk
      direct_router_hidden_dim: 32
    encoders:
      image:
        type: tinyvit_5m_scratch_rgb
        output_dim: 64
        pretrained: false
        freeze_backbone: false
      radar:
        type: radar_cnn
        output_dim: 64
        pretrained: false
        freeze_backbone: false
      gps:
        type: gps_mlp
        output_dim: 64
        hidden_size: 64
        dropout: 0.1
        pretrained: false
        freeze_backbone: false
      lidar:
        type: tinyvit_5m_scratch_rgb
        output_dim: 64
        pretrained: false
        freeze_backbone: false
loss:
  type: cross_entropy
  pcpf_temporal_risk:
    enabled: true
    lambda_fused_hard: 1.0
    lambda_unimodal: 1.0
    unimodal_hard_weight: 1.0
    unimodal_soft_weight: 0.5
    fused_soft_weight: 0.0
    use_beam_prototype_alignment: true
    lambda_proto: 0.2
    lambda_modality_proto: 0.1
    beam_label_sigma: 2.0
    prototype_topology:
      id: cyclic_index_v1
    risk_supervision_enabled: true
    lambda_risk: 1.0
    lambda_rank: 0.2
    rank_margin: 0.05
    beta_kl: 0.0001
    lambda_preserve: 0.2
    stage3_topology_weight: 0.0
    stage3b_risk_weight: 1.0
    stage_preparation:
      enabled: true
      max_batches: null
      smoke_only: false
    stage2_gate:
      overall_spearman_min: 0.20
      minimum_positive_modalities: 3
      require_each_weather_positive: true
      upper_lower_gap_min: 0.0
      minimum_risk_std: 0.0001
training:
  final_test:
    enabled: false
  grad_clip: 5.0
  initialization_checkpoint: false
evaluation:
  k_values: [1, 3, 5]
  dba_distance_mode: circular
  missing_patterns:
    enabled: true
    patterns:
      - full
      - missing_image
      - missing_radar
      - missing_gps
      - missing_lidar
      - image_only
      - radar_only
      - gps_only
      - lidar_only
      - missing_image_radar
      - missing_image_gps
      - missing_image_lidar
      - missing_radar_gps
      - missing_radar_lidar
      - missing_gps_lidar
    prediction_index: last
output:
  dir: outputs/pcpf_temporal_risk
  run_name: null
  progress:
    enabled: false
  tensorboard:
    enabled: false
