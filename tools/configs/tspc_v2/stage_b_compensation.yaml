pilot:
  mother_patterns: 32
  mother_frequencies: 16
  budget: 2x2
  history_frames: 5
  train_snr_db_min: -10.0
  train_snr_db_max: 30.0
  train_dropout: 0.05
  validation_snr_db: 10.0
  validation_noise_seed: 720001

model:
  feature_dim: 64
  history_length: 5
  num_modalities: 4
  num_beams: 64
  sensing_architecture: hierarchical
  prototype_mode: shared_frozen
  sensing_frame_layers: 2
  sensing_heads: 4
  sensing_temporal_method: lstm
  sensing_temporal_hidden_dim: 128
  sensing_temporal_layers: 2
  sensing_dropout: 0.1
  csi_dim: 128
  csi_num_candidate_patterns: 32
  csi_num_frequency_indices: 16
  csi_encoder_layers: 0
  csi_heads: 4
  csi_temporal_layers: 2
  csi_dropout: 0.1
  residual_mode: cross_attention
  residual_heads: 4
  residual_dropout: 0.1
  use_mask_context: true
  use_sensing_context: true
  use_csi_temporal_tokens: true
  random_seed: 1

loss:
  final_ce_weight: 1.0
  sensing_ce_weight: 1.0
  prototype_weight: 0.2
  compensation_kl_weight: 0.1
  residual_regression_weight: 0.1
  distillation_temperature: 2.0

training:
  stage: stage_b
  batch_size: 256
  evaluation_batch_size: 1024
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 60
  patience: 10
  amp: true
  gradient_clip_norm: 1.0
  sensing_learning_rate_scale: 1.0
  seeds: [1, 2, 3]
  smoke_epochs: 1
  smoke_samples: 256
  smoke_updates: 100
  smoke_validation_samples: 500

selection:
  primary: all14_macro
  near_tie_pp: 0.3
  tie_breakers: [all14_worst, missing_lidar, trainable_parameters]

robustness:
  snr_db: [-10, -5, 0, 5, 10, 20, 30]
  dropout: [0.0, 0.1, 0.25, 0.5, 0.75]

legacy_b0:
