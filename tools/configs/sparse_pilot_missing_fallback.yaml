model:
  use_sparse_pilot_csi: true
  use_prototype_pilot_lookup: true
  use_dual_route_transition: true
  use_csi_reliability_gate: true
  use_csi_only_fallback: true
  use_availability_gate: true
channel:
  num_subcarriers: 1024
  subcarrier_spacing_hz: 120000
  frequency_index_mode: centered
  pilot_subcarriers: 16
  pilot_frequency_pattern: uniform
  snr_db_train_min: -10
  snr_db_train_max: 30
  pilot_dropout_prob: 0.1
  pilot_time_mode: last_input
pilot_codebook:
  method: random_qpsk
  num_candidate_patterns: 32
  num_selected_patterns: 4
  seed: 2026
pilot_selection:
  mode: learned_lookup
  gumbel_temperature: 1.0
sparse_pilot_encoder:
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.1
  quality_dim: 16
prototype_transition:
  topology_radius: 3
loss:
  lambda_topology: 0.2
  lambda_route: 0.1
  lambda_preserve: 0.2
  lambda_selector: 0.01
  lambda_fallback_ce: 1.0
  lambda_fallback_topology: 0.2
  lambda_gate: 0.2
training:
  stage: A
  freeze_sensing_encoders: true
  budget_randomization: false
  missing_fallback:
    enabled: true
    seed: 2026
    train_cardinality_weights:
      1: 0.50
      2: 0.35
      3: 0.10
      4: 0.05
    validation_cardinality_weights:
      1: 1.0
  budget_curriculum:
    - name: D32x16
      num_selected_patterns: 32
      num_pilot_subcarriers: 16
      epochs: 2
    - name: D16x16
      num_selected_patterns: 16
      num_pilot_subcarriers: 16
      epochs: 2
    - name: S8x8
      num_selected_patterns: 8
      num_pilot_subcarriers: 8
      epochs: 2
    - name: T4x8
      num_selected_patterns: 4
      num_pilot_subcarriers: 8
      epochs: 2
evaluation:
  snr_db: [-10, -5, 0, 5, 10, 20, 30]
  methods: [C0, C5]
  primary_num_selected_patterns: 4
  primary_num_pilot_subcarriers: 8
output:
  root: outputs/sparse_pilot_missing_fallback
  cache_root: outputs/cache/sparse_pilot_transition_dense_to_sparse
