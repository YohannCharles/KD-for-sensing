_base_: ../../../configs/deepsense6g/_base.yaml
experiment:
  name: deepsense6g-prototype-only
  claim_ineligible: true
model:
  primary:
    type: four_modal_topology_predictor
    modalities: [image, radar, gps, lidar]
    image_channels: 3
    radar_channels: 2
    lidar_channels: 3
    gps_input_size: 3
    d_model: 64
    num_classes: 64
    num_pred: 1
    seq_length: 5
    dropout: 0.1
    beam_proto_temperature: 0.1
    prototype_topology_id: linear_index_v1
    fusion_mode: masked_feature_mlp
    temporal_transformer:
      num_layers: 2
      num_heads: 4
      dim_feedforward: 128
      dropout: 0.1
      norm_first: true
      causal: false
      adapter_enabled: true
    encoders:
      image:
        type: tinyvit_5m_scratch_rgb
        output_dim: 64
        pretrained: false
        freeze_backbone: false
      radar:
        type: radar_cnn
        output_dim: 64
        pretrained: false
        freeze_backbone: false
      gps:
        type: gps_mlp
        output_dim: 64
        hidden_size: 64
        dropout: 0.1
        pretrained: false
        freeze_backbone: false
      lidar:
        type: tinyvit_5m_scratch_rgb
        output_dim: 64
        pretrained: false
        freeze_backbone: false
loss:
  type: cross_entropy
  four_modal_topology:
    enabled: true
    lambda_fused_hard: 1.0
    lambda_unimodal: 1.0
    hard_label_smoothing: 0.0
    unimodal_hard_weight: 1.0
    unimodal_soft_weight: 0.0
    use_beam_prototype_alignment: true
    lambda_proto: 0.1
    lambda_modality_proto: 0.0
    joint_topology_weight: 0.0
    beam_label_sigma: 2.0
    prototype_topology:
      id: linear_index_v1
training:
  checkpoint_selection: last
  final_test:
    enabled: true
  final_test_missing_matrix: true
  grad_clip: 5.0
evaluation:
  k_values: [1, 3, 5]
  dba_distance_mode: linear
output:
  dir: outputs/deepsense6g_secondary_transfer_v3/prototype_only
  run_name: seed1
  progress:
    enabled: false
