model:
  methods: [M0, M1, M2, M3]
  sensing_temperature_source: f1_checkpoint
  radio_temperature_source: aligned_shared_prototype
  fp32_evidence: true

training:
  batch_size: 512
  evaluation_batch_size: 1024
  max_epochs: 100
  patience: 15
  optimizer: AdamW
  learning_rate: 0.01
  weight_decay: 0.0
  gradient_clip_norm: null
  seeds: [1, 2, 3]
  validation_snr_db: 10.0
  train_snr_db_min: -10.0
  train_snr_db_max: 30.0
  train_pilot_dropout_probability: 0.05
  train_radio_seed: 710001
  validation_radio_seed: 720001
  selection_metric: all14_macro
  loss_profiles: [mask_equal, group_equal]

loss:
  topology: 0.2
  delta: 0.01
  group: 0.1
  severity: 0.02

diagnostics:
  lambda_grid_start: 0.0
  lambda_grid_stop: 1.0
  lambda_grid_step: 0.05
  train_calibration_fraction: 0.2
  mask_swap_offset: 1
  success_all14_macro_pp: 0.3
  success_all14_worst_pp: 1.0
  success_missing_lidar_pp: 1.0
  maximum_group_regression_pp: 0.5

baselines:
  b0_all14_macro: 0.5943552910217217
  b0_all14_worst: 0.10212097316980362
  b0_single_macro: 0.4521209839731455
  b0_full_top1: 0.8633149862289429
  oracle_all14_macro_temporal_2x2: 0.7688699322087424

output:
  root: outputs/temporal_sparse_prototype_compensation/trajectory_v1
  cache_root: outputs/cache/temporal_sparse_prototype_compensation/trajectory_v1
