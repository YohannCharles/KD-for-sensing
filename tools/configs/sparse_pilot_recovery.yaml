pilot:
  num_patterns: 4
  num_pilot_subcarriers: 8
  num_subcarriers: 1024
  subcarrier_spacing_hz: 120000
  frequency_index_mode: centered
  codebook_method: random_qpsk
  codebook_seed: 2026
model:
  hidden_dim: 128
  temporal_layers: 2
training:
  train_samples: 2000
  validation_samples: 1000
  batch_size: 64
  max_epochs: 60
  patience: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  snr_db_min: -10.0
  snr_db_max: 30.0
  validation_snr_db: 10.0
  pilot_dropout_prob: 0.0
  seeds: [1, 2, 3]
evaluation:
  severe_masks: [image_only, radar_only, gps_only, lidar_only]
  fixed_pilot_dropout_prob: 0.0
output:
  root: outputs/sparse_pilot_recovery
  cache_root: outputs/cache/sparse_pilot_recovery
