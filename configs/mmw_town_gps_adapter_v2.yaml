experiment:
  name: mmw_town_gps_adapter_v2

data:
  data_root: dataset/MMW/sunny
  analysis_dir: outputs/analysis/mmw_town_label_distribution
  output_root: outputs/analysis/mmw_town_gps_adapter_v2
  label_space: mapping_enabled
  label_spaces:
    mapping_enabled:
      enabled: true
      mapping_file: outputs/analysis/mmw_town_label_distribution/target_adapt_beambench_dba_calibration.json
      fallback_mapping_file: outputs/analysis/mmw_town_label_distribution/mapping_enabled/beam_label_mapping_midpoint_31_32.json
    mapping_disabled:
      enabled: false
  num_beams: 64
  split_tag: l5p3_group_safe
  train_split: train
  test_split: test
  scenes:
    - name: crossroad
      scene_id: 0
      slug: Town10_crossroad_seed24
    - name: skybridge
      scene_id: 1
      slug: Town10_skybridge_seed24
    - name: curvyroad
      scene_id: 2
      slug: Town10_curvyroad_seed42
    - name: Hroad
      scene_id: 3
      slug: Town10_Hroad_seed42

model:
  name: mmw_town_gps_v2
  input_dim: 8
  hidden_dim: 128
  dropout: 0.1
  activation: gelu
  residual_scale_init: 0.1
  adapter:
    type: circular_affine_spline
    sigma: 2.0
    tau: 1.0
    num_bins: 16
    max_branches: 4
    min_branch_support: 5
    smoothness_weight: 0.001

loss:
  type: circular_soft_ce
  sigma: 2.0
  focal_gamma: 2.0
  class_weight: none
  effective_num_beta: 0.999

train:
  seed: 42
  epochs: 12
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  max_samples_per_split: null

adapt:
  support_mode: angle_coverage
  support_ratio: 0.2
  support_num: null
  seed: 42
  grid:
    enabled: true
    psi_degrees: [-180, -120, -60, 0, 60, 120, 180]
    delta_beams: [-16, -12, -8, -4, 0, 4, 8, 12, 16]
    scale: [0.75, 1.0, 1.25]
    flip: [forward, reverse]
    criterion: mean_circular_error
  optimizer:
    enabled: true
    steps: 20
    lr: 0.02
  branch:
    max_k: 4
    min_samples: 8
    min_branch_support: 5

protocols:
  - source_other_three
  - target_adapt_beambench
  - within_scene_train

metrics:
  dba_delta: 5.0
  topk: [1, 3, 5]
  theta_bins: 12

ablation:
  enabled:
    - backbone_only
    - adapter_v1
    - circular_affine
    - circular_affine_spline
    - branch_mixture_circular
    - branch_mixture_circular_weighted
    - geo_only
    - geo_plus_backbone
  class_weighted:
    - branch_mixture_circular_weighted
  adapter_type:
    adapter_v1: adapter_v1
    circular_affine: circular_affine
    circular_affine_spline: circular_affine_spline
    branch_mixture_circular: branch_mixture_circular
    branch_mixture_circular_weighted: branch_mixture_circular
    geo_only: circular_affine
    geo_plus_backbone: circular_affine_spline
    backbone_only: none

output:
  write_predictions: true
  write_diagnostics: true
  write_config_snapshot: true
