_base_: _base/csi_only.yaml
experiment:
  name: csi_B6_medium_hardening_combo
  seed: 46
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 46
      mode: train_random_eval_fixed
      common_phase:
        enabled: true
        max_degrees: 90.0
      subcarrier_phase_slope:
        enabled: true
        max_degrees: 75.0
      antenna_calibration:
        enabled: true
        mode: fixed_by_seed
        amplitude_range:
        - 0.9
        - 1.1
        phase_std_degrees: 10.0
      antenna_permutation:
        enabled: true
        mode: fixed_by_seed
debug:
  matrix_role: B6_medium_hardening_combo
output:
  run_name: csi_B6_medium_hardening_combo
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: B6_medium_hardening_combo
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
