_base_: _base/csi_only.yaml
experiment:
  name: csi_A1_mild_pilot_estimation
model:
  primary:
    encoders:
      csi:
        csi_estimation:
          mode: est_snr
          pilot_len: 16
          pilot_power: 1.0
          snr_db: 30.0
          train_snr_min_db: 25.0
          train_snr_max_db: 35.0
debug:
  matrix_role: A1_mild_pilot_estimation
output:
  run_name: csi_A1_mild_pilot_estimation
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: A1_mild_pilot_estimation
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
