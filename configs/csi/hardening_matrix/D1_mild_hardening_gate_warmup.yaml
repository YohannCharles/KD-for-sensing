_base_: _base/csi_only.yaml
experiment:
  name: csi_D1_mild_hardening_gate_warmup
  seed: 49
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 49
      mode: train_random_eval_fixed
      common_phase:
        enabled: true
        max_degrees: 45.0
      subcarrier_phase_slope:
        enabled: true
        max_degrees: 30.0
      antenna_calibration:
        enabled: true
        amplitude_range:
        - 0.95
        - 1.05
        phase_std_degrees: 5.0
model:
  primary:
    encoders:
      csi:
        view_gate_warmup_epochs: 30
        view_gate_warmup_mode: mean
debug:
  matrix_role: D1_mild_hardening_gate_warmup
output:
  run_name: csi_D1_mild_hardening_gate_warmup
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: D1_mild_hardening_gate_warmup
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
