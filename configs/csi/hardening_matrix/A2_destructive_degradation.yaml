_base_: _base/csi_only.yaml
experiment:
  name: csi_A2_destructive_degradation
data:
  dataset:
    csi_degradation:
      enabled: true
      profile: medium
      seed: 42
model:
  primary:
    encoders:
      csi:
        csi_estimation:
          mode: physical
          pilot_len: 16
          pilot_power: 1.0
          noise_var: 0.01
debug:
  matrix_role: A2_destructive_degradation
  analysis_role: destructive_negative_control
  pilot_scaling_config_version: destructive_physical_noise_v1
output:
  run_name: csi_A2_destructive_degradation
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: A2_destructive_degradation
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
