experiment:
  name: csi_debug_C1_view_gate_warmup_only
  task: csi
  seed: 42
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    train_csv_name: Prepared/Town10_skybridge_seed24/splits/train.csv
    test_csv_name: Prepared/Town10_skybridge_seed24/splits/test.csv
    seq_len: 8
    num_pred: 3
    use_csi: true
    csi_train_rms: true
    csi_degradation:
      enabled: false
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
model:
  modalities:
  - csi
  primary:
    type: modular_sequence
    modalities:
    - csi
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      csi:
        type: pilot_dual_view_csi
        output_dim: 64
        train_rms: 1.0
        csi_estimation:
          mode: none
        csi_hardening:
          enabled: false
        delay_taps: 32
        view_fusion: symmetric_gate
        view_gate_warmup_epochs: 20
        view_gate_warmup_mode: mean
        delay_view_warmup_epochs: 0
        use_internal_gru: true
        debug:
          enabled: true
    representation_core:
      type: single_gru
      d_model: 64
      hidden_size: 64
      num_layers: 1
    heads:
      beam:
        type: beam_head
training:
  use_early_stopping: false
  model_selection: false
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
debug:
  enabled: true
  matrix_role: C1_view_gate_warmup_only
  csi_first_batch:
    enabled: true
  training_health:
    enabled: true
output:
  dir: outputs/csi_hardening_debug
  run_name: csi_debug_C1_view_gate_warmup_only
