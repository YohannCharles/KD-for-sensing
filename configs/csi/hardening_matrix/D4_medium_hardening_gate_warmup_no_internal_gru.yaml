_base_: _base/csi_only.yaml
experiment:
  name: csi_D4_medium_hardening_gate_warmup_no_internal_gru
  seed: 52
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 52
      mode: train_random_eval_fixed
      common_phase:
        enabled: true
        max_degrees: 90.0
      subcarrier_phase_slope:
        enabled: true
        max_degrees: 75.0
      antenna_calibration:
        enabled: true
        amplitude_range:
        - 0.9
        - 1.1
        phase_std_degrees: 10.0
      antenna_permutation:
        enabled: true
model:
  primary:
    encoders:
      csi:
        view_gate_warmup_epochs: 30
        view_gate_warmup_mode: mean
        use_internal_gru: false
debug:
  matrix_role: D4_medium_hardening_gate_warmup_no_internal_gru
output:
  run_name: csi_D4_medium_hardening_gate_warmup_no_internal_gru
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: D4_medium_hardening_gate_warmup_no_internal_gru
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
