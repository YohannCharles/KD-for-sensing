_base_: _base/csi_only.yaml
experiment:
  name: csi_B3_antenna_calibration
  seed: 43
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 43
      mode: train_random_eval_fixed
      antenna_calibration:
        enabled: true
        mode: fixed_by_seed
        amplitude_range:
        - 0.9
        - 1.1
        phase_std_degrees: 8.0
debug:
  matrix_role: B3_antenna_calibration
output:
  run_name: csi_B3_antenna_calibration
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: B3_antenna_calibration
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
