_base_: _base/csi_only.yaml
experiment:
  name: csi_B5_mild_hardening_combo
  seed: 45
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 45
      mode: train_random_eval_fixed
      common_phase:
        enabled: true
        max_degrees: 45.0
      subcarrier_phase_slope:
        enabled: true
        max_degrees: 30.0
      antenna_calibration:
        enabled: true
        mode: fixed_by_seed
        amplitude_range:
        - 0.95
        - 1.05
        phase_std_degrees: 5.0
debug:
  matrix_role: B5_mild_hardening_combo
output:
  run_name: csi_B5_mild_hardening_combo
config_resolution:
  style: base+overlay
  base_config: _base/csi_only.yaml
  overlay_id: B5_mild_hardening_combo
  control_variables:
  - csi_estimation
  - csi_hardening
  - csi_degradation
  - view_gate_warmup
  - use_internal_gru
