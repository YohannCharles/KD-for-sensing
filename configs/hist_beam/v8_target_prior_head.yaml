experiment:
  name: hist_beam_v8_target_prior_head
  task: fusion
  objective: beam
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    enabled_modalities: [image, gps, lidar]
model:
  modalities: [image, gps, lidar]
  feature_size: 64
  d_model: 128
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  student:
    type: hist_beam_fusion
    modalities: [image, gps, lidar]
    feature_size: 64
    d_model: 128
    num_classes: 64
    num_pred: 3
    group_size: 8
    variant: v8_target_prior_head
    num_heads: 4
    num_layers: 2
    image_encoder:
      type: resnet18_imagenet_rgb
      pretrained: false
      weights: null
    v8:
      mode: target_prior_head
      adapter_dim: 64
      adapter_dropout: 0.1
      use_adapter: true
      use_target_prior: true
      use_source_logits_in_final: false
      lambda_src: 0.0
      lambda_tgt: 1.0
      beta_prior: 1.0
      learnable_beta_prior: false
      use_coarse_to_fine: false
      sector_size: 8
      unfreeze_last_fusion_block: false
hist_beam:
  enabled: true
  variant: v8_target_prior_head
  num_classes: 64
  group_size: 8
  v8:
    mode: target_prior_head
    adapter_dim: 64
    adapter_dropout: 0.1
    use_adapter: true
    use_target_prior: true
    use_source_logits_in_final: false
    lambda_src: 0.0
    lambda_tgt: 1.0
    beta_prior: 1.0
    learnable_beta_prior: false
    use_coarse_to_fine: false
    sector_size: 8
    unfreeze_last_fusion_block: false
    use_soft_beam_label: true
    soft_label_sigma: 1.0
    prior_sigma: 1.5
    prior_eps: 1.0e-4
    loss_prior_smooth_weight: 0.001
    run_prototype_probe: false
  loss_weights:
    v8_final_ce: 1.0
    v8_prior_smooth: 0.001
    v8_sector_ce: 0.2
    v8_offset_ce: 0.2
  source_train:
    loss_type: cross_entropy
    class_prior_from_source_train: false
    logit_adjust_tau: 1.0
    debiased_loss_available: false
    unsupported_reason: source_long_tail_debias_not_implemented
  adaptation:
    strategy: v8_target_head_only
    epochs: 5
    entropy_weight: 0.0
    few_shot_stratification: beam_frequency
distillation:
  type: no_kd
loss:
  type: cross_entropy
training:
  epochs: 5
  lr: 0.0005
  weight_decay: 0.0001
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_v8_target_prior_head
