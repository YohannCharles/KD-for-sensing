experiment:
  name: hist_beam_mmw_history_anchored_quick_validation
  task: fusion
  objective: beam
  seed: 0
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    data_root: dataset/MMW/sunny
    seq_len: 5
    num_pred: 3
    portion: 1.0
    enabled_modalities: [image, gps, lidar]
    modality_profile: history_anchored_quick_validation
    image_profile: rgb_imagenet
    image_size: [224, 224]
    gps_feature_mode: relative_polar
    gps_normalize: true
    lidar_bev_size: [224, 224]
    lidar_normalize: false
    lidar_cache_dir: lidar_bev_cache
    use_mmwave: false
    mmwave_normalize: false
    use_csi: false
    radio_semantic:
      enabled: true
      mode: peak_spread
      group_size: 8
      num_spread_bins: 3
      entropy_thresholds: [0.35, 0.65]
      return_beam_power: true
    path_semantic:
      enabled: true
      mode: kmeans_path_descriptor
      num_path_classes: 24
      descriptor_dim: auto
      fit_on_source_only: true
      fallback_if_missing: radio_power
      use_path_regression: true
    return_geometry: true
    return_modality_availability: true
  cache:
    policy: read_only
    image:
      policy: read_only
    lidar:
      policy: read_only
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    train_num_workers: 4
    test_num_workers: 4
    train_pin_memory: true
    test_pin_memory: true
    train_persistent_workers: true
    test_persistent_workers: true
    train_prefetch_factor: 2
    test_prefetch_factor: 2
model:
  modalities: [image, gps, lidar]
  feature_size: 64
  d_model: 128
  num_classes: 64
  seq_length_teacher: 5
  seq_length_student: 5
  num_pred: 3
  downsample_ratio: 1
  student:
    type: hist_beam_fusion
    modalities: [image, gps, lidar]
    feature_size: 64
    d_model: 128
    num_classes: 64
    num_pred: 3
    group_size: 8
    variant: v4_adapter
    num_heads: 4
    num_layers: 2
    image_encoder:
      type: resnet18_imagenet_rgb
      pretrained: false
      weights: null
    adapter:
      enabled: true
      coarse_conditioned: true
    history_anchor:
      enabled: true
      mode: residual_delta
      num_delta_classes: 64
      embedding_dim: 32
      lambda_absolute_aux: 0.1
hist_beam:
  enabled: true
  profile: history_anchored_quick_validation
  num_classes: 64
  group_size: 8
  history_anchor:
    enabled: true
    mode: residual_delta
    num_delta_classes: 64
    embedding_dim: 32
    lambda_absolute_aux: 0.1
  markov_baseline:
    enabled: true
    smoothing: 1.0
  excluded_sensitive_fields: [mmwave, csi, channel, path, beam_power]
  loss_weights:
    hierarchical: 1.0
    flat: 0.0
    radio_semantic: 0.0
    lambda_path: 0.0
    lambda_path_reg: 0.0
  prototype:
    enabled: false
    proto_type: none
    confidence_threshold: 0.75
  adaptation:
    epochs: 1
    entropy_weight: 0.01
    prototype_weight: 0.0
    allow_labeled_target_radio_supervision: false
    allow_labeled_target_path_supervision: false
    allow_target_sensitive_supervision_in_main_conclusion: false
distillation:
  type: no_kd
loss:
  type: cross_entropy
training:
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  use_early_stopping: true
  early_stopping_metric: val_reconstructed_absolute_top1_avg
  early_stopping_mode: max
  transfer:
    non_blocking: true
  amp:
    enabled: true
    dtype: bfloat16
    grad_scaler: false
  cpu_threads:
    enabled: true
    intra_op: 1
    inter_op: 1
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_mmw_history_anchored_quick_validation
  progress:
    enabled: true
loso:
  dataset_family: MMW
  profile: history_anchored_quick_validation
  data_availability_path: dataset/MMW/data_availability.json
  protocol: scenario_loso
  target_scenes: [Town10_crossroad_seed24, Town10_Hroad_seed42]
  variants: [v1_hierarchical, v4_adapter, v6_full_finetune]
  budgets: [10]
  seeds: [0, 1]
  reuse_source_checkpoint: true
  history_anchor_matrix:
    baselines: [last_beam, markov_delta, absolute_source_only]
    ablations: [history_absolute_classifier, residual_only, residual_private_calibration]
