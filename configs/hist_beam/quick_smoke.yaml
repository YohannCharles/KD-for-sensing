experiment:
  name: hist_beam_quick_smoke
  task: fusion
  objective: beam
  seed: 0
data:
  dataset:
    type: deepsense6g
    scene: 31
    seq_len: 2
    num_pred: 1
    portion: 0.02
    image_profile: rgb_imagenet
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: false
    use_lidar: false
    use_mmwave: false
  dataloader:
    train_batch_size: 2
    test_batch_size: 2
    num_workers: 0
model:
  modalities: [image, radar, gps]
  feature_size: 16
  d_model: 32
  num_classes: 64
  seq_length_teacher: 2
  seq_length_student: 2
  num_pred: 1
  downsample_ratio: 1
  teacher:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    feature_size: 16
    d_model: 32
    num_classes: 64
    num_pred: 1
    group_size: 8
    variant: v3_decoupled
    num_heads: 4
    num_layers: 1
    image_encoder:
      type: legacy_cnn
  student:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    feature_size: 16
    d_model: 32
    num_classes: 64
    num_pred: 1
    group_size: 8
    variant: v3_decoupled
    num_heads: 4
    num_layers: 1
    image_encoder:
      type: legacy_cnn
hist_beam:
  enabled: true
  group_size: 8
  loss_weights:
    hierarchical: 1.0
    flat: 0.2
    orthogonality: 0.01
    scene_confusion: 0.05
    scene_private: 0.05
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  type: cross_entropy
training:
  epochs: 2
  lr: 0.0005
  use_early_stopping: false
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_quick_smoke
  progress:
    enabled: false
loso:
  profile: resource_probe
  target_scenes: [34]
  variants: [v0_flat]
  budgets: [0]
  seeds: [0]
  max_runs: 1
  skip_scenes: []
  reuse_source_checkpoint: true
