experiment:
  name: hist_beam_loso_matrix
  task: fusion
  objective: beam
data:
  dataset:
    type: deepsense6g
    scene: 31
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
model:
  modalities: [image, radar, gps]
  student:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    variant: v3_decoupled
loso:
  variants: [v0_flat, v1_hierarchical, v2_shared_private, v3_decoupled, v4_adapter, v5_adapter_proto, v6_full_finetune]
  budgets: [0, 5, 10, 20, 50]
  seeds: [0, 1, 2]
  skip_scenes: []
  reuse_source_checkpoint: true
  output_dir: outputs/hist_beam_loso
