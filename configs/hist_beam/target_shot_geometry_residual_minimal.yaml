data:
  dataset:
    type: mmw
    scene: town10_skybridge_seed24
    condition: sunny

split:
  input_path: dataset/MMW/sunny/Prepared/town10_skybridge_seed24/splits/all_sequences.csv
  artifact_path: outputs/target_shot_geometry_residual/split.json
  domain_type: scenario_weather
  source_domains:
    - source_scene:sunny
  target_domains:
    - target_scene:rain
  target_label_fraction: 0.05
  target_label_selection: stratified_by_beam
  seed: 42
  allow_target_unlabeled: true
  target_test_fraction: 0.2

label_space:
  type: geometry_residual
  num_beams: 64
  residual_convention: signed_circular
  max_residual: 8
  overflow_strategy: boundary
  num_geo_sectors: 8
  geometry:
    required: false
  beam_geo_source: uniform_angle_quantization

diagnostics:
  distribution_shift:
    split_artifact: outputs/target_shot_geometry_residual/split.json
    output_dir: outputs/target_shot_geometry_residual/distribution_shift
    smoothing: 1.0e-6
    figures: false
