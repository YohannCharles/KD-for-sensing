experiment:
  name: hist_beam_v6_full_finetune
  task: fusion
  objective: beam
data:
  dataset:
    type: deepsense6g
    scene: 31
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
model:
  modalities: [image, radar, gps]
  student:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    variant: v6_full_finetune
hist_beam:
  enabled: true
  variant: v6_full_finetune
  adaptation:
    strategy: full_finetune
training:
  lr: 0.00005
