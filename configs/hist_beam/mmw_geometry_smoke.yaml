experiment:
  name: hist_beam_mmw_geometry_smoke
  task: fusion
  objective: beam
  seed: 0
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    data_root: dataset/MMW/sunny
    train_csv_name: Prepared/Town10_skybridge_seed24/splits/train.csv
    test_csv_name: Prepared/Town10_skybridge_seed24/splits/test.csv
    seq_len: 8
    num_pred: 1
    portion: 0.02
    image_profile: rgb_imagenet
    image_size: [224, 224]
    gps_feature_mode: relative_polar
    gps_normalize: false
    mmwave_normalize: false
    radio_semantic:
      enabled: true
      mode: peak_spread
      group_size: 8
      num_spread_bins: 3
      entropy_thresholds: [0.35, 0.65]
      return_beam_power: true
    return_geometry: true
    return_modality_availability: true
  dataloader:
    train_batch_size: 1
    test_batch_size: 1
    num_workers: 0
model:
  modalities: [image, gps, mmwave]
  feature_size: 16
  d_model: 32
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 1
  downsample_ratio: 1
  student:
    type: hist_beam_fusion
    modalities: [image, gps, mmwave]
    feature_size: 16
    d_model: 32
    num_classes: 64
    num_pred: 1
    group_size: 8
    variant: v5_adapter_proto
    num_heads: 4
    num_layers: 1
    image_encoder:
      type: legacy_cnn
    geometry_aware:
      enabled: true
    geometry_input_size: 8
    geometry_fields:
      - relative_range
      - relative_azimuth
      - relative_elevation
      - heading_difference
      - relative_velocity
      - local_x
      - local_y
      - local_z
    adapter:
      enabled: true
      coarse_conditioned: true
      bottleneck_dim: 8
hist_beam:
  enabled: true
  num_classes: 64
  group_size: 8
  loss_weights:
    hierarchical: 1.0
    flat: 0.1
    angular_smoothing: 0.05
    geometry_consistency: 0.02
  angular_smoothing:
    enabled: true
    topology: linear
    sigma: 1.5
  prototype:
    enabled: true
    proto_type: coarse
    confidence_threshold: 0.6
  radio_semantic:
    enabled: true
    mode: peak_spread
    num_spread_bins: 3
    entropy_thresholds: [0.35, 0.65]
  adaptation:
    epochs: 1
    entropy_weight: 0.01
    prototype_weight: 0.1
distillation:
  type: no_kd
loss:
  type: cross_entropy
training:
  epochs: 1
  lr: 0.0005
  use_early_stopping: false
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_mmw_geometry_smoke
  progress:
    enabled: false
loso:
  dataset_family: MMW
  data_availability_path: dataset/MMW/data_availability.json
  protocol: scenario_loso
  variants: [v1_hierarchical, v4_adapter, v5_adapter_proto, v6_radio_proto, adapter_radio_proto, v6_full_finetune]
  budgets: [0, 5]
  seeds: [0]
  max_runs: 1
  reuse_source_checkpoint: true
