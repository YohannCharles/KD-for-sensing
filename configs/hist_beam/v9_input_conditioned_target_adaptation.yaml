experiment:
  name: hist_beam_v9_input_conditioned_target_adaptation
  task: fusion
  objective: beam
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    enabled_modalities: [image, gps, lidar]
model:
  modalities: [image, gps, lidar]
  feature_size: 64
  d_model: 128
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  student:
    type: hist_beam_fusion
    modalities: [image, gps, lidar]
    feature_size: 64
    d_model: 128
    num_classes: 64
    num_pred: 3
    group_size: 8
    variant: v9_input_conditioned_target_adaptation
    num_heads: 4
    num_layers: 2
    image_encoder:
      type: resnet18_imagenet_rgb
      pretrained: false
      weights: null
    v8:
      mode: target_prior_head
      adapter_dim: 64
      adapter_dropout: 0.1
      use_adapter: true
      use_source_logits_in_final: false
      beta_prior: 0.5
    v9:
      use_target_prior: true
      beta_prior_max: 1.0
      learnable_beta_prior: true
      prior_dropout: 0.0
      use_prototype_logits: true
      prototype_type: beam
      prototype_tau: 0.1
      eta_prototype: 1.0
      sector_size: 2
      prototype_feature_source: target_adapter
      use_widened_prior_marginal_kl: false
      widened_prior_sigma: 3.0
      widened_prior_temperature: 1.5
      loss_widened_prior_marginal_kl_weight: 0.0
hist_beam:
  enabled: true
  variant: v9_input_conditioned_target_adaptation
  num_classes: 64
  group_size: 8
  v8:
    mode: target_prior_head
    adapter_dim: 64
    adapter_dropout: 0.1
    use_adapter: true
    use_target_prior: true
    use_source_logits_in_final: false
    beta_prior: 0.5
    learnable_beta_prior: false
    prior_sigma: 1.5
    prior_eps: 1.0e-4
    loss_prior_smooth_weight: 0.001
  v9:
    use_target_prior: true
    beta_prior_max: 1.0
    learnable_beta_prior: true
    prior_dropout: 0.0
    use_prototype_logits: true
    prototype_type: beam
    prototype_tau: 0.1
    eta_prototype: 1.0
    sector_size: 2
    prototype_feature_source: target_adapter
    use_widened_prior_marginal_kl: false
    widened_prior_sigma: 3.0
    widened_prior_temperature: 1.5
    loss_widened_prior_marginal_kl_weight: 0.0
  collapse_diagnostics:
    enabled: true
  loss_weights:
    v8_final_ce: 1.0
    v8_prior_smooth: 0.001
    v9_widened_prior_marginal_kl: 0.0
  adaptation:
    strategy: v9_target_head_only
    epochs: 5
    entropy_weight: 0.0
    few_shot_stratification: beam_frequency
distillation:
  type: no_kd
loss:
  type: cross_entropy
training:
  epochs: 5
  lr: 0.0005
  weight_decay: 0.0001
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_v9_input_conditioned_target_adaptation
