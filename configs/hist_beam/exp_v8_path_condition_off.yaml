experiment:
  name: hist_beam_v8_path_condition_off
  task: fusion
  objective: beam
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    path_semantic:
      enabled: true
      mode: kmeans_path_descriptor
      num_path_classes: 24
      descriptor_dim: auto
      fit_on_source_only: true
      fallback_if_missing: radio_power
      use_path_regression: true
    radio_semantic:
      enabled: true
      mode: peak_spread
      group_size: 8
      return_beam_power: true
model:
  modalities: [image, gps, mmwave]
  student:
    type: hist_beam_fusion
    modalities: [image, gps, mmwave]
    variant: adapter_path_proto
    adapter:
      enabled: true
    path_semantic:
      enabled: true
      mode: kmeans_path_descriptor
      num_path_classes: 24
      use_path_head: true
      use_path_condition_in_beam_head: false
      path_embed_dim: 32
      use_path_regression: true
    num_path_classes: 24
    use_path_head: true
    use_path_condition_in_beam_head: false
    path_embed_dim: 32
    proto_type: path
hist_beam:
  enabled: true
  variant: adapter_path_proto
  proto_type: path
  path_semantic:
    enabled: true
    mode: kmeans_path_descriptor
    num_path_classes: 24
    descriptor_dim: auto
    fit_on_source_only: true
    fallback_if_missing: radio_power
    use_path_regression: true
  loss_weights:
    lambda_path: 0.3
    lambda_path_reg: 0.05
  prototype:
    enabled: true
    proto_type: path
    confidence_threshold: 0.75
    use_source_private_proto: false
  adaptation:
    proto_type: path
    entropy_weight: 0.01
    prototype_weight: 0.1
    proto_tau: 0.1
    confidence_threshold: 0.75
    proto_warmup_epochs: 5
    target_proto_momentum: 0.9
    allow_labeled_target_path_supervision: false
