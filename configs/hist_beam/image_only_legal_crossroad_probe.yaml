experiment:
  name: hist_beam_image_only_legal_crossroad_probe
  task: fusion
  objective: beam
  seed: 0
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_crossroad_seed24
    data_root: dataset/MMW/sunny
    seq_len: 5
    num_pred: 3
    portion: 1.0
    enabled_modalities: [image]
    modality_profile: image_only_legal_crossroad_probe
    image_profile: rgb_imagenet
    image_size: [224, 224]
    use_gps: false
    use_lidar: false
    use_mmwave: false
    mmwave_normalize: false
    use_csi: false
    return_beam_power: false
    return_geometry: false
    return_modality_availability: true
    radio_semantic:
      enabled: false
      return_beam_power: false
    path_semantic:
      enabled: false
    physical_label:
      enabled: false
  cache:
    policy: read_only
    image:
      policy: read_only
  dataloader:
    train_batch_size: 8
    test_batch_size: 8
    num_workers: 0
model:
  modalities: [image]
  feature_size: 64
  d_model: 128
  num_classes: 64
  seq_length_teacher: 5
  seq_length_student: 5
  num_pred: 3
  downsample_ratio: 1
  student:
    type: hist_beam_fusion
    modalities: [image]
    feature_size: 64
    d_model: 128
    num_classes: 64
    num_pred: 3
    group_size: 8
    variant: image_only_v8_v9_probe
    num_heads: 4
    num_layers: 2
    image_only:
      fusion_mode: identity
    image_encoder:
      type: resnet18_imagenet_rgb
      pretrained: false
      weights: null
    adapter:
      enabled: true
      coarse_conditioned: false
    radio_semantic:
      enabled: false
    path_semantic:
      enabled: false
    use_radio_head: false
    use_path_head: false
hist_beam:
  enabled: true
  profile: image_only_legal_crossroad_probe
  variant: image_only_v8_v9_probe
  modalities: [image]
  num_classes: 64
  group_size: 8
  disabled_modalities: [gps, lidar, radar, mmwave, csi]
  excluded_sensitive_fields: [gps, lidar, radar, mmwave, csi, channel, path, beam_power]
  protocol:
    image_only: true
    allow_target_unlabeled: false
    allow_target_radio_oracle: false
    allow_target_path_oracle: false
    allow_target_beam_power_oracle: false
    allow_target_test_labels_for_adaptation: false
  image_only:
    fusion_mode: identity
  feature_cache:
    enabled: true
    dir: feature_cache
    dtype: float32
    overwrite: true
  probe_modes:
    I0:
      variant: image_source_only
      run_dir: I0_source_only
    I1:
      variant: image_target_linear_probe
      run_dir: I1_linear_probe
    I2:
      variant: image_v8_target_prior_head
      run_dir: I2_v8_target_prior
    I3:
      variant: image_v9_sector_proto
      run_dir: I3_v9_sector_proto
  collapse_diagnostics:
    enabled: true
  v8:
    mode: target_prior_head
    adapter_dim: 64
    adapter_dropout: 0.1
    use_adapter: true
    use_target_prior: true
    use_source_logits_in_final: false
    beta_prior: 0.5
    beta_prior_max: 1.0
    learnable_beta_prior: true
    prior_sigma: 1.5
    prior_eps: 1.0e-4
    use_soft_beam_label: true
    soft_label_sigma: 1.0
    loss_prior_smooth_weight: 0.001
  v9:
    use_target_prior: true
    beta_prior_max: 1.0
    learnable_beta_prior: true
    prior_dropout: 0.0
    use_prototype_logits: true
    prototype_type: sector
    use_beam_proto: false
    prototype_tau: 0.1
    proto_temperature: 0.1
    eta_prototype: 1.0
    sector_size: 2
    prototype_feature_source: target_adapter
  loss_weights:
    hierarchical: 1.0
    flat: 0.2
    radio_semantic: 0.0
    lambda_path: 0.0
    lambda_path_reg: 0.0
    v8_final_ce: 1.0
    v8_prior_smooth: 0.001
  prototype:
    enabled: false
    proto_type: none
  adaptation:
    epochs: 1
    entropy_weight: 0.0
    prototype_weight: 0.0
    few_shot_stratification: beam_frequency
    allow_labeled_target_radio_supervision: false
    allow_labeled_target_path_supervision: false
    allow_target_sensitive_supervision_in_main_conclusion: false
distillation:
  type: no_kd
loss:
  type: cross_entropy
training:
  epochs: 1
  lr: 0.0005
  weight_decay: 0.0001
  use_early_stopping: false
  transfer:
    non_blocking: true
  amp:
    enabled: true
    dtype: bfloat16
    grad_scaler: false
  cpu_threads:
    enabled: true
    intra_op: 1
    inter_op: 1
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: image_only_legal_seed0
  progress:
    enabled: true
loso:
  dataset_family: MMW
  profile: image_only_legal_crossroad_probe
  data_availability_path: dataset/MMW/data_availability.json
  protocol: scenario_loso
  target_scenes: [Town10_crossroad_seed24]
  source_scenes: [Town10_skybridge_seed24, Town10_Hroad_seed42, Town10_curvyroad_seed42]
  variants: [image_source_only, image_target_linear_probe, image_v8_target_prior_head, image_v9_sector_proto]
  budgets: [10]
  seeds: [0]
  reuse_source_checkpoint: true
  output_dir: outputs/image_only_legal_seed0
