experiment:
  name: hist_beam_base
  task: fusion
  objective: beam
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 1
    portion: 1.0
    image_profile: rgb_imagenet
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: false
    use_mmwave: false
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
    num_workers: 0
model:
  modalities: [image, radar, gps]
  feature_size: 64
  d_model: 128
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 1
  downsample_ratio: 1
  teacher:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    feature_size: 64
    d_model: 128
    num_classes: 64
    num_pred: 1
    group_size: 8
    variant: v3_decoupled
    image_encoder:
      type: resnet18_imagenet_rgb
      pretrained: false
      weights: null
  student:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    feature_size: 64
    d_model: 128
    num_classes: 64
    num_pred: 1
    group_size: 8
    variant: v3_decoupled
    num_heads: 4
    num_layers: 2
    dropout: 0.1
    image_encoder:
      type: resnet18_imagenet_rgb
      pretrained: false
      weights: null
hist_beam:
  enabled: true
  num_classes: 64
  group_size: 8
  loss_weights:
    hierarchical: 1.0
    flat: 0.2
    orthogonality: 0.01
    scene_confusion: 0.05
    scene_private: 0.05
  prototype:
    enabled: true
    confidence_threshold: 0.6
  adaptation:
    entropy_weight: 0.01
    prototype_weight: 1.0
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  type: cross_entropy
training:
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  use_early_stopping: true
  early_stopping_metric: val_top1_avg
  early_stopping_mode: max
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_base
  group_by_scene: true
  progress:
    enabled: true
loso:
  variants: [v0_flat, v1_hierarchical, v3_decoupled, v4_adapter, v5_adapter_proto, v6_full_finetune]
  budgets: [0, 5, 10, 20, 50]
  seeds: [0, 1, 2]
  skip_scenes: []
  reuse_source_checkpoint: true
