experiment:
  name: hist_beam_mmw_sensor_assisted_smoke
  task: fusion
  objective: beam
  seed: 0
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    data_root: dataset/MMW/sunny
    seq_len: 5
    num_pred: 3
    portion: 0.02
    enabled_modalities: [image, gps, lidar]
    modality_profile: sensor_assisted_quick_validation
    image_profile: rgb_imagenet
    image_size: [224, 224]
    gps_feature_mode: relative_polar
    gps_normalize: false
    lidar_bev_size: [224, 224]
    lidar_normalize: false
    lidar_cache_dir: lidar_bev_cache
    use_mmwave: false
    mmwave_normalize: false
    use_csi: false
    radio_semantic:
      enabled: true
      mode: peak_spread
      group_size: 8
      num_spread_bins: 3
      entropy_thresholds: [0.35, 0.65]
      return_beam_power: true
    path_semantic:
      enabled: true
      mode: kmeans_path_descriptor
      num_path_classes: 24
      descriptor_dim: auto
      fit_on_source_only: true
      fallback_if_missing: radio_power
      use_path_regression: true
    return_geometry: true
    return_modality_availability: true
  cache:
    policy: auto
    lidar:
      policy: auto
  dataloader:
    train_batch_size: 1
    test_batch_size: 1
    num_workers: 0
model:
  modalities: [image, gps, lidar]
  feature_size: 16
  d_model: 32
  num_classes: 64
  seq_length_teacher: 5
  seq_length_student: 5
  num_pred: 3
  downsample_ratio: 1
  student:
    type: hist_beam_fusion
    modalities: [image, gps, lidar]
    feature_size: 16
    d_model: 32
    num_classes: 64
    num_pred: 3
    group_size: 8
    variant: v8_path_proto
    num_heads: 4
    num_layers: 1
    image_encoder:
      type: legacy_cnn
    adapter:
      enabled: true
      coarse_conditioned: true
      bottleneck_dim: 8
    radio_semantic:
      enabled: true
      mode: peak_spread
      num_spread_bins: 3
      entropy_thresholds: [0.35, 0.65]
      use_radio_head: true
      use_radio_condition_in_beam_head: true
    num_radio_classes: 24
    use_radio_head: true
    use_radio_condition_in_beam_head: true
    path_semantic:
      enabled: true
      mode: kmeans_path_descriptor
      num_path_classes: 24
      use_path_head: true
      use_path_condition_in_beam_head: true
      path_embed_dim: 16
      use_path_regression: true
    num_path_classes: 24
    use_path_head: true
    use_path_condition_in_beam_head: true
    path_embed_dim: 16
    proto_type: path
hist_beam:
  enabled: true
  profile: sensor_assisted_quick_validation
  sensor_assisted:
    enabled: true
  num_classes: 64
  group_size: 8
  proto_type: path
  excluded_sensitive_fields: [mmwave, csi, channel, path, beam_power]
  loss_weights:
    hierarchical: 1.0
    flat: 0.1
    orthogonality: 0.01
    scene_confusion: 0.0
    scene_private: 0.0
    radio_semantic: 1.0
    lambda_path: 0.3
    lambda_path_reg: 0.05
  prototype:
    enabled: true
    proto_type: path
    confidence_threshold: 0.75
  radio_semantic:
    enabled: true
    mode: peak_spread
    num_spread_bins: 3
    entropy_thresholds: [0.35, 0.65]
  path_semantic:
    enabled: true
    mode: kmeans_path_descriptor
    num_path_classes: 24
    descriptor_dim: auto
    fit_on_source_only: true
    fallback_if_missing: radio_power
    use_path_regression: true
  adaptation:
    epochs: 1
    proto_type: path
    entropy_weight: 0.01
    prototype_weight: 0.1
    proto_tau: 0.1
    confidence_threshold: 0.75
    proto_warmup_epochs: 1
    target_proto_momentum: 0.9
    allow_labeled_target_radio_supervision: true
    allow_labeled_target_path_supervision: true
    allow_target_sensitive_supervision_in_main_conclusion: false
distillation:
  type: no_kd
loss:
  type: cross_entropy
training:
  epochs: 1
  lr: 0.0005
  use_early_stopping: false
  cpu_threads:
    enabled: true
    intra_op: 2
    inter_op: 1
evaluation:
  k_values: [1, 3, 5]
output:
  dir: outputs
  run_name: hist_beam_mmw_sensor_assisted_smoke
  progress:
    enabled: false
loso:
  dataset_family: MMW
  profile: sensor_assisted_quick_validation
  data_availability_path: dataset/MMW/data_availability.json
  protocol: scenario_loso
  variants: [v3_decoupled, v4_adapter, v6_radio_proto, v8_path_proto, adapter_path_proto, v6_full_finetune]
  budgets: [10]
  seeds: [0, 1]
  max_runs: 1
  reuse_source_checkpoint: true
