experiment:
  name: hist_beam_v5_adapter_proto
  task: fusion
  objective: beam
data:
  dataset:
    type: deepsense6g
    scene: 31
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
model:
  modalities: [image, radar, gps]
  student:
    type: hist_beam_fusion
    modalities: [image, radar, gps]
    variant: v5_adapter_proto
    adapter:
      enabled: true
    prototype:
      enabled: true
hist_beam:
  enabled: true
  variant: v5_adapter_proto
  adapter:
    enabled: true
  prototype:
    enabled: true
    confidence_threshold: 0.6
