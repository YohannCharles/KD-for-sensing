experiment:
  name: hist_beam_v6_radio_proto
  task: fusion
  objective: beam
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    radio_semantic:
      enabled: true
      mode: peak_spread
      group_size: 8
      num_spread_bins: 3
      entropy_thresholds: [0.35, 0.65]
      return_beam_power: true
model:
  modalities: [image, gps, mmwave]
  student:
    type: hist_beam_fusion
    modalities: [image, gps, mmwave]
    variant: v6_radio_proto
    radio_semantic:
      enabled: true
      mode: peak_spread
      num_spread_bins: 3
      entropy_thresholds: [0.35, 0.65]
      use_radio_head: true
      use_radio_condition_in_beam_head: true
    num_radio_classes: 24
    use_radio_head: true
    use_radio_condition_in_beam_head: true
    proto_type: radio_semantic
    adapter:
      enabled: true
hist_beam:
  enabled: true
  variant: v6_radio_proto
  proto_type: radio_semantic
  radio_semantic:
    enabled: true
    mode: peak_spread
    num_spread_bins: 3
    entropy_thresholds: [0.35, 0.65]
  loss_weights:
    radio_semantic: 1.0
  prototype:
    enabled: true
    proto_type: radio_semantic
    confidence_threshold: 0.6
  adaptation:
    proto_type: radio_semantic
    entropy_weight: 0.01
    prototype_weight: 0.1
    target_private_momentum: 0.9
    target_private_warmup_epochs: 0
    target_private_min_count: 1
