_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_uniform_lastlayer_retrain_es40_seed2
  seed: 2
model:
  primary:
    ablation_id: proto_uniform_lastlayer_retrain_es40_seed2
training:
  epochs: 40
  max_epochs: 40
  missing_pattern_sampler: uniform
  lambda_proto: 0.05
  lambda_modality_proto: 0.0
  prototype_recenter: &id001
    enabled: true
    mode: lastlayer_retrain_proxy
    note: 'overnight proxy: low-prototype-weight retrain baseline'
loss:
  u_mask_beam_jepa:
    epochs: 40
    max_epochs: 40
    missing_pattern_sampler: uniform
    lambda_proto: 0.05
    lambda_modality_proto: 0.0
    prototype_recenter: *id001
evaluation:
  beam_distance_circular: true
output:
  run_name: proto_uniform_lastlayer_retrain_es40_seed2
  dir: outputs/scene31_magic_overnight_lmdb
