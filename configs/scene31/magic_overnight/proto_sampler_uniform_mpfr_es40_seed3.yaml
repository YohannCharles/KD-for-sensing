_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_sampler_uniform_mpfr_es40_seed3
  seed: 3
model:
  primary:
    ablation_id: proto_sampler_uniform_mpfr_es40_seed3
training:
  epochs: 40
  max_epochs: 40
  missing_pattern_sampler: pattern_balanced
  pattern_probs: &id001
    full: 0.1
    missing_gps: 0.25
    missing_radar: 0.25
    radar_only: 0.2
    lidar_only: 0.2
  use_pattern_loss_weight: true
  apply_pattern_weight_to_ce: true
  apply_pattern_weight_to_proto: false
  pattern_loss_weights: &id002
    missing_gps: 1.25
    missing_radar: 1.25
    radar_only: 1.5
    lidar_only: 1.5
  failure_replay: &id003
    enabled: true
    mode: missing_pattern_proxy
    replay_ratio: 0.5
    stage2_epochs: 20
    note: 'overnight proxy: pattern-balanced weighted replay, not strict sample-pair
      cache'
loss:
  u_mask_beam_jepa:
    epochs: 40
    max_epochs: 40
    missing_pattern_sampler: pattern_balanced
    pattern_probs: *id001
    use_pattern_loss_weight: true
    apply_pattern_weight_to_ce: true
    apply_pattern_weight_to_proto: false
    pattern_loss_weights: *id002
    failure_replay: *id003
evaluation:
  beam_distance_circular: true
output:
  run_name: proto_sampler_uniform_mpfr_es40_seed3
  dir: outputs/scene31_magic_overnight_lmdb
