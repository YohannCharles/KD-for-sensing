_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_uniform_pattern_proto_recenter_es40_seed1
  seed: 1
model:
  primary:
    ablation_id: proto_uniform_pattern_proto_recenter_es40_seed1
training:
  epochs: 40
  max_epochs: 40
  missing_pattern_sampler: pattern_balanced
  pattern_probs: &id001
    full: 1.0
    missing_gps: 1.0
    missing_radar: 1.0
    radar_only: 1.0
    lidar_only: 1.0
  lambda_proto: 0.35
  lambda_modality_proto: 0.2
  apply_pattern_weight_to_proto: true
  prototype_recenter: &id002
    enabled: true
    mode: shared_balanced_training_proxy
    patterns:
    - full
    - missing_gps
    - missing_radar
    - radar_only
    - lidar_only
    note: 'overnight proxy: pattern-balanced prototype training, not post-hoc checkpoint
      recenter'
loss:
  u_mask_beam_jepa:
    epochs: 40
    max_epochs: 40
    missing_pattern_sampler: pattern_balanced
    pattern_probs: *id001
    lambda_proto: 0.35
    lambda_modality_proto: 0.2
    apply_pattern_weight_to_proto: true
    prototype_recenter: *id002
evaluation:
  beam_distance_circular: true
output:
  run_name: proto_uniform_pattern_proto_recenter_es40_seed1
  dir: outputs/scene31_magic_overnight_lmdb
