_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_condbtapa_weaksingle_lam005_es40_seed5
  seed: 5
model:
  primary:
    ablation_id: proto_condbtapa_weaksingle_lam005_es40_seed5
training:
  epochs: 40
  max_epochs: 40
  use_btapa: true
  use_beam_prototype_alignment: true
  use_pattern_conditional_btapa: true
  btapa_tau_beam: 1.0
  btapa_lambda: 0.05
  btapa_modality_weight: 0.5
  btapa_disable_on_patterns: &id001 []
  btapa_fallback_to_ordinary_proto: true
  proto_target_type: gaussian
  btapa_apply_patterns: &id002
  - radar_only
  - lidar_only
loss:
  u_mask_beam_jepa:
    epochs: 40
    max_epochs: 40
    use_btapa: true
    use_beam_prototype_alignment: true
    use_pattern_conditional_btapa: true
    btapa_tau_beam: 1.0
    btapa_lambda: 0.05
    btapa_modality_weight: 0.5
    btapa_disable_on_patterns: *id001
    btapa_fallback_to_ordinary_proto: true
    proto_target_type: gaussian
    btapa_apply_patterns: *id002
output:
  run_name: proto_condbtapa_weaksingle_lam005_es40_seed5
  dir: outputs/scene31_next_round
