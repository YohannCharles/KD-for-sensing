_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_condbtapa_singleall_es20_seed1
  seed: 1
model:
  primary:
    ablation_id: proto_condbtapa_singleall_es20_seed1
training:
  use_btapa: true
  use_beam_prototype_alignment: true
  use_pattern_conditional_btapa: true
  btapa_tau_beam: 1.0
  btapa_lambda: 0.2
  btapa_modality_weight: 0.5
  btapa_disable_on_patterns: &id001 []
  btapa_fallback_to_ordinary_proto: true
  proto_target_type: gaussian
  btapa_apply_patterns: &id002
  - gps_only
  - image_only
  - radar_only
  - lidar_only
loss:
  u_mask_beam_jepa:
    use_btapa: true
    use_beam_prototype_alignment: true
    use_pattern_conditional_btapa: true
    btapa_tau_beam: 1.0
    btapa_lambda: 0.2
    btapa_modality_weight: 0.5
    btapa_disable_on_patterns: *id001
    btapa_fallback_to_ordinary_proto: true
    proto_target_type: gaussian
    btapa_apply_patterns: *id002
output:
  run_name: proto_condbtapa_singleall_es20_seed1
