_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_weakkd_hardall_l01_t15_es20_seed2
  seed: 2
model:
  primary:
    ablation_id: proto_weakkd_hardall_l01_t15_es20_seed2
training:
  use_weak_pattern_kd: true
  kd_teacher: full_modality_same_model_stopgrad
  kd_loss_type: kl_logits
  kd_apply_patterns: &id001
  - missing_gps
  - non_gps_only
  - radar_only
  - lidar_only
  lambda_kd: 0.1
  kd_temperature: 1.5
loss:
  u_mask_beam_jepa:
    use_weak_pattern_kd: true
    kd_teacher: full_modality_same_model_stopgrad
    kd_loss_type: kl_logits
    kd_apply_patterns: *id001
    lambda_kd: 0.1
    kd_temperature: 1.5
output:
  run_name: proto_weakkd_hardall_l01_t15_es20_seed2
