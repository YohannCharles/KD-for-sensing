_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_latpred_fullh_weaksingle_l005_es20_seed2
  seed: 2
model:
  primary:
    ablation_id: proto_latpred_fullh_weaksingle_l005_es20_seed2
    use_light_latent_pred: true
    latent_pred_hidden_dim: 256
    latent_pred_target: full_fused
training:
  use_light_latent_pred: true
  latent_pred_apply_patterns: &id001
  - radar_only
  - lidar_only
  latent_pred_target: full_fused
  lambda_latent_pred: 0.05
  latent_pred_loss: cosine
loss:
  u_mask_beam_jepa:
    use_light_latent_pred: true
    latent_pred_apply_patterns: *id001
    latent_pred_target: full_fused
    lambda_latent_pred: 0.05
    latent_pred_loss: cosine
output:
  run_name: proto_latpred_fullh_weaksingle_l005_es20_seed2
