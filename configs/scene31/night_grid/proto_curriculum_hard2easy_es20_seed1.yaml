_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_curriculum_hard2easy_es20_seed1
  seed: 1
model:
  primary:
    ablation_id: proto_curriculum_hard2easy_es20_seed1
training:
  missing_pattern_sampler: curriculum_hard_to_easy
  curriculum_schedule: &id001
    epochs_1_5:
    - gps_only
    - image_only
    - radar_only
    - lidar_only
    epochs_6_10:
    - missing_gps
    - non_gps_only
    epochs_11_20:
    - full
    - missing_image
    - missing_radar
    - missing_lidar
loss:
  u_mask_beam_jepa:
    missing_pattern_sampler: curriculum_hard_to_easy
    curriculum_schedule: *id001
output:
  run_name: proto_curriculum_hard2easy_es20_seed1
