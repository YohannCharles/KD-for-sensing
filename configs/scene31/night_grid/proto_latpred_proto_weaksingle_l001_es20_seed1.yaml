_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_latpred_proto_weaksingle_l001_es20_seed1
  seed: 1
model:
  primary:
    ablation_id: proto_latpred_proto_weaksingle_l001_es20_seed1
    use_light_latent_pred: true
    latent_pred_hidden_dim: 256
    latent_pred_target: prototype_distribution
training:
  use_light_latent_pred: true
  latent_pred_apply_patterns: &id001
  - radar_only
  - lidar_only
  latent_pred_target: prototype_distribution
  lambda_latent_pred: 0.01
  latent_pred_loss: kl
loss:
  u_mask_beam_jepa:
    use_light_latent_pred: true
    latent_pred_apply_patterns: *id001
    latent_pred_target: prototype_distribution
    lambda_latent_pred: 0.01
    latent_pred_loss: kl
output:
  run_name: proto_latpred_proto_weaksingle_l001_es20_seed1
