_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: proto_uniform_pattern_logit_bias_seed1
  seed: 1
model:
  primary:
    ablation_id: proto_uniform_pattern_logit_bias_seed1
training:
  epochs: 40
  max_epochs: 40
  missing_pattern_sampler: uniform
loss:
  u_mask_beam_jepa:
    epochs: 40
    max_epochs: 40
    missing_pattern_sampler: uniform
evaluation:
  beam_distance_circular: true
output:
  run_name: proto_uniform_pattern_logit_bias_seed1
  dir: outputs/scene31_funnel_lmdb
logit_calibration:
  enabled: true
  mode: pattern_class_bias
  l2: 0.01
  max_iter: 200
