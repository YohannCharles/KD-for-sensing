_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: amr_lite_natural_es40_seed3
  seed: 3
model:
  primary:
    ablation_id: amr_lite_natural_es40_seed3
    type: modular_sequence
    modalities:
    - image
    - radar
    - gps
    - lidar
    image_profile: rgb_imagenet
    image_channels: 3
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 1
    consume_missing_modality_metadata: true
    paper_metadata:
      baseline_scope: local_experimental_baseline
      baseline_family: amr_lite
    encoders:
      image:
        type: resnet18_imagenet_rgb
        pretrained: false
        weights: null
        freeze_backbone: true
      radar:
        type: radar_cnn
      gps:
        type: gps_mlp
      lidar:
        type: lidar_cnn
    representation_core:
      type: amr_lite
      d_model: 64
      hidden_dim: 64
      dropout: 0.1
      imputation_type: learnable_token
    heads:
      beam:
        type: beam_head
training:
  epochs: 40
  max_epochs: 40
loss:
  u_mask_beam_jepa:
    enabled: false
    epochs: 40
    max_epochs: 40
  type: focal_loss
  alpha: 1
  gamma: 2
evaluation:
  beam_distance_circular: true
output:
  run_name: amr_lite_natural_es40_seed3
  dir: outputs/scene31_baseline_pack_lmdb
