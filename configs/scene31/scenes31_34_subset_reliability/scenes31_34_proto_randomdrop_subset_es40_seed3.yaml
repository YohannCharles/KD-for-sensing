_base_: ../templates/main_v3_proto_es20_base.yaml
experiment:
  name: scenes31_34_proto_randomdrop_subset_es40_seed3
  seed: 3
model:
  primary:
    ablation_id: scenes31_34_proto_randomdrop_subset_es40_seed3
    fusion_type: weighted_sum
    use_jepa_loss: false
    use_beam_prototype_alignment: true
    use_full_to_partial_kd: false
    kd_teacher_mode: disabled
    use_mask_adapter: false
training:
  epochs: 40
  max_epochs: 40
  random_modality_dropout: &id001
    enabled: true
    mode: random_nonempty_subset
    modalities:
    - image
    - radar
    - gps
    - lidar
    ensure_at_least_one_modality: true
loss:
  u_mask_beam_jepa:
    enabled: false
    epochs: 40
    max_epochs: 40
    random_modality_dropout: *id001
evaluation:
  beam_distance_circular: true
output:
  run_name: scenes31_34_proto_randomdrop_subset_es40_seed3
  dir: outputs/scenes31_34_subset_reliability_lmdb
data:
  dataset:
    type: deepsense6g
    scene: 31
    scenes: &id002
    - 31
    - 32
    - 33
    - 34
    train_scenes: *id002
    validation_scenes: *id002
    test_scenes: *id002
    split_protocol: stratified_80_10_10
    split_strategy: stratified_by_target_beam_per_scene
    split_seed: 42
    split_source_splits:
    - train
    - test
    split_fractions:
      train: 0.8
      validation: 0.1
      test: 0.1
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    sample_cache:
      enabled: false
