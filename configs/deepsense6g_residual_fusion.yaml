experiment:
  name: deepsense6g_gps_residual_fusion
  protocol: target_adapt_beambench_residual
  default_ablation: gps_plus_residual_gated_anchor

data:
  dataset_type: deepsense6g
  data_root: dataset/DeepSense6G
  gps_sweep_root: outputs/analysis/deepsense6g_gps_adapter_v2_support_sweep
  label_space: mapping_disabled
  support_ratio: 0.15
  num_beams: 64
  train_split: train
  test_split: test
  train_csv_name: train_seqs_RA_GPS_LIDAR.csv
  test_csv_name: test_seqs_RA_GPS_LIDAR.csv
  scenes:
    - scenario31
    - scenario32
    - scenario33
    - scenario34

residual:
  gps_protocol: target_adapt_beambench
  gps_ablation: best
  gps_prior_fallback_sigma: 2.0
  good_error_threshold: 4
  query_label_used_for_training: false
  model_selection_split: target_support_internal_validation
  allow_query_labels_for_evaluation: true

modalities:
  gps_context:
    enabled: true
  image:
    enabled: auto
    encoder: tiny_cnn
  lidar:
    enabled: auto
    encoder: array
  radar:
    enabled: auto
    encoder: array
  all_available:
    enabled: auto

model:
  name: gps_anchored_residual_fusion
  gps_context_dim: 9
  hidden_dim: 64
  dropout: 0.1
  correction_scale_init: 0.5
  correction_scale_max: 3.0
  use_gate: true
  use_anchor: true

loss:
  final_circular_soft_ce_weight: 1.0
  modality_aux_ce_weight: 0.1
  gate_bce_weight: 0.1
  good_anchor_kl_weight: 0.1
  correction_l2_weight: 0.001
  hard_sample_weight: 1.0
  circular_sigma: 2.0

train:
  seed: 42
  epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  source_pretrain_epochs: 5
  support_finetune_epochs: 15
  source_missing_fallback: support_only
  early_stopping_metric: target_support_DBA

rerank:
  gps_top_k: 16
  local_radius: 8
  modality_top_m: 8
  score_temperature: 1.0

metrics:
  dba_delta: 5.0
  good_error_threshold: 4
  topk:
    - 1
    - 3
    - 5
  gps_r15_expected:
    DBA: 0.6707
    mean_circular_error: 2.344
    error_lt4: 0.8523
  gps_reproduction_tolerance:
    DBA: 0.02
    mean_circular_error: 0.20
    error_lt4: 0.03

outputs:
  root: outputs/analysis/deepsense6g_residual_fusion
  write_predictions: true
  write_diagnostics: true
  write_config_snapshot: true
  figures_dir: figures
  manifest_dir: manifest
  default_result_dir: outputs/analysis/deepsense6g_residual_fusion/r15/mapping_disabled

ablation:
  enabled:
    - gps_prior_only
    - gps_context_only_residual
    - gps_plus_residual_no_gate
    - gps_plus_residual_gated
    - gps_plus_residual_gated_anchor
    - gps_topk_rerank
  optional_modalities:
    - image_plus_gps_residual
    - lidar_plus_gps_residual
    - radar_plus_gps_residual
    - all_available_modalities_residual
