description: Raymobtime s008 sensing-only modality imbalance diagnosis matrix.
base_config: configs/raymobtime/s008_multitask_selection.yaml
execution:
  environment: kd_mm_beam
  command_prefix: conda run -n kd_mm_beam python scripts/train.py
  output_dir: outputs/raymobtime_s008/experiments
  analysis_output_dir: outputs/raymobtime_s008/analysis/s008_modality_imbalance_diagnosis
controls:
  cache_dir: outputs/raymobtime_s008/cache
  data_root: dataset/Raymobtime/s008
  portion: 1.0
  portion_strategy: even
  portion_seed: 42
  image_size: [224, 224]
  sensing_only_modalities: [coord, image, lidar]
  seed_set: [42, 7, 123]
common_overrides:
  output.progress.enabled: false
  output.dir: outputs/raymobtime_s008/experiments
  output.group_by_scene: false
  data.dataset.cache_dir: outputs/raymobtime_s008/cache
  data.dataset.portion: 1.0
  data.dataset.portion_strategy: even
  data.dataset.portion_seed: 42
  data.dataset.image_size: [224, 224]
  data.dataset.image_resize_in_dataset: false
  model.modalities: [coord, image, lidar]
  model.student.modalities: [coord, image, lidar]
  model.student.type: task_aware_gated_multitask_selection
single_task_matrix:
  modalities:
    coord: [coord]
    image: [image]
    lidar: [lidar]
    coord_image_lidar: [coord, image, lidar]
  objectives:
    beam: current_beam_selection
    los: current_los_classification
    link: current_link_quality
runs:
  - name: beam_only_multitask_model
    phase: seed42_task_combo
    seed: 42
    run_name: s008_multitask_cil_beam_only_seed42
    task_combo: beam
    loss_weights:
      beam_selection: 1.0
      los: 0.0
      link_quality: 0.0
  - name: beam_los
    phase: seed42_task_combo
    seed: 42
    run_name: s008_multitask_cil_beam_los_seed42
    task_combo: beam+los
    loss_weights:
      beam_selection: 1.0
      los: 0.5
      link_quality: 0.0
  - name: beam_link
    phase: seed42_task_combo
    seed: 42
    run_name: s008_multitask_cil_beam_link_seed42
    task_combo: beam+link
    loss_weights:
      beam_selection: 1.0
      los: 0.0
      link_quality: 0.2
  - name: beam_los_link_original
    phase: seed42_task_combo
    seed: 42
    run_name: s008_multitask_cil_original_seed42
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 1.0
      los: 0.5
      link_quality: 0.2
  - name: beam_los_link_equal
    phase: seed42_loss_weight
    seed: 42
    run_name: s008_multitask_cil_equal_seed42
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 1.0
      los: 1.0
      link_quality: 1.0
  - name: beam_los_link_beam_heavy
    phase: seed42_loss_weight
    seed: 42
    run_name: s008_multitask_cil_beam_heavy_seed42
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 2.0
      los: 0.25
      link_quality: 0.1
  - name: beam_los_link_original_seed7
    phase: key_seed_extension
    seed: 7
    run_name: s008_multitask_cil_original_seed7
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 1.0
      los: 0.5
      link_quality: 0.2
  - name: beam_los_link_beam_heavy_seed7
    phase: key_seed_extension
    seed: 7
    run_name: s008_multitask_cil_beam_heavy_seed7
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 2.0
      los: 0.25
      link_quality: 0.1
  - name: beam_los_link_original_seed123
    phase: key_seed_extension
    seed: 123
    run_name: s008_multitask_cil_original_seed123
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 1.0
      los: 0.5
      link_quality: 0.2
  - name: beam_los_link_beam_heavy_seed123
    phase: key_seed_extension
    seed: 123
    run_name: s008_multitask_cil_beam_heavy_seed123
    task_combo: beam+los+link
    loss_weights:
      beam_selection: 2.0
      los: 0.25
      link_quality: 0.1
