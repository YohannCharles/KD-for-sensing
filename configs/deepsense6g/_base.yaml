experiment:
  task: fusion
  objective: beam
  seed: 1
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    data_root: dataset/DeepSense6G/scenario31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 5
    num_pred: 1
    portion: 1.0
    portion_strategy: even
    portion_seed: 42
    image_profile: rgb_imagenet
    image_size: [224, 224]
    fft_tuple: [64, 256, 128]
    clipped_range: 128
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    validation_batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
temporal_missing:
  enabled: true
  history_window: 5
  prediction_window: 1
  mode: balanced_pattern_schedule
  schedule_id: deepsense6g_fair_pattern_v1
  panel_size: 600
  condition_counts:
    clean: 120
    drop1: 60
    drop2: 60
    drop3: 60
    token20: 60
    token40: 60
    token60: 60
    token80: 60
    token90: 60
  subset_balance: exact_within_drop_count
  token_balance: exact_aggregate_cell_marginals
  preserve_unmasked_for_superset: false
model:
  feature_size: 64
  d_model: 64
  num_classes: 64
  seq_length: 5
  num_pred: 1
  modalities: [image, radar, gps, lidar]
  image_profile: rgb_imagenet
training:
  epochs: 40
  max_epochs: 40
  lr: 0.0005
  weight_decay: 0.0003
  optimizer:
    type: adamw
  resume: false
  amp:
    enabled: true
    dtype: float16
    grad_scaler: true
  validation:
    interval_epochs: 40
  allow_tf32: true
  cudnn_benchmark: false
scheduler:
  type: cosine_warm_restarts
  T_0: 40
  T_mult: 1
  eta_min: 0.000001
evaluation:
  k_values: [1, 5]
  dba_delta: 5
  missing_patterns:
    enabled: true
    patterns:
      - full
      - missing_image
      - missing_radar
      - missing_gps
      - missing_lidar
      - image_only
      - radar_only
      - gps_only
      - lidar_only
      - missing_image_radar
      - missing_image_gps
      - missing_image_lidar
      - missing_radar_gps
      - missing_radar_lidar
      - missing_gps_lidar
    prediction_index: last
output:
  dir: outputs/deepsense6g
  run_name: scene31_seed1
  group_by_scene: false
  overwrite: false
  progress:
    enabled: false
  tensorboard:
    enabled: false
