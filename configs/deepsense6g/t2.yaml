_base_: _base.yaml
experiment:
  name: T2
model:
  primary:
    type: u_mask_beam_jepa
    modalities: [image, radar, gps, lidar]
    image_profile: rgb_imagenet
    image_channels: 3
    radar_channels: 2
    lidar_channels: 3
    gps_input_size: 3
    d_model: 64
    num_classes: 64
    dropout: 0.1
    fusion_type: supervised_router
    head_type: prototype
    beam_proto_temperature: 0.1
    router_use_pattern_features: false
    router_use_reliability_features: true
    router_use_prototype_margin: true
    router_use_entropy: true
    router_use_confidence: true
    router_use_logit_norm: true
    consume_missing_modality_metadata: true
    temporal_pooling:
      enabled: true
      type: masked_mean
    encoders:
      image:
        type: tinyvit_5m_scratch_rgb
        output_dim: 64
        pretrained: false
        freeze_backbone: false
      radar:
        type: radar_cnn
        output_dim: 64
        pretrained: false
        freeze_backbone: false
      gps:
        type: gps_mlp
        output_dim: 64
        hidden_size: 64
        dropout: 0.1
        pretrained: false
        freeze_backbone: false
      lidar:
        type: tinyvit_5m_scratch_rgb
        output_dim: 64
        pretrained: false
        freeze_backbone: false
loss:
  type: cross_entropy
  u_mask_beam_jepa:
    enabled: true
    router_supervision: oracle
    use_beam_prototype_alignment: true
    lambda_proto: 0.2
    lambda_modality_proto: 0.1
    beam_label_sigma: 2.0
    prototype_target_circular: true
    circular_beam_distance: true
    use_amber_cma_analogue: false
    lambda_amber_cma: 0.2
    amber_cma_temperature: 0.2
    router_oracle_weight: 0.1
    router_oracle_target_mode: hard_first
    router_oracle_temperature: 1.0
    missing_mask:
      p_missing: [0.25, 0.25, 0.25, 0.1]
      ensure_at_least_one: true
    superset_consistency:
      enabled: true
      confidence_gated_kl: true
      kl_weight: 0.2
      temperature: 2.0
bcacl:
  enabled: false
  training_regime: aux_joint
  stage: aux_joint
  projection:
    dim: 256
    layer_norm: true
    dropout: 0.0
  private_heads:
    enabled: true
  shared_head:
    enabled: true
  lambda_shared: 1.0
  distill_from_pre_dropout_modalities: true
  diagnostics:
    enabled: true
cmsbl:
  enabled: false
  aux_schedule:
    enabled: false
    private:
      start_weight: 1.0
      end_weight: 0.2
      start_epoch: 5
      end_epoch: 20
    shared:
      start_weight: 1.0
      end_weight: 0.2
      start_epoch: 5
      end_epoch: 20
  capacity_reference:
    stats_path: null
    source_split: inner_train
  capacity_gap:
    enabled: false
    ema_momentum: 0.9
    warmup_epochs: 3
    update_interval: 1
    alpha: 1.0
    gamma: 1.0
    min_weight: 1.0
    max_weight: 2.0
    apply_to: [private, shared]
    eps: 1.0e-6
  hard_mask:
    enabled: false
    ema_momentum: 0.9
    warmup_epochs: 3
    update_interval: 1
    min_count: 8
    gamma: 0.5
    min_weight: 0.75
    max_weight: 1.75
    normalize_mean_to_one: true
    full_mask_min_weight: 1.0
    eps: 1.0e-6
  diagnostics:
    enabled: true
training:
  grad_clip: 5.0
temporal_missing:
  preserve_unmasked_for_superset: true
