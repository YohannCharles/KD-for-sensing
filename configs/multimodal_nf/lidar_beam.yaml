experiment:
  name: multimodal_nf_lidar_beam
  task: lidar
  objective: near_field_beam_selection
  variant: multimodal_nf_future_beam
  seed: 7

data:
  dataset:
    type: multimodal_nf
    data_root: dataset/MultimodalNF
    codebook_profile: small
    split_mode: city
    seq_len: 8
    num_pred: 3
    eval_portion: 0.25
  dataloader:
    batch_size: 16
    num_workers: 2
    prefetch_factor: 1
    test_num_workers: 0
    pin_memory: true

model:
  modalities: [lidar]
  feature_size: 64
  num_classes: 4000
  num_pred: 3
  seq_length_teacher: 8
  seq_length_student: 8
  downsample_ratio: 1
  student:
    type: modular_sequence
    modalities: [lidar]
    feature_size: 64
    num_classes: 4000
    num_pred: 3
    input_profiles:
      lidar: point_cloud_xyz_10000
    representation_core:
      type: single_gru
    encoders:
      lidar:
        type: point_cloud_mlp
        input_profile: point_cloud_xyz_10000
        output_dim: 64

distillation:
  type: no_kd

training:
  epochs: 20
  lr: 0.001
  cpu_threads:
    intra_op: 2
    inter_op: 1
  use_early_stopping: true
  patience: 5
  early_stopping_metric: val_beam_top1
  early_stopping_mode: max

evaluation:
  k_values: [1, 3, 5]

output:
  dir: outputs/multimodal_nf/experiments
  run_name: lidar_beam
  group_by_scene: false
  progress:
    enabled: true
