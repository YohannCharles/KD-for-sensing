experiment:
  name: multimodal_nf_csi_only
  task: csi
  objective: near_field_beam_selection
  variant: multimodal_nf_future_beam
  seed: 7

data:
  dataset:
    type: multimodal_nf
    data_root: dataset/MultimodalNF
    codebook_profile: small
    csi_subcarrier_policy: single
    split_mode: city
    seq_len: 8
    num_pred: 3
  dataloader:
    batch_size: 2
    num_workers: 0
    pin_memory: false

model:
  modalities: [csi]
  feature_size: 32
  num_classes: 4000
  num_pred: 3
  seq_length_teacher: 8
  seq_length_student: 8
  downsample_ratio: 1
  student:
    type: modular_sequence
    modalities: [csi]
    feature_size: 32
    num_classes: 4000
    num_pred: 3
    input_profiles:
      csi: xl_mimo_nf
    representation_core:
      type: single_gru
    encoders:
      csi:
        type: pilot_dual_view_csi
        input_profile: xl_mimo_nf
        output_dim: 32
        use_internal_gru: false

distillation:
  type: no_kd

training:
  epochs: 1
  lr: 0.001
  use_early_stopping: false
  early_stopping_metric: val_beam_top1
  early_stopping_mode: max

evaluation:
  k_values: [1, 3, 5]

output:
  dir: outputs/multimodal_nf/csi_only
  run_name: csi_only
  group_by_scene: false
  overwrite: true
  progress:
    enabled: false
