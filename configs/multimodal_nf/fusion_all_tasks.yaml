experiment:
  name: multimodal_nf_fusion_all_tasks
  task: fusion
  objective: selection_multitask
  variant: multimodal_nf_future_beam
  seed: 7

data:
  dataset:
    type: multimodal_nf
    data_root: dataset/MultimodalNF
    codebook_profile: small
    split_mode: city
    seq_len: 8
    num_pred: 3
    eval_portion: 0.25
  cache:
    multimodal_nf:
      image:
        policy: auto
        validation_mode: lightweight
      lidar:
        policy: auto
        validation_mode: lightweight
  dataloader:
    batch_size: 8
    num_workers: 4
    prefetch_factor: 1
    persistent_workers: true
    test_num_workers: 1
    test_prefetch_factor: 1
    pin_memory: true

model:
  modalities: [image, lidar, gps]
  feature_size: 64
  num_classes: 4000
  num_pred: 3
  seq_length_teacher: 8
  seq_length_student: 8
  downsample_ratio: 1
  student:
    type: modular_sequence
    modalities: [image, lidar, gps]
    feature_size: 64
    num_classes: 4000
    num_pred: 3
    image_profile: rgb_imagenet
    auxiliary_heads:
      enabled: true
      los: true
      link_quality: true
    input_profiles:
      image: rgb_imagenet
      lidar: point_cloud_xyz_10000
      gps: uav_xyz_snapshot
    representation_core:
      type: early_concat_gru
    encoders:
      image:
        type: resnet18_imagenet_rgb
        image_profile: rgb_imagenet
        output_dim: 64
      lidar:
        type: point_cloud_mlp
        input_profile: point_cloud_xyz_10000
        output_dim: 64
      gps:
        type: gps_mlp
        gps_input_size: 3
        output_dim: 64

loss:
  type: cross_entropy
  objective:
    weights:
      beam_selection: 1.0
      los: 0.5
      link_quality: 0.2
    los:
      pos_weight: null
    link_quality:
      type: smooth_l1
      beta: 1.0

distillation:
  type: no_kd

training:
  epochs: 20
  lr: 0.001
  epoch_subsampling:
    enabled: false
    fraction: null
    num_samples: null
    seed: null
    rotate_each_epoch: true
    shuffle: false
    order: locality
    block_size: null
  amp:
    enabled: true
    dtype: float16
  cpu_threads:
    intra_op: 2
    inter_op: 1
  use_early_stopping: true
  patience: 5
  early_stopping_metric: val_selection_multitask_loss
  early_stopping_mode: min

evaluation:
  k_values: [1, 3, 5]

output:
  dir: outputs/multimodal_nf/experiments
  run_name: fusion_all_tasks
  group_by_scene: false
  progress:
    enabled: false
