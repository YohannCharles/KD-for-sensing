experiment:
  name: multimodal_nf_image_lidar
  task: fusion
  objective: near_field_beam_selection
  variant: multimodal_nf_future_beam
  seed: 7

data:
  dataset:
    type: multimodal_nf
    data_root: dataset/MultimodalNF
    codebook_profile: small
    split_mode: city
    seq_len: 8
    num_pred: 3
  cache:
    multimodal_nf:
      image:
        policy: auto
        validation_mode: lightweight
      lidar:
        policy: auto
        validation_mode: lightweight
  dataloader:
    batch_size: 2
    num_workers: 2
    prefetch_factor: 1
    persistent_workers: true
    test_num_workers: 1
    test_prefetch_factor: 1
    pin_memory: true

model:
  modalities: [image, lidar]
  feature_size: 32
  num_classes: 4000
  num_pred: 3
  seq_length_teacher: 8
  seq_length_student: 8
  downsample_ratio: 1
  student:
    type: modular_sequence
    modalities: [image, lidar]
    feature_size: 32
    num_classes: 4000
    num_pred: 3
    image_profile: rgb_imagenet
    input_profiles:
      image: rgb_imagenet
      lidar: point_cloud_xyz_10000
    representation_core:
      type: early_concat_gru
    encoders:
      image:
        type: resnet18_imagenet_rgb
        image_profile: rgb_imagenet
        output_dim: 32
      lidar:
        type: point_cloud_mlp
        input_profile: point_cloud_xyz_10000
        output_dim: 32

distillation:
  type: no_kd

training:
  epochs: 1
  lr: 0.001
  epoch_subsampling:
    enabled: false
    fraction: null
    num_samples: null
    seed: null
    rotate_each_epoch: true
    shuffle: false
    order: locality
    block_size: null
  amp:
    enabled: true
    dtype: float16
  use_early_stopping: false
  early_stopping_metric: val_beam_top1
  early_stopping_mode: max

evaluation:
  k_values: [1, 3, 5]

output:
  dir: outputs/multimodal_nf/image_lidar
  run_name: image_lidar
  group_by_scene: false
  overwrite: true
  progress:
    enabled: false
