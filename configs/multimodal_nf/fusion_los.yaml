experiment:
  name: multimodal_nf_fusion_los
  task: fusion
  objective: current_los_classification
  variant: multimodal_nf_future_beam
  seed: 7

data:
  dataset:
    type: multimodal_nf
    data_root: dataset/MultimodalNF
    codebook_profile: small
    split_mode: city
    seq_len: 8
    num_pred: 3
    eval_portion: 0.25
  dataloader:
    batch_size: 8
    num_workers: 2
    prefetch_factor: 1
    test_num_workers: 0
    pin_memory: true

model:
  modalities: [image, lidar, gps]
  feature_size: 64
  num_classes: 4000
  num_pred: 3
  seq_length_teacher: 8
  seq_length_student: 8
  downsample_ratio: 1
  student:
    type: modular_sequence
    modalities: [image, lidar, gps]
    feature_size: 64
    num_classes: 4000
    num_pred: 3
    image_profile: rgb_imagenet
    auxiliary_heads:
      enabled: true
      los: true
    input_profiles:
      image: rgb_imagenet
      lidar: point_cloud_xyz_10000
      gps: uav_xyz_snapshot
    representation_core:
      type: early_concat_gru
    encoders:
      image:
        type: resnet18_imagenet_rgb
        image_profile: rgb_imagenet
        output_dim: 64
      lidar:
        type: point_cloud_mlp
        input_profile: point_cloud_xyz_10000
        output_dim: 64
      gps:
        type: gps_mlp
        gps_input_size: 3
        output_dim: 64

distillation:
  type: no_kd

training:
  epochs: 20
  lr: 0.001
  cpu_threads:
    intra_op: 2
    inter_op: 1
  use_early_stopping: true
  patience: 5
  early_stopping_metric: val_los_f1
  early_stopping_mode: max

evaluation:
  k_values: [1, 3, 5]

output:
  dir: outputs/multimodal_nf/experiments
  run_name: fusion_los
  group_by_scene: false
  progress:
    enabled: true
