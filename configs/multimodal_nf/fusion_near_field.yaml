experiment:
  name: multimodal_nf_fusion_near_field
  task: fusion
  objective: near_field_beam_selection
  variant: multimodal_nf_future_beam
  seed: 7

data:
  dataset:
    type: multimodal_nf
    data_root: dataset/MultimodalNF
    codebook_profile: small
    split_mode: city
    seq_len: 8
    num_pred: 3
  dataloader:
    batch_size: 2
    num_workers: 0
    pin_memory: false

model:
  modalities: [image, lidar, gps]
  feature_size: 32
  num_classes: 4000
  num_pred: 3
  seq_length_teacher: 8
  seq_length_student: 8
  downsample_ratio: 1
  student:
    type: modular_sequence
    modalities: [image, lidar, gps]
    feature_size: 32
    num_classes: 4000
    num_pred: 3
    image_profile: rgb_imagenet
    input_profiles:
      image: rgb_imagenet
      lidar: point_cloud_xyz_10000
      gps: uav_xyz_snapshot
    representation_core:
      type: early_concat_gru
    encoders:
      image:
        type: resnet18_imagenet_rgb
        image_profile: rgb_imagenet
        output_dim: 32
      lidar:
        type: point_cloud_mlp
        input_profile: point_cloud_xyz_10000
        output_dim: 32
      gps:
        type: gps_mlp
        gps_input_size: 3
        output_dim: 32

distillation:
  type: no_kd

training:
  epochs: 1
  lr: 0.001
  use_early_stopping: false
  early_stopping_metric: val_beam_top1
  early_stopping_mode: max

evaluation:
  k_values: [1, 3, 5]

output:
  dir: outputs/multimodal_nf/fusion_near_field
  run_name: fusion_near_field
  group_by_scene: false
  overwrite: true
  progress:
    enabled: false
