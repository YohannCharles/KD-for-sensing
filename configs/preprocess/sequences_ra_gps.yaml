preprocessing:
  type: sequence_csv
  csv_path: dataset/DeepSense6G/scenario31/scenario31_RA.csv
  data_root: dataset/DeepSense6G/scenario31
  output_suffix: _RA_GPS
  in_len: 8
  out_len: 3
  training_set_pct: 0.8
  split_strategy: balanced_seq
  split_seed: 42
  min_test_sequences: 5
  include_gps: true
  gps_column: unit2_loc_cal
  gps_fallback_column: unit2_loc
  bs_gps_column: unit1_loc
