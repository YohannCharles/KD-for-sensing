preprocessing:
  type: image_motion_cache
  csv_paths:
    - dataset/scenario9/train_seqs_RA_GPS_LIDAR.csv
    - dataset/scenario9/test_seqs_RA_GPS_LIDAR.csv
  data_root: dataset/scenario9
  cache_dir: dataset/scenario9/image_motion_cache
  camera_prefix: camera
  image_size: [224, 224]
  gaussian_sigma: 1.0
  threshold_ratio: 0.1
  threshold_strategy: relative_max
  grayscale: rgb2gray
  cache_version: v1
  overwrite: false
  progress: true
