preprocessing:
  type: sample_lmdb_cache
  path: outputs/cache/MMW/sunny/sample_lmdb/Town03_5wayroad_seed28/seq5_pred1_{split}.lmdb
  splits: [train, test]
  map_size_gb: 64
  overwrite: false
  progress: true
  dataset:
    type: mmw
    condition: sunny
    scene: Town03_5wayroad_seed28
    train_csv_name: Prepared/Town03_5wayroad_seed28/splits/h5p1/train.csv
    test_csv_name: Prepared/Town03_5wayroad_seed28/splits/h5p1/test.csv
    seq_len: 5
    num_pred: 1
    portion: 1.0
    enabled_modalities: [image, gps, lidar]
    image_profile: rgb_imagenet
    image_size: [224, 224]
    image_use_cache: true
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_use_cache: true
    lidar_normalize: false
