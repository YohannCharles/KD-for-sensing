preprocessing:
  type: sequence_csv
  csv_path: dataset/scenario32/scenario32_RA.csv
  data_root: dataset/scenario32
  output_suffix: _RA_LIDAR
  in_len: 8
  out_len: 3
  training_set_pct: 0.8
  split_strategy: balanced_seq
  split_seed: 42
  min_test_sequences: 5
  include_lidar: true
  lidar_column: unit1_lidar
  lidar_fallback_column: unit1_lidar_SCR
