preprocessing:
  type: lidar_bev_cache
  csv_paths:
    - dataset/scenario32/train_seqs_RA_GPS_LIDAR.csv
    - dataset/scenario32/test_seqs_RA_GPS_LIDAR.csv
  data_root: dataset/scenario32
  cache_dir: dataset/scenario32/lidar_bev_cache
  lidar_prefix: lidar
  bev_size: [224, 224]
  roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
  remove_ground: false
  ground_z_threshold: 0.1
  overwrite: false
  progress: true
  cache_version: v1
