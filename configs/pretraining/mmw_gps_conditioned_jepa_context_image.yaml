experiment:
  name: mmw_gps_conditioned_jepa_context_image
  task: fusion
  objective: gps_conditioned_jepa
  seed: 7
  device: auto
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    seq_len: 4
    num_pred: 1
    portion: 1.0
    enabled_modalities:
    - image
    - gps
    image_profile: rgb_imagenet
    image_size:
    - 224
    - 224
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    return_metadata: true
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
    num_workers: 0
    pin_memory: false
    persistent_workers: false
model:
  modalities:
  - image
  - gps
  feature_size: 64
  d_model: 64
  num_classes: 1
  num_pred: 1
  downsample_ratio: 1
  seq_length: 4
  primary:
    type: gps_conditioned_jepa
    modalities:
    - image
    - gps
    image_profile: rgb_imagenet
    image_channels: 3
    gps_input_size: 3
    latent_dim: 64
    num_classes: 1
    ema_decay: 0.99
    visual_encoder:
      type: patch_vit
      image_channels: 3
      latent_dim: 64
      patch_size: 16
      depth: 1
      num_heads: 4
      max_tokens: 196
      dropout: 0.0
      checkpoint_policy: fresh_stage1_required
      variant_id: mmw_patch16_jepa_stage1
    conditioning:
      type: film
      hidden_dim: 128
    predictor:
      hidden_dim: 128
      max_tokens: 196
      dropout: 0.0
    mask_sampler:
      mode: random
      context_ratio: 0.6
      target_ratio: 0.2
      seed: 7
loss:
  type: focal_loss
  jepa:
    type: mse
    latent_normalize: false
    weight: 1.0
training:
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 5.0
  patience: 5
  use_early_stopping: false
  model_selection: false
  early_stopping_metric: val_jepa_loss
  early_stopping_mode: min
  transfer:
    non_blocking: false
  amp:
    enabled: true
    dtype: float16
scheduler:
  type: none
evaluation:
  k_values:
  - 1
  dba_delta: 5
output:
  dir: outputs
  run_name: mmw_jepa_context_image
  group_by_scene: false
  tensorboard:
    enabled: true
  progress:
    enabled: false
