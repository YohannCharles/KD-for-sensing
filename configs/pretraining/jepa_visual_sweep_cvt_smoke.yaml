    visual_encoder:
      type: cvt
      image_channels: 3
      latent_dim: 64
      patch_size: 16
      cvt_kernel_size: 3
      depth: 1
      num_heads: 4
      max_tokens: 196
      checkpoint_policy: partial_reuse
