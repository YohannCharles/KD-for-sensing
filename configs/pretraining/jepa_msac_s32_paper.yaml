_base_: jepa_msac_s32_smoke.yaml
experiment:
  name: jepa_msac_s32_paper_aligned
workflow:
  jepa_msac:
    stage: all
    paper_aligned: true
model:
  primary:
    latent_dim: 64
    transformer_depth: 2
    ema_momentum: 0.996
    mask_ratio: 0.5
training:
  epochs: 100
  lr: 0.0001
data:
  dataloader:
    batch_size: 8
    train_batch_size: 8
    test_batch_size: 8
output:
  dir: outputs/analysis/jepa_msac/paper_aligned
  run_name: jepa_msac_s32_paper_aligned
