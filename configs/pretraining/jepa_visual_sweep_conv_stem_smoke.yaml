_base_: deepsense6g_gps_conditioned_jepa_smoke.yaml
experiment:
  name: jepa_visual_sweep_conv_stem_smoke
model:
  primary:
    visual_encoder:
      type: conv_stem
      image_channels: 3
      latent_dim: 64
      stem_channels: [32, 32, 64]
      stem_strides: [2, 2, 4]
      depth: 1
      num_heads: 4
      max_tokens: 196
      checkpoint_policy: fresh_stage1_required
    predictor:
      max_tokens: 196
output:
  dir: outputs/analysis/jepa_visual_architecture_sweep
  run_name: jepa_visual_sweep_conv_stem_smoke
