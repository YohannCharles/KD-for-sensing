experiment:
  name: jepa_msac_s32_smoke
  task: fusion
  objective: jepa_msac_pretraining
  seed: 42
  device: cpu
workflow:
  family: jepa_msac
  jepa_msac:
    stage: pretrain
    paper: arxiv_2603_29796
    scenario: 32
    scenario32_csv: null
    split_seed: 42
    train_ratio: 0.7
    enabled_paper_modalities: [Image, Radar, LiDAR, GPS, RF]
    rf_history_source: beam_power_history
    window_protocol:
      t_hist: 8
      t_pred: 5
      window_length: 13
    target_schema:
      num_beams: 64
      targets: [localization, beam, rssi]
data:
  dataset:
    type: synthetic
    scene: 32
    seq_len: 8
    num_pred: 5
    image_profile: rgb_imagenet
    image_size: [224, 224]
    radar_size: [128, 64]
    fft_tuple: [64, 256, 128]
    clipped_range: 128
    use_gps: true
    use_lidar: true
    use_mmwave: true
  dataloader:
    batch_size: 1
    train_batch_size: 1
    test_batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: false
model:
  modalities: [image, radar, gps, lidar, mmwave]
  primary:
    type: jepa_msac
    modalities: [image, radar, gps, lidar, mmwave]
    image_profile: rgb_imagenet
    latent_dim: 16
    t_hist: 8
    t_pred: 5
    num_beams: 64
    image_channels: 3
    radar_channels: 1
    lidar_channels: 1
    gps_input_size: 2
    rf_input_size: 64
    image_tokens: 9
    radar_tokens: 16
    lidar_tokens: 16
    max_frames: 13
    max_tokens_per_frame: 16
    transformer_depth: 0
    num_heads: 4
    ema_momentum: 0.9
    mask_ratio: 0.5
    mask_pattern: random
    mask_seed: 7
    localization_guidance: true
loss:
  type: smooth_l1
  jepa_msac:
    type: smooth_l1
    beta: 1.0
    weight: 1.0
training:
  epochs: 1
  lr: 0.001
  use_early_stopping: true
  early_stopping_metric: val_jepa_msac_loss
  early_stopping_mode: min
  amp:
    enabled: false
scheduler:
  type: none
evaluation:
  metric_profile: jepa_msac_smoke
output:
  dir: outputs/analysis/jepa_msac/smoke
  run_name: jepa_msac_s32_smoke
  group_by_scene: false
  tensorboard:
    enabled: false
checkpoint:
  registry:
    enabled: false
