_base_: deepsense6g_gps_conditioned_jepa_smoke.yaml
experiment:
  name: jepa_visual_sweep_patch8_smoke
data:
  dataloader:
    train_batch_size: 1
    test_batch_size: 1
model:
  primary:
    visual_encoder:
      type: patch_vit
      image_channels: 3
      latent_dim: 64
      patch_size: 8
      depth: 1
      num_heads: 4
      max_tokens: 784
      checkpoint_policy: fresh_stage1_required
    predictor:
      max_tokens: 784
training:
  amp:
    enabled: true
  gradient_accumulation_steps: 2
output:
  dir: outputs/analysis/jepa_visual_architecture_sweep
  run_name: jepa_visual_sweep_patch8_smoke
