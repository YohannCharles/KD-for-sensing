    weights: outputs/analysis/predictive_gps_query_plus_plus/strict/predictive_gps_query_plus_plus/checkpoints/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    consumes_reliability_metadata: true
    split: test
    sample_count: 1088
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: deepsense6g_2604_s32_s34_stratified80_seq5
    difficulty_digest: predictive_p0_p5_advantage_h5_g2_f1_v1
    checkpoint_provenance: strict_real_run_2026-06-18_seed17_best_epoch37_val_adba0.5378063725490193
    strict_comparison:
      history_window: 5
      gps_input_source_window: 2
      prediction_horizon: 1
      scene_set: [32, 33, 34]
      seed: 17
      distance_metric: linear
      beam_label_space: beam64
protocol:
  mode: evaluation_only
  split: test
  dataset_profile: deepsense6g_2604_s32_s34_h5_g2_f1
predictive_jepa_robustness:
  strict_model_groups: true
  allow_partial: false
  history_window: 5
  claim_margin_dba: 0.05
  baseline_group: resnet_image_gps
  gps_query_baseline_group: jepa_gps_query_pool
  candidate_group: jepa_predictive_hybrid
perturbation_suites:
  - id: predictive_jepa_robustness
    type: predictive_jepa_robustness
    preset: canonical
    history_window: 5
    gps_query_advantage_slice:
      enabled: true
    conditions:
      - P0_clean_current
      - P1_current_frame_missing_history_available
      - P2_semantic_occlusion_history_available
      - P3_plausible_wrong_gps_current_image
      - P4_joint_predictive_recovery
      - P5_novel_weather_history_available
metrics:
  primary: dba
  topk: [1, 3, 5]
  dba_delta: 5
  distance_mode: linear
  profile: beambench_dba_topk
figures:
  enabled: true
  formats: [png]
  dpi: 160
seeds: [17]
outputs:
  output_dir: outputs/analysis/predictive_gps_query_plus_plus/strict
comparability:
  mode: strict
  keys:
    - split
    - sample_count
    - label_space
    - metric_profile
    - normalization_artifact
    - difficulty_digest
    - history_window
    - gps_input_source_window
    - prediction_horizon
    - scene_set
    - seed
    - distance_metric
    - beam_label_space
