      beam_label_space: beam64
  jepa_gps_query_baseline:
    group: jepa_gps_query_pool
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_query_pool_k4_2604_s32_s34_lowmem.yaml
    weights: outputs/analysis/predictive_gps_query_plus_plus/strict/jepa_gps_query_baseline/checkpoints/best.pth
