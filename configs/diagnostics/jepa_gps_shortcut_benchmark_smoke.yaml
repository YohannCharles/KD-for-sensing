version: jepa_gps_shortcut_benchmark_v1
models:
  mock_gps:
    group: gps_only
    config: configs/gps/lightweight.yaml
    weights: outputs/analysis/jepa_gps_shortcut_benchmark/mock_not_committed/gps/best.pth
    allow_missing_artifacts: true
    modalities: [gps]
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.62
      top1: 0.38
      top3: 0.62
      top5: 0.75
  mock_jepa_query:
    group: jepa_gps_query_pool
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_query_pool_best_beambench_fair_lowmem.yaml
    weights: outputs/analysis/jepa_gps_shortcut_benchmark/mock_not_committed/jepa_query/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.68
      top1: 0.44
      top3: 0.69
      top5: 0.81
protocol:
  mode: evaluation_only
  split: test
  dataset_profile: synthetic
  scenario_c_protocols:
    A:
      train_conditions: [clean]
      test_conditions: [C0_sync, C1_mild_stale, C2_low_rate, C3_random_async, C4_severe_async]
    evaluation_subset: [A]
perturbation_suites:
  - id: gps_clean
    type: gps_clean
    severities: [0.0]
  - id: gps_jitter
    type: gps_gaussian_jitter
    severity_unit: normalized_std
    severities: [0.0, 0.5, 1.0]
  - id: gps_missing
    type: gps_missing
    severity_unit: dropout_probability
    severities: [0.25, 0.75]
  - id: gps_distractor
    type: gps_distractor
    severity_unit: intervention_strength
    severities: [1.0]
  - id: image_occlusion
    type: image_occlusion
    severity_unit: area_ratio
    severities: [0.25, 0.5]
  - id: temporal_delay
    type: temporal_delay
    modality: gps
    delay_unit: frames
    frames_per_severity: 1
    fallback: clamp
    severities: [1, 3]
  - id: scenario_c_async_position_feedback
    type: scenario_c_async_position_feedback
    preset: canonical
    modality: gps
    delay_unit: frames
    severity_unit: scenario_c_level
    fallback: zero_fill
metrics:
  primary: dba
  topk: [1, 3, 5]
  profile: beambench_dba_topk
figures:
  enabled: true
  formats: [png]
  dpi: 120
seeds: [7]
outputs:
  output_dir: outputs/analysis/jepa_gps_shortcut_benchmark/smoke
comparability:
  mode: mark
  keys: [split, sample_count, label_space, metric_profile, normalization_artifact, enabled_modalities]
