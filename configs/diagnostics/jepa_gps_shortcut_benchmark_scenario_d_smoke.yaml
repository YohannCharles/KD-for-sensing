version: jepa_gps_shortcut_benchmark_v1
models:
  mock_gps:
    group: gps_only
    config: configs/gps/lightweight.yaml
    weights: outputs/analysis/scenario_d_image_observability/mock_not_committed/gps/best.pth
    allow_missing_artifacts: true
    modalities: [gps]
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_scenario_d_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.60
      top1: 0.38
      top3: 0.62
      top5: 0.75
  mock_cnn_gps:
    group: cnn_gps
    config: configs/fusion/experiments/jepa_image_gps/image_gps_supervised_beambench_fair_lowmem.yaml
    weights: outputs/analysis/scenario_d_image_observability/mock_not_committed/cnn_gps/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_scenario_d_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.66
      top1: 0.44
      top3: 0.69
      top5: 0.81
  mock_image_ae_gps:
    group: image_ae_gps
    config: configs/fusion/beambench_image_ae_gps_direct.yaml
    weights: outputs/analysis/scenario_d_image_observability/mock_not_committed/image_ae_gps/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_scenario_d_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.64
      top1: 0.42
      top3: 0.67
      top5: 0.80
  mock_image_jepa_only:
    group: image_jepa_only
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_biased_best_beambench_fair_lowmem.yaml
    weights: outputs/analysis/scenario_d_image_observability/mock_not_committed/image_jepa_only/best.pth
    allow_missing_artifacts: true
    modalities: [image]
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_scenario_d_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.65
      top1: 0.43
      top3: 0.68
      top5: 0.80
  mock_image_jepa_gps:
    group: image_jepa_gps
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_query_pool_best_beambench_fair_lowmem.yaml
    weights: outputs/analysis/scenario_d_image_observability/mock_not_committed/image_jepa_gps/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    consumes_reliability_metadata: true
    split: test
    sample_count: 8
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: synthetic
    checkpoint_provenance: synthetic_scenario_d_smoke
    synthetic_metrics:
      sample_count: 8
      dba: 0.70
      top1: 0.48
      top3: 0.72
      top5: 0.84
protocol:
  mode: evaluation_only
  split: test
  dataset_profile: synthetic_scenario_d
  read_only_inputs: [config, synthetic_metrics]
scenario_d:
  strict_model_groups: true
  allow_partial: false
perturbation_suites:
  - id: scenario_d_image_observability
    type: scenario_d_image_observability
    preset: canonical
  - id: scenario_c_x_d_image_observability
    type: scenario_c_x_d_image_observability
metrics:
  primary: dba
  topk: [1, 3, 5]
  dba_delta: 5
  distance_mode: linear
  profile: beambench_dba_topk
figures:
  enabled: true
  formats: [png]
  dpi: 120
seeds: [7]
outputs:
  output_dir: outputs/analysis/scenario_d_image_observability/smoke
comparability:
  mode: strict
  keys: [split, sample_count, label_space, metric_profile, normalization_artifact]
