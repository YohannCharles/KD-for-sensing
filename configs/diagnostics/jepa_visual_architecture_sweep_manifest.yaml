name: jepa_visual_architecture_sweep
version: 1
output_root: outputs/analysis/jepa_visual_architecture_sweep
strict_comparability_fields:
  - split
  - scene_set
  - seed
  - history_window
  - gps_input_source_window
  - prediction_horizon
  - beam_label_space
  - metric_profile
  - distance_metric
  - normalization_artifact
  - difficulty_digest
  - output_root
comparison_protocol:
  split: beambench_tableiii_input_s32_s34_train_s31_s34_test
  scene_set: [32, 33, 34]
  seed: 17
  history_window: 5
  gps_input_source_window: 2
  prediction_horizon: 1
  beam_label_space: beam64
  metric_profile: beambench_linear_topk
  distance_metric: linear
  normalization_artifact: config_resolved
  difficulty_digest: clean_or_declared_condition_profile
  output_root: outputs/analysis/jepa_visual_architecture_sweep
candidates:
  - variant_id: patch16_mean_baseline
    family: baseline
    visual_encoder: {type: patch_vit, patch_size: 16, token_count: 196}
    pooler: {type: mean, output_mode: frame}
    checkpoint_policy: exact_reuse
    run_tier: smoke
    evidence_scope: smoke
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_biased_best_beambench_fair_lowmem.yaml
  - variant_id: patch8_stage1_gps_query
    family: patch_granularity
    visual_encoder: {type: patch_vit, patch_size: 8, max_tokens: 784}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    checkpoint_policy: fresh_stage1_required
    run_tier: lowmem
    evidence_scope: lowmem
    pretraining_config: configs/pretraining/jepa_visual_sweep_patch8_smoke.yaml
  - variant_id: patch14_stage1_gps_query
    family: patch_granularity
    visual_encoder: {type: patch_vit, patch_size: 14, max_tokens: 256}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    token_metadata: {token_count: 256}
    params_metadata:
      total_params: 197000
      trainable_params: 197000
      image_encoder_params: 117000
      visual_context_encoder_params: 88000
      token_count: 256
    checkpoint_policy: fresh_stage1_required
    run_tier: smoke
    evidence_scope: smoke
    pretraining_config: configs/pretraining/jepa_visual_sweep_patch14_smoke.yaml
  - variant_id: overlap_k16_s8_stage1
    family: overlap_tokenizer
    visual_encoder: {type: overlap_patch, kernel_size: 16, stride: 8, max_tokens: 729}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    checkpoint_policy: fresh_stage1_required
    run_tier: lowmem
    evidence_scope: lowmem
    pretraining_config: configs/pretraining/jepa_visual_sweep_overlap_k16_s8_smoke.yaml
  - variant_id: conv_stem_s16_stage1
    family: conv_stem_tokenizer
    visual_encoder: {type: conv_stem, stem_strides: [2, 2, 4], max_tokens: 196}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    checkpoint_policy: fresh_stage1_required
    run_tier: smoke
    evidence_scope: smoke
    pretraining_config: configs/pretraining/jepa_visual_sweep_conv_stem_smoke.yaml
  - variant_id: patch16_local_depthwise
    family: local_token_mixing
    visual_encoder: {type: local_token_mixing, patch_size: 16, local_kernel_size: 3, max_tokens: 196}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    checkpoint_policy: partial_reuse
    run_tier: smoke
    evidence_scope: smoke
    pretraining_config: configs/pretraining/jepa_visual_sweep_local_token_mixing_smoke.yaml
  - variant_id: patch16_cvt_depthwise
    family: local_token_mixing
    visual_encoder: {type: cvt, patch_size: 16, cvt_kernel_size: 3, max_tokens: 196}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    checkpoint_policy: partial_reuse
    run_tier: smoke
    evidence_scope: smoke
    pretraining_config: configs/pretraining/jepa_visual_sweep_cvt_smoke.yaml
  - variant_id: resnet18_layer4_tokens
    family: cnn_tokens
    visual_encoder: {type: cnn_feature_map, backbone: resnet18, stage: layer4, pretrained: false, token_count: 49}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    token_metadata: {token_count: 49}
    params_metadata:
      total_params: 11320000
      trainable_params: 11320000
      image_encoder_params: 11240000
      visual_context_encoder_params: 11210000
      token_count: 49
    checkpoint_policy: supervised_only_anchor
    run_tier: smoke
    evidence_scope: smoke
    config: configs/fusion/experiments/jepa_image_gps/architecture_sweep_smoke.yaml
  - variant_id: resnet18_layer3_layer4_tokens
    family: multi_scale_tokens
    visual_encoder: {type: multi_scale_cnn, backbone: resnet18, stages: [layer3, layer4], pretrained: false}
    pooler: {type: gps_query_attention, k_queries: 2, output_mode: frame}
    params_metadata:
      total_params: 14130000
      trainable_params: 14130000
      image_encoder_params: 14050000
      visual_context_encoder_params: 14020000
    checkpoint_policy: supervised_only_anchor
    run_tier: lowmem
    evidence_scope: lowmem
    config: configs/fusion/experiments/jepa_image_gps/architecture_sweep_lowmem.yaml
  - variant_id: image_resnet18_gps_anchor
    family: frame_embedding_anchor
    visual_encoder: {type: resnet18_imagenet_rgb, token_count: 1}
    pooler: {type: frame_embedding, output_mode: frame}
    checkpoint_policy: supervised_only_anchor
    run_tier: strict
    evidence_scope: strict
    config: configs/fusion/experiments/jepa_image_gps/image_gps_supervised_beambench_fair_lowmem.yaml
  - variant_id: gps_query_k_tokens_core
    family: pooler_core_ablation
    visual_encoder: {type: patch_vit, patch_size: 16, token_count: 196}
    pooler: {type: gps_query_attention, k_queries: 4, output_mode: tokens}
    checkpoint_policy: exact_reuse
    run_tier: smoke
    evidence_scope: smoke
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_k_token_pooler_smoke.yaml
  - variant_id: gps_only_control
    family: non_transformer_control
    visual_encoder: {type: none, token_count: 0}
    pooler: {type: none, output_mode: frame}
    checkpoint_policy: supervised_only_anchor
    run_tier: strict
    evidence_scope: strict
    config: configs/gps/strong.yaml
command_manifest:
  train:
    - variant_id: patch8_stage1_gps_query
      command: conda run -n kd_mm_beam kd-sensing-train --config configs/pretraining/jepa_visual_sweep_patch8_smoke.yaml
    - variant_id: gps_query_k_tokens_core
      command: conda run -n kd_mm_beam kd-sensing-train --config configs/fusion/experiments/jepa_image_gps/image_gps_jepa_k_token_pooler_smoke.yaml
  evaluate:
    - variant_id: patch16_mean_baseline
      command: conda run -n kd_mm_beam kd-sensing-evaluate --config configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_biased_best_beambench_fair_lowmem.yaml
