models:
  fair_base:
    config: configs/fusion/experiments/jepa_image_gps/image_gps_supervised_2604_s32_s34_lowmem.yaml
    weights: outputs/scenegroup_s32_s34/fusion_image_gps_supervised_beambench_fair_lowmem_20260609_201130/checkpoints/best.pth
    optional: true
  fair_gps_biased:
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_biased_best_2604_s32_s34_lowmem.yaml
    weights: outputs/scenegroup_s32_s34/fusion_image_gps_jepa_gps_biased_best_beambench_fair_lowmem_20260609_201130/checkpoints/best.pth
    optional: true
  gps_query_pool:
    config: outputs/scenegroup_s32_s34/fusion_image_gps_jepa_gps_query_pool_best_2604_s32_s34_fasttrain/final_config.yaml
    weights: outputs/scenegroup_s32_s34/fusion_image_gps_jepa_gps_query_pool_best_2604_s32_s34_fasttrain/checkpoints/best.pth

split:
  evaluation_split: test
  scenes: [32, 33, 34]
  horizon_index: 0

sampling:
  seed: 42
  max_embedding_samples: 3000
  max_attention_cases: 256
  case_groups:
    - query_gain
    - query_regression
    - shared_near_miss
    - far_error
  cases_per_group: 3
  near_distance_threshold: 2
  far_distance_threshold: 5
  query_model: gps_query_pool
  baseline_model: fair_base

figures:
  embedding: true
  error_anatomy: true
  attention: true
  case_studies: true
  robustness: true

embeddings:
  layers:
    - output_features
  method: umap
  neighbors: 10

robustness:
  drop_modalities: true
  gps_noise:
    enabled: true
    std: [0.0, 0.05, 0.1, 0.2]
  image_masking:
    enabled: true
    mode: random
    ratios: [0.0, 0.1, 0.25, 0.5]
  seed: 42

outputs:
  output_dir: outputs/visual_analysis/jepa_query_pool_2604
  formats: [png, svg]
  dpi: 180
