experiment:
  name: gradio_viewer_manifest
  task: fusion
  seed: 0
  device: auto
data:
  cache:
    policy: read_only
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: false
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: false
  dataloader:
    train_batch_size: 1
    test_batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: false
model:
  modalities: [image, radar, gps, lidar, mmwave]
diagnostics:
  visualization:
    output_dir: outputs/diagnostics/gradio_viewer_manifest
    splits: [train, test]
    sample_count: 2
    per_seq_sample_count: null
    seed: 0
    seq_index: null
    labels: null
    modalities: [image, radar, gps, lidar, mmwave]
    compare_scenes: [9, 32]
    include_raw_image_preview: true
    preserve_existing_outputs: true
output:
  dir: outputs
  run_name: gradio_viewer_manifest
  progress:
    enabled: false
