experiment:
  name: modality_visualization
  task: fusion
  seed: 0
  device: auto
data:
  cache:
    policy: read_only
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
  dataloader:
    train_batch_size: 1
    test_batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: false
model:
  teacher:
    type: fusion_teacher
    modalities: [image, radar, lidar]
  student:
    type: fusion_student
    modalities: [image, radar, lidar]
diagnostics:
  visualization:
    output_dir: outputs/diagnostics/modality_visualization
    splits: [train, test]
    sample_count: 2
    seed: 0
    seq_index: null
    labels: null
    modalities: [image, radar, lidar]
    max_frames_per_sample: 4
    include_raw_image_preview: false
output:
  dir: outputs
  run_name: modality_visualization
  progress:
    enabled: false
