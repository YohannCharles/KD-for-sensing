      beam_label_space: beam64
protocol:
  mode: evaluation_only
  split: test
  dataset_profile: deepsense6g_2604_s32_s34_h5_g2_f1
evaluation:
  mode: real_forward
  real_forward:
    enabled: true
    sample_count: 1088
    cache_subdir: real_forward_residual_rerank
    resume: true
geometry_prior_claim_gate:
  baseline_group: resnet_image_gps
  gps_query_baseline_group: jepa_gps_query_pool
  candidate_groups:
    - geometry_prior_fusion
    - safe_residual_beam_rerank_fusion
  require_real_forward_perturbations: true
  clean_regression_threshold_dba: 0.02
  claim_margin_dba: 0.0
predictive_jepa_robustness:
  strict_model_groups: false
  allow_partial: true
  history_window: 5
  claim_margin_dba: 0.05
perturbation_suites:
  - id: real_forward_residual_rerank
    type: predictive_jepa_robustness
    preset: canonical
    history_window: 5
    split: test
    stress_suites: [image_missing, image_noise, gps_noise]
    severity_values: [0.25, 0.5, 0.75, 1.0]
    severity_unit: stress_severity
    gps_query_advantage_slice:
      enabled: true
metrics:
  primary: dba
  topk: [1, 3, 5]
  dba_delta: 5
  distance_mode: linear
  profile: beambench_dba_topk
figures:
  enabled: true
  formats: [png]
  dpi: 160
seeds: [17]
outputs:
  output_dir: outputs/analysis/real_perturbation_residual_rerank_fusion/strict
comparability:
  mode: strict
  keys:
    - split
    - sample_count
    - label_space
    - metric_profile
    - normalization_artifact
    - difficulty_digest
    - history_window
    - gps_input_source_window
    - prediction_horizon
    - scene_set
    - seed
    - distance_metric
    - beam_label_space
