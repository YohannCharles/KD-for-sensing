id: amber_lite_missing_modality_suite
reproduction_scope: amber_lite_local
split: test
seed: 17
output_root: outputs/analysis/local_baselines/amber_lite_missing_modality/eval
strict_comparability_keys:
  - split
  - sample_count
  - label_space
  - metric_profile
  - difficulty_digest
  - seed
conditions:
  - id: clean
    affected_modalities: []
    operator: clean
  - id: missing_image
    affected_modalities: [image]
    dropout_rate: 1.0
  - id: missing_lidar
    affected_modalities: [lidar]
    dropout_rate: 1.0
  - id: missing_radar
    affected_modalities: [radar]
    dropout_rate: 1.0
  - id: missing_gps
    affected_modalities: [gps]
    dropout_rate: 1.0
  - id: missing_image_lidar
    affected_modalities: [image, lidar]
    dropout_rate: 1.0
  - id: poor_image
    affected_modalities: [image]
    operator: image_observability
    operator_params:
      image_weather_severity: 0.4
      image_blur_prob: 0.5
  - id: lidar_unavailable
    affected_modalities: [lidar]
    dropout_rate: 1.0
  - id: radar_unavailable
    affected_modalities: [radar]
    dropout_rate: 1.0
  - id: wrong_gps
    affected_modalities: [gps]
    operator: gps_distractor
  - id: async_gps
    affected_modalities: [gps]
    operator: gps_temporal_delay
    operator_params:
      delay_steps: 2
      fallback: forward_fill
  - id: missing_image_lidar_async_gps
    affected_modalities: [image, lidar, gps]
    dropout_rate: 1.0
