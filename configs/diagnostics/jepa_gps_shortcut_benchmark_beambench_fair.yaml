version: jepa_gps_shortcut_benchmark_v1
models:
  gps_lightweight:
    group: gps_only
    config: configs/gps/lightweight.yaml
    weights: outputs/scenegroup_s32_s34/gps_lightweight_beambench_fair/checkpoints/best.pth
    allow_missing_artifacts: true
    modalities: [gps]
    split: test
    sample_count: beambench_fair_resolved_at_run_time
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: checkpoint_sidecar_required
    checkpoint_provenance: replace_with_local_gps_checkpoint
  camera_ae_gps_direct:
    group: camera_ae_gps
    config: configs/fusion/beambench_image_ae_gps_direct.yaml
    weights: outputs/scenegroup_s32_s34/beambench_image_ae_gps_direct_tableiii/paper_split/checkpoints/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: beambench_fair_resolved_at_run_time
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: checkpoint_sidecar_required
    checkpoint_provenance: replace_with_local_camera_ae_gps_checkpoint
  image_gps_supervised:
    group: resnet_image_gps
    config: configs/fusion/experiments/jepa_image_gps/image_gps_supervised_beambench_fair_lowmem.yaml
    weights: outputs/scenegroup_s32_s34/fusion_image_gps_supervised_beambench_fair_lowmem/checkpoints/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: beambench_fair_resolved_at_run_time
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: checkpoint_sidecar_required
    checkpoint_provenance: replace_with_local_supervised_checkpoint
  jepa_gps_biased:
    group: jepa_mean_pool
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_biased_best_beambench_fair_lowmem.yaml
    weights: outputs/scenegroup_s32_s34/fusion_image_gps_jepa_gps_biased_best_beambench_fair_lowmem/checkpoints/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: beambench_fair_resolved_at_run_time
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: checkpoint_sidecar_required
    checkpoint_provenance: replace_with_local_jepa_gps_biased_checkpoint
  jepa_gps_query_pool:
    group: jepa_gps_query_pool
    config: configs/fusion/experiments/jepa_image_gps/image_gps_jepa_gps_query_pool_best_beambench_fair_lowmem.yaml
    weights: outputs/scenegroup_s32_s34/fusion_image_gps_jepa_gps_query_pool_best_beambench_fair_lowmem/checkpoints/best.pth
    allow_missing_artifacts: true
    modalities: [image, gps]
    split: test
    sample_count: beambench_fair_resolved_at_run_time
    label_space: beam64
    metric_profile: beambench_dba_topk
    normalization_artifact: checkpoint_sidecar_required
    checkpoint_provenance: replace_with_local_jepa_gps_query_checkpoint
protocol:
  mode: evaluation_only
  split: test
  dataset_profile: beambench_fair_s32_s34_train_s31_s34_test
  read_only_inputs: [config, weights, split_csv, run_dir]
  scenario_c_protocols:
    A:
      description: clean training, evaluate all asynchronous position feedback conditions
      train_conditions: [clean]
      test_conditions: [C0_sync, C1_mild_stale, C2_low_rate, C3_random_async, C4_severe_async]
    B:
      description: mild async mixture training plan, evaluate all conditions
      train_conditions: [C0_sync, C1_mild_stale, C2_low_rate]
      test_conditions: [C0_sync, C1_mild_stale, C2_low_rate, C3_random_async, C4_severe_async]
    C:
      description: GPS/image dropout training plan, evaluate all asynchronous conditions
      train_conditions: [gps_dropout, image_dropout]
      test_conditions: [C0_sync, C1_mild_stale, C2_low_rate, C3_random_async, C4_severe_async]
    evaluation_subset: [A]
perturbation_suites:
  - id: gps_clean
    type: gps_clean
    severities: [0.0]
  - id: gps_gaussian_jitter
    type: gps_gaussian_jitter
    severity_unit: normalized_std
    severities: [0.0, 0.25, 0.5, 1.0]
  - id: gps_cumulative_drift
    type: gps_cumulative_drift
    severity_unit: normalized_drift
    severities: [0.25, 0.5, 1.0]
  - id: gps_missing
    type: gps_missing
    severity_unit: dropout_probability
    severities: [0.25, 0.5, 0.75, 1.0]
  - id: gps_distractor
    type: gps_distractor
    severity_unit: counterfactual_intervention
    severities: [1.0]
  - id: image_fog_rain
    type: image_fog_rain
    severity_unit: physical_degradation_strength
    severities: [0.25, 0.5, 0.75]
  - id: image_night
    type: image_night
    severity_unit: physical_degradation_strength
    severities: [0.25, 0.5, 0.75]
  - id: image_occlusion
    type: image_occlusion
    severity_unit: area_ratio
    severities: [0.1, 0.25, 0.5]
  - id: image_motion_blur
    type: image_motion_blur
    severity_unit: kernel_strength
    severities: [0.25, 0.5, 0.75]
  - id: gps_temporal_delay
    type: temporal_delay
    modality: gps
    delay_unit: frames
    frames_per_severity: 1
    fallback: clamp
    severities: [1, 3, 5]
  - id: image_sampling_mismatch
    type: sampling_rate_mismatch
    modality: image
    delay_unit: stride
    fallback: clamp
    severities: [2, 4]
  - id: scenario_c_async_position_feedback
    type: scenario_c_async_position_feedback
    preset: canonical
    modality: gps
    delay_unit: frames
    severity_unit: scenario_c_level
    fallback: zero_fill
metrics:
  primary: dba
  topk: [1, 3, 5]
  dba_delta: 5
  distance_mode: linear
  profile: beambench_dba_topk
figures:
  enabled: true
  formats: [png, svg]
  dpi: 180
seeds: [42, 2604]
outputs:
  output_dir: outputs/analysis/jepa_gps_shortcut_benchmark/beambench_fair
comparability:
  mode: mark
  keys:
    - split
    - sample_count
    - label_space
    - metric_profile
    - normalization_artifact
    - checkpoint_provenance
    - enabled_modalities
