experiment:
  name: m2beamllm_fusion_all_modalities_no_kd
  task: fusion
data:
  dataset:
    use_gps: true
    gps_input_size: 2
    gps_feature_mode: m2beamllm_minmax
    gps_normalize: true
    use_lidar: true
    lidar_channels: 1
    lidar_encoding: m2beamllm_histogram
    lidar_histogram_size: [256, 256]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: true
model:
  teacher:
    type: fusion_teacher
    encoder_profile: m2beamllm
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    radar_input_mode: ra_map
    gps_input_size: 2
    lidar_channels: 1
    mmwave_input_size: 64
    m2beamllm_pretrained: false
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 1]
  student:
    type: fusion_student
    encoder_profile: m2beamllm
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    radar_input_mode: ra_map
    gps_input_size: 2
    lidar_channels: 1
    mmwave_input_size: 64
    m2beamllm_pretrained: false
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 1]
distillation:
  type: no_kd
  teacher_model_name: null
output:
  run_name: m2beamllm_fusion_all_modalities_no_kd
