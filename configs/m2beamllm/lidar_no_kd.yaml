experiment:
  name: m2beamllm_lidar_no_kd
  task: lidar
data:
  dataset:
    use_lidar: true
    lidar_channels: 1
    lidar_encoding: m2beamllm_histogram
    lidar_histogram_size: [256, 256]
    lidar_normalize: false
model:
  teacher:
    type: m2beamllm_lidar_teacher
    lidar_channels: 1
    m2beamllm_pretrained: false
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 1]
  student:
    type: m2beamllm_lidar_student
    lidar_channels: 1
    m2beamllm_pretrained: false
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 1]
distillation:
  type: no_kd
  teacher_model_name: null
output:
  run_name: m2beamllm_lidar_no_kd
