scenario:
  root: /root/datasets/DeepVerse/scenarios
  name: DT31
  config_m: /root/datasets/DeepVerse/scenarios/DT31/param/config.m
  scenes: all

generation:
  enable_camera: true
  enable_lidar: true
  enable_radar: true
  enable_comm: true
  enable_position: true

sequence:
  seq_len: 8
  pred_horizon: 3

beam:
  num_beams: 64
  topk: 5

position:
  noise_std: 1.0

split:
  split_by: sequence
  train_ratio: 0.8
  val_ratio: 0.2
  seed: 42

blockage:
  min_class_count: 1
  min_class_ratio: 0.0

modalities:
  camera_ids: [1]
  lidar_ids: [1]

output:
  root: dataset/deepverse_dt31/cache
