experiment:
  name: lidar_mmwave_teacher_no_kd
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [lidar, mmwave]
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
    lidar_channels: 3
    mmwave_input_size: 64
  student:
    type: fusion_teacher
    modalities: [lidar, mmwave]
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
    lidar_channels: 3
    mmwave_input_size: 64
distillation:
  type: no_kd
  teacher_model_name: null
training:
  epochs: 100
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
output:
  dir: outputs
  run_name: lidar_mmwave_teacher_no_kd
