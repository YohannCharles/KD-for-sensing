experiment:
  name: u_mask_beam_jepa_smoke
  task: fusion
  seed: 11
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 2
    num_pred: 1
    portion: 0.02
    image_profile: rgb_imagenet
    image_size: [224, 224]
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_normalize: false
  dataloader:
    train_batch_size: 2
    test_batch_size: 2
    num_workers: 0
    pin_memory: false
    persistent_workers: false
model:
  modalities: [image, radar, lidar, gps]
  d_model: 32
  num_classes: 64
  num_pred: 1
  downsample_ratio: 1
  seq_length: 2
  primary:
    type: u_mask_beam_jepa
    modalities: [image, radar, lidar, gps]
    image_profile: rgb_imagenet
    image_channels: 3
    radar_channels: 2
    lidar_channels: 3
    gps_input_size: 3
    d_model: 32
    num_classes: 64
    num_pred: 1
    num_heads: 4
    num_layers: 1
    dropout: 0.1
    context_type: set_transformer_simplified
    fusion_type: reliability_gated_cross_attention
    use_teacher: true
    use_jepa_loss: true
    use_modality_uncertainty: true
    use_global_uncertainty: true
    eval_missing_pattern:
      available_modalities: [image, gps]
loss:
  type: cross_entropy
  u_mask_beam_jepa:
    enabled: true
    lambda_teacher: 0.5
    lambda_jepa: 1.0
    missing_mask:
      p_missing: [0.25, 0.25, 0.25, 0.1]
      ensure_at_least_one: true
training:
  epochs: 1
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 5.0
  use_early_stopping: false
  model_selection: false
  transfer:
    non_blocking: false
  amp:
    enabled: false
scheduler:
  type: none
evaluation:
  k_values: [1, 5]
  missing_pattern:
    available_modalities: [image, gps]
output:
  dir: outputs
  run_name: u_mask_beam_jepa_smoke
  group_by_scene: true
  tensorboard:
    enabled: false
  progress:
    enabled: false
