experiment:
  name: fusion_all_modalities_supervised
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    image_profile: rgb_imagenet
    image_size:
    - 224
    - 224
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size:
    - 224
    - 224
    lidar_roi:
    - -30.0
    - 30.0
    - -30.0
    - 30.0
    - -3.0
    - 5.0
    lidar_fov_degrees: null
    lidar_cache_dir: lidar_bev_cache
    lidar_normalize: false
    lidar_normalization:
      enabled: false
      mode: none
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  modalities:
  - image
  - radar
  - gps
  - lidar
  - mmwave
  feature_size: 64
  d_model: 64
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  seq_length: 8
  primary:
    type: cls_token_transformer_fusion
    modalities:
    - image
    - radar
    - gps
    - lidar
    - mmwave
    image_channels: 3
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    num_heads: 4
    num_layers: 2
    dropout: 0.1
    max_seq_len: 16
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
  beam_soft:
    enabled: false
    weight: 0.0
  unimodal_aux:
    weight: 0.0
training:
  epochs: 100
  warmup_epochs: 0
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
  modality_dropout:
    enabled: false
    drop_prob: 0.0
    min_keep: 1
output:
  dir: outputs
  run_name: fusion_all_modalities_supervised
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
