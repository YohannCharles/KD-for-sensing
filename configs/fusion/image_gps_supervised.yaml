experiment:
  name: fusion_image_gps_supervised
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    image_profile: rgb_imagenet
    image_size:
    - 224
    - 224
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  seq_length: 8
  primary:
    type: modular_sequence
    modalities:
    - image
    - gps
    image_profile: rgb_imagenet
    gps_input_size: 3
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      image:
        type: resnet18_imagenet_rgb
        output_dim: 64
        pretrained: true
        weights: DEFAULT
        freeze_backbone: true
        unfreeze_stages:
        - layer4
        dropout: 0.1
    representation_core:
      type: early_concat_gru
      d_model: 64
      hidden_size: 64
      num_layers: 2
    heads:
      beam:
        type: beam_head
        dropout: 0.1
training:
  epochs: 100
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs
  run_name: fusion_image_gps_supervised
