experiment:
  name: marf_subset_training
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  modalities: [image, radar, gps, lidar, mmwave]
  feature_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 3
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
  student:
    type: marf_fusion
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 3
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    num_heads: 4
    dropout: 0.1
    router:
      hidden_size: 64
      temperature: 1.0
      use_prior_bias: true
      prior_anchor_scale: 0.5
      prior_residual_scale: 0.25
      use_confidence_features: true
      zero_init: true
    residual_adapter:
      enabled: true
      residual_scale: 0.2
teacher:
  registry_path: outputs/scene32/teacher_registry.json
  load_encoders: true
  freeze_encoders: true
  strict: true
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  type: cross_entropy
  label_smoothing: 0.03
  beam_soft:
    enabled: true
    weight: 0.01
    sigma: 2.0
    circular: true
  unimodal_aux:
    weight: 0.0
  prior_regularization:
    enabled: false
    weight: 0.0
  marf:
    residual_norm:
      enabled: true
      weight: 0.01
    prior_regularization:
      enabled: true
      weight: 0.01
      loss_type: mse
    anchor_entropy:
      enabled: false
      weight: 0.0
      maximize: true
    subset_ce:
      weight: 0.3
    subset_kd:
      weight: 0.2
      temperature: 3.0
training:
  epochs: 100
  warmup_epochs: 0
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
  modality_dropout:
    enabled: false
    drop_prob: 0.0
    min_keep: 1
  counterfactual:
    enabled: false
    weight: 0.0
  subset_training:
    enabled: true
    modes: [top_prior, random_with_top_prior]
    max_subsets_per_batch: 2
    top_prior_k: 2
    min_keep: 1
    random_keep_prob: 0.5
    ce_weight: 0.3
    kd_weight: 0.2
    temperature: 3.0
evaluation:
  modality_subsets:
    enabled: true
    subsets: [all, top_prior, single_best_prior, random_with_top_prior, strong_only, weak_only]
    top_prior_k: 2
output:
  dir: outputs
  run_name: marf_subset_training
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
