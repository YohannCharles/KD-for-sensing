_base_: physics_informed_mmw_hybrid.yaml
experiment:
  name: physics_informed_mmw_sparse_pilot_multimodal
data:
  use_csi_input: true
  csi_input_mode: sparse_pilot
  pilot_pattern: grid
  pilot_subcarrier_stride: 4
  pilot_antenna_stride: 4
  allow_oracle_full_csi_input: false
  dataset:
    enabled_modalities:
    - image
    - csi
    use_csi: true
    physics_supervision:
      use_csi_input: true
      csi_input_mode: sparse_pilot
      pilot_pattern: grid
      pilot_subcarrier_stride: 4
      pilot_antenna_stride: 4
      allow_oracle_full_csi_input: false
model:
  modalities:
  - image
  - csi
  primary:
    modalities:
    - image
    - csi
    frontend:
      type: paper_modal_tokenizers
      num_layers: 1
      num_heads: 4
      dropout: 0.0
      formal_experiment_eligible: true
      encoders:
        image:
          type: jepa_context_image
          latent_dim: 64
          checkpoint_path: outputs/mmw_jepa_context_image/checkpoints/best.pth
          freeze_encoder: true
          pooling: mean
          visual_encoder:
            type: patch_vit
            patch_size: 16
            depth: 1
            num_heads: 4
            max_tokens: 196
            dropout: 0.0
            image_channels: 3
            latent_dim: 64
            image_profile: rgb_imagenet
            checkpoint_policy: fresh_stage1_required
            variant_id: mmw_patch16_jepa_stage1
        csi:
          type: pilot_dual_view_csi
          view_fusion: freq_only
          use_internal_gru: false
output:
  run_name: physics_informed_mmw_sparse_pilot_multimodal
