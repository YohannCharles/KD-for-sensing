experiment:
  name: tii_vlrg_transformer_baseline
  task: fusion
  objective: beam
  seed: 17
  protocol: local_experimental_baseline
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 5
    num_pred: 1
    portion: 1.0
    image_profile: rgb_imagenet
    image_size: [224, 224]
    radar_size: [128, 64]
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
  dataloader:
    train_batch_size: 8
    test_batch_size: 8
    num_workers: 4
    prefetch_factor: 1
model:
  modalities: [image, radar, gps, lidar]
  feature_size: 64
  d_model: 64
  num_classes: 64
  num_pred: 1
  downsample_ratio: 1
  seq_length: 5
  primary:
    type: modular_sequence
    modalities: [image, radar, gps, lidar]
    image_profile: rgb_imagenet
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 1
    image_channels: 3
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    encoders:
      image:
        type: resnet18_imagenet_rgb
        output_dim: 64
        pretrained: false
        weights: null
        freeze_backbone: true
      radar:
        type: radar_cnn
        output_dim: 64
      gps:
        type: gps_mlp
        output_dim: 64
      lidar:
        type: lidar_cnn
        output_dim: 64
    representation_core:
      type: token_transformer
      d_model: 64
      num_heads: 4
      num_layers: 2
      dropout: 0.1
    heads:
      beam:
        type: beam_head
        num_classes: 64
        dropout: 0.1
    paper_metadata:
      model_group: tii_vlrg_transformer_baseline
      baseline_scope: local_experimental_baseline
      architecture_family: vlrg_style_token_transformer
      enabled_modalities: [image, radar, gps, lidar]
      notes:
        - local trainable VLRG-style baseline
        - does not use TII official code or checkpoint
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
training:
  epochs: 100
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
output:
  dir: outputs/analysis/local_baselines/tii_vlrg_transformer
  run_name: tii_vlrg_transformer_baseline
