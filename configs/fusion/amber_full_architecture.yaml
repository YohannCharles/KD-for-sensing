experiment:
  name: amber_full_architecture
  task: fusion
  seed: 17
  model_group: amber_full_architecture
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 2
    num_pred: 1
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_normalize: false
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
    num_workers: 4
    prefetch_factor: 1
model:
  modalities: [image, radar, gps, lidar]
  feature_size: 64
  num_classes: 64
  num_pred: 1
  downsample_ratio: 1
  seq_length: 2
  primary:
    type: modular_sequence
    modalities: [image, radar, gps, lidar]
    image_profile: rgb_imagenet
    image_channels: 3
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 1
    consume_missing_modality_metadata: true
    missing_modality_metadata:
      enabled: true
      strict: false
    paper_metadata:
      baseline_scope: local_architecture_reproduction
      reproduction_scope: amber_full_local
      baseline_family: amber_full_architecture
    encoders:
      image:
        type: resnet34_spatial_tokens
        pretrained: true
        weights: DEFAULT
        freeze_backbone: true
        image_size: [224, 224]
        token_pool_size: [2, 2]
      radar:
        type: resnet18_spatial_tokens
        pretrained: true
        weights: DEFAULT
        freeze_backbone: true
        in_channels: 2
        image_size: [128, 64]
        token_pool_size: [2, 2]
      gps:
        type: gps_mlp
      lidar:
        type: resnet18_spatial_tokens
        pretrained: true
        weights: DEFAULT
        freeze_backbone: true
        in_channels: 3
        image_size: [224, 224]
        token_pool_size: [2, 2]
    representation_core:
      type: amber_full_adaptive_mask_transformer
      d_model: 64
      num_heads: 4
      modality_layers: 1
      fusion_layers: 2
      dropout: 0.1
      max_seq_len: 8
      max_spatial_tokens: 4
      num_cma_queries: 4
      cma_dim: 64
      cma_temperature: 0.2
      mask_token_strategy: learned_per_modality
      auxiliary_loss_weights:
        l2: 0.1
        cma: 0.05
    heads:
      beam:
        type: beam_head
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
  auxiliary:
    amber_full:
      enabled: true
      l2_weight: 0.1
      cma_weight: 0.05
difficulty:
  profiles:
    amber_full_modality_dropout_train:
      stage: train
      split: train
      condition: amber_full_modality_dropout
      seed: 17
      severity: 0.25
      fallback: zero_fill
      affected_modalities: [image, radar, gps, lidar]
      metadata:
        reproduction_scope: amber_full_local
      operators:
        - type: amber_lite_modality_dropout
          modality: image
          affected_modalities: [image, radar, gps, lidar]
          rates:
            image: 0.25
            radar: 0.2
            gps: 0.15
            lidar: 0.2
training:
  epochs: 100
  warmup_epochs: 0
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs/analysis/local_baselines/amber_full_architecture
  run_name: amber_full_architecture
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
