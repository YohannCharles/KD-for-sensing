experiment:
  name: scene32_teacher_init_no_prior_ablation
  task: fusion
  seed: 0
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    use_mmwave: true
model:
  student:
    type: craf_fusion
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    num_heads: 4
    num_layers: 2
    reliability:
      gate_type: none
teacher:
  registry_path: outputs/scene32/teacher_registry.json
  load_encoders: true
  freeze_encoders: true
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  beam_soft:
    enabled: true
    weight: 0.03
  unimodal_aux:
    weight: 0.0
  prior_regularization:
    enabled: false
    weight: 0.0
training:
  lr: 0.00075
  weight_decay: 0.0001
  counterfactual:
    enabled: false
    weight: 0.0
output:
  run_name: scene32_teacher_init_no_prior_ablation
