experiment:
  name: fusion_mmwave_csi_medium_degraded_supervised
  task: fusion
  seed: 42
  device: auto
data:
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    train_csv_name: Prepared/Town10_skybridge_seed24/splits/train.csv
    test_csv_name: Prepared/Town10_skybridge_seed24/splits/test.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_mmwave: true
    mmwave_normalize: true
    use_csi: true
    csi_train_rms: true
    csi_degradation:
      enabled: true
      profile: medium
      seed: 42
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
    num_workers: 4
    prefetch_factor: 1
model:
  modalities:
  - mmwave
  - csi
  feature_size: 64
  d_model: 64
  gru_hidden_size: 64
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  seq_length: 8
  primary:
    type: modular_sequence
    modalities:
    - mmwave
    - csi
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      mmwave:
        type: mmwave_mlp
        output_dim: 64
      csi:
        type: pilot_dual_view_csi
        output_dim: 64
        train_rms: 1.0
        csi_estimation:
          mode: physical
          pilot_len: 16
          pilot_power: 1.0
          noise_var: 0.01
        delay_taps: 32
        view_fusion: symmetric_gate
    representation_core:
      type: early_concat_gru
      d_model: 64
      hidden_size: 64
      num_layers: 1
    heads:
      beam:
        type: beam_head
        dropout: 0.1
training:
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: false
  model_selection: false
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs
  run_name: fusion_mmwave_csi_medium_degraded_supervised
