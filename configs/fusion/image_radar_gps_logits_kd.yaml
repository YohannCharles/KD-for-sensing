paths:
  weights_dir: outputs/image_radar_gps_teacher_no_kd/checkpoints
experiment:
  name: image_radar_gps_logits_kd
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: scenario9
    data_root: dataset/scenario9
    train_csv_name: train_seqs_RA_GPS.csv
    test_csv_name: test_seqs_RA_GPS.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
  dataloader:
    train_batch_size: 3
    test_batch_size: 3
    num_workers: 8
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [image, radar, gps]
    gps_input_size: 3
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
  student:
    type: fusion_student
    modalities: [image, radar, gps]
    gps_input_size: 3
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
distillation:
  type: logits_kd
  temperature: 3.0
  alpha: 0.4
  alpha_warmup_epochs: 0
  teacher_model_name: best.pth
training:
  epochs: 100
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
output:
  dir: outputs
  run_name: image_radar_gps_logits_kd
