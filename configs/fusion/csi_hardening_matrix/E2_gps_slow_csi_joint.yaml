_base_: _base/gps_csi.yaml
experiment:
  name: fusion_E2_gps_slow_csi_joint
  seed: 62
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 62
      mode: train_random_eval_fixed
      common_phase:
        enabled: true
        max_degrees: 45.0
      subcarrier_phase_slope:
        enabled: true
        max_degrees: 30.0
      antenna_calibration:
        enabled: true
        amplitude_range:
        - 0.95
        - 1.05
        phase_std_degrees: 5.0
model:
  primary:
    encoders:
      csi:
        view_gate_warmup_epochs: 30
        view_gate_warmup_mode: mean
        use_internal_gru: false
output:
  run_name: fusion_E2_gps_slow_csi_joint
config_resolution:
  style: base+overlay
  base_config: _base/gps_csi.yaml
  overlay_id: E2_gps_slow_csi_joint
  control_variables:
  - modalities
  - csi_hardening
  - csi_prioritized_warmup
  - use_internal_gru
  - view_gate_warmup
