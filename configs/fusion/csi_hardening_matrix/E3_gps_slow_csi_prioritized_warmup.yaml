_base_: _base/gps_csi.yaml
experiment:
  name: fusion_E3_gps_slow_csi_prioritized_warmup
  seed: 63
data:
  dataset:
    csi_hardening:
      enabled: true
      seed: 63
      mode: train_random_eval_fixed
      common_phase:
        enabled: true
        max_degrees: 45.0
      subcarrier_phase_slope:
        enabled: true
        max_degrees: 30.0
      antenna_calibration:
        enabled: true
        amplitude_range:
        - 0.95
        - 1.05
        phase_std_degrees: 5.0
model:
  primary:
    encoders:
      csi:
        view_gate_warmup_epochs: 30
        view_gate_warmup_mode: mean
        use_internal_gru: false
training:
  use_early_stopping: false
  model_selection: false
  csi_prioritized_warmup:
    enabled: true
    epochs: 20
    phase_1:
      active_modalities:
      - csi
      trainable_components:
      - encoders.csi
      - representation_core
      - heads
    phase_2:
      active_modalities:
      - gps
      - csi
      trainable_components:
      - all
output:
  run_name: fusion_E3_gps_slow_csi_prioritized_warmup
config_resolution:
  style: base+overlay
  base_config: _base/gps_csi.yaml
  overlay_id: E3_gps_slow_csi_prioritized_warmup
  control_variables:
  - modalities
  - csi_hardening
  - csi_prioritized_warmup
  - use_internal_gru
  - view_gate_warmup
