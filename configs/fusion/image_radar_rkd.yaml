paths:
  weights_dir: All_models
experiment:
  name: image_radar_rkd
  task: fusion
  seed: 42
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities:
    - image
    - radar
    feature_size: 64
    num_classes: 64
    gru_params:
    - 64
    - 64
    - 2
  student:
    type: fusion_student
    modalities:
    - image
    - radar
    feature_size: 64
    num_classes: 64
    gru_params:
    - 64
    - 64
    - 1
distillation:
  type: rkd
  temperature: 2.0
  alpha: 0.3
  alpha_warmup_epochs: 0
  teacher_model_name: BothTeacher_best.pth
  rkd_pairs_per_anchor: 4
  rkd_distance_weight: 10.0
  rkd_angle_weight: 10.0
training:
  epochs: 100
  lr: 0.00095
  weight_decay: 0.0
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
output:
  dir: outputs
  run_name: image_radar_rkd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
