_base_: ../rbma_missing_workflow/_base_no_jepa_rbma.yaml
experiment:
  name: rbma_strong_encoder_base
model:
  d_model: 64
  feature_size: 64
  primary:
    d_model: 64
    image_profile: rgb_imagenet
    image_channels: 3
    radar_channels: 2
    lidar_channels: 3
    gps_input_size: 3
    encoders:
      image:
        type: resnet18_imagenet_rgb
        output_dim: 64
        pretrained: true
        weights: DEFAULT
        freeze_backbone: true
        unfreeze_stages: [layer4]
        dropout: 0.1
      radar:
        type: radar_cnn
        output_dim: 64
        radar_channels: 2
      lidar:
        type: lidar_cnn
        output_dim: 64
        lidar_channels: 3
      gps:
        type: gps_mlp
        output_dim: 64
        gps_input_size: 3
        hidden_size: 64
        dropout: 0.1
    encoder_checkpoint_paths:
      image: outputs/scene31/best_checkpoints/m2beam_scene31_image_only_primary_acc_0.3675.pth
      radar: outputs/scene31/best_checkpoints/m2beam_scene31_radar_only_primary_acc_0.2742.pth
      lidar: outputs/scene31/best_checkpoints/m2beam_scene31_lidar_only_primary_acc_0.1575.pth
      gps: outputs/scene31/best_checkpoints/m2beam_scene31_gps_only_primary_acc_0.4872.pth
