experiment:
  name: bev_fusion_2604_smoke
  task: fusion
  seed: 7
  device: auto
  protocol: synthetic_2604_forward_smoke
  paper: arXiv:2604.05668
  paper_exact_split_available: false
  paper_approximation: true
data:
  dataset:
    type: synthetic_sequence
    length: 6
    seq_len: 5
    num_pred: 1
    num_classes: 64
    image_size: [224, 224]
    radar_size: [128, 64]
    use_gps: true
    gps_input_size: 3
    use_gps_bev_xy: true
    gps_bev_roi: [-20.0, 20.0, -20.0, 20.0]
    use_lidar: true
    lidar_size: [16, 16]
    lidar_channels: 3
    mock_data: true
  dataloader:
    train_batch_size: 2
    test_batch_size: 2
    num_workers: 0
    pin_memory: false
    persistent_workers: false
model:
  modalities: [image, radar, gps, lidar]
  d_model: 32
  num_classes: 64
  num_pred: 1
  downsample_ratio: 1
  seq_length: 5
  primary:
    type: bev_fusion_2604
    modalities: [image, radar, gps, lidar]
    num_classes: 64
    num_pred: 1
    d_model: 32
    bev_size: [8, 8]
    image_channels: 3
    radar_channels: 2
    lidar_channels: 3
    gps_input_size: 3
    camera_backbone:
      type: lightweight_cnn
      width: 16
    camera_to_bev:
      num_layers: 1
      num_heads: 4
      dropout: 0.0
    gps_spatial:
      roi: [-20.0, 20.0, -20.0, 20.0]
      gaussian_sigma_cells: 1.0
      clip_out_of_bounds: true
    gps_pathway: dual_path
    fusion_core:
      type: bev_spatial
      dropout: 0.0
    temporal_core:
      type: transformer
      num_layers: 1
      num_heads: 4
      max_seq_len: 8
      dropout: 0.0
    paper_approximation: true
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
training:
  epochs: 1
  lr: 0.0001
  weight_decay: 0.01
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.01
  use_early_stopping: false
  transfer:
    non_blocking: false
  amp:
    enabled: false
scheduler:
  type: none
evaluation:
  k_values: [1, 3, 5]
  dba_delta: 5
  dba_distance_mode: linear
  metric_profile: 2604_linear_topk
output:
  dir: outputs
  group_by_scene: false
  run_name: bev_fusion_2604_smoke
