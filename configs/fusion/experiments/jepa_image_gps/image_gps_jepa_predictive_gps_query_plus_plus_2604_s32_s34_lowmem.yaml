_base_: image_gps_jepa_gps_query_pool_best_2604_s32_s34_lowmem.yaml

experiment:
  name: fusion_image_gps_jepa_predictive_gps_query_plus_plus_2604_s32_s34_lowmem
  ablation: predictive_gps_query_plus_plus_2604_h5_g2_f1
  model_group: jepa_predictive_hybrid
  seed: 17
  protocol: deepsense6g_2604_s32_s34_strict_h5_g2_f1
  strict_comparison:
    history_window: 5
    gps_input_source_window: 2
    image_history_window: 5
    prediction_horizon: 1
    scene_set: [32, 33, 34]
    seed: 17
    distance_metric: linear
    beam_label_space: beam64
output:
  dir: outputs/analysis/predictive_gps_query_plus_plus/train
  run_name: fusion_image_gps_jepa_predictive_gps_query_plus_plus_2604_s32_s34_lowmem
data:
  dataset:
    seq_len: 5
    num_pred: 1
    train_scenes: [32, 33, 34]
    validation_scenes: [32, 33, 34]
    test_scenes: [32, 33, 34]
difficulty:
  enabled: true
  profiles:
    - id: predictive_gps_query_plus_plus_train_p4
      stage: train
      split: train
      condition: P4_joint_predictive_recovery
      seed: 17
      fallback: deterministic_jitter
      operators:
        - type: predictive_jepa_robustness
          history_window: 5
          target_time_index: -1
          gps_counterfactual_fallback: deterministic_jitter
          min_beam_offset: 1
model:
  seq_length: 5
  num_pred: 1
  primary:
    seq_length: 5
    num_pred: 1
    strict_reliability_metadata: false
    paper_metadata:
      model_group: jepa_predictive_hybrid
      predictive_robustness_suite: predictive_jepa_robustness
      predictive_gps_query_plus_plus: true
      history_window: 5
      gps_input_source_window: 2
      image_history_window: 5
      prediction_horizon: 1
      label_space: beam64
      condition_id_inputs_forbidden:
        - condition
        - c_idx
        - d_idx
        - predictive_condition_id
        - gps_condition
        - image_condition
    encoders:
      image:
        pooling: predictive_gps_query
        gps_query_pool: null
        pooler:
          type: predictive_gps_query
          latent_dim: 64
          condition_dim: 64
          content_queries: 2
          gps_queries: 2
          num_heads: 4
          dropout: 0.0
          condition_source: projected_gps
          residual_scale_init: 0.1
          temporal_predictor:
            type: gru
            history_window: 5
            insufficient_history: zero
          reliability_gate:
            type: mlp
            hidden_dim: 32
          return_attention: false
    representation_core:
      type: feature_consistency_gate
      d_model: 64
      output_dim: 64
      history_window: 5
      image_index: 0
      gps_index: 1
      dropout: 0.1
loss:
  auxiliary:
    predictive_latent:
      enabled: true
      weight: 0.05
      modality: image
      prediction_key: temporal_predicted_latent
      target_key: current_latent
      detach_target: true
      type: mse
training:
  epochs: 100
  early_stopping_metric: val_adba
  early_stopping_mode: max
evaluation:
  difficulty:
    enabled: true
    profiles:
      - id: predictive_gps_query_plus_plus_eval_p0
        stage: evaluation
        split: test
        condition: P0_clean_current
        seed: 17
        operators:
          - type: predictive_jepa_robustness
            history_window: 5
