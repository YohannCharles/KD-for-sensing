_base_: image_gps_jepa_gps_biased_best_beambench_fair_lowmem.yaml

experiment:
  name: fusion_image_gps_jepa_gps_biased_pooler_param_groups_beambench_fair_lowmem
  ablation: fair_gps_biased_pooler_param_groups
output:
  run_name: fusion_image_gps_jepa_gps_biased_pooler_param_groups_beambench_fair_lowmem
model:
  primary:
    encoders:
      image:
        pooler:
          type: gps_query_attention
          k_queries: 2
          num_heads: 4
          condition_dim: 64
          latent_dim: 64
          dropout: 0.0
          condition_source: projected_gps
          return_attention: false
        adapter:
          type: identity
training:
  optimizer:
    type: adam
    strict: false
    require_all_matched: false
    parameter_groups:
    - name: jepa_context_encoder
      module_patterns:
      - encoders.image.context_encoder
      lr: 0.0001
      weight_decay: 0.0001
    - name: jepa_pooler_adapter
      module_patterns:
      - encoders.image.pooler
      - encoders.image.adapter
      lr: 0.001
      weight_decay: 0.0
    - name: gps_encoder_projector
      module_patterns:
      - encoders.gps
      - projectors.gps
      lr: 0.00075
      weight_decay: 0.0001
    - name: fusion_head
      module_patterns:
      - representation_core
      - heads
      lr: 0.00075
      weight_decay: 0.0001
