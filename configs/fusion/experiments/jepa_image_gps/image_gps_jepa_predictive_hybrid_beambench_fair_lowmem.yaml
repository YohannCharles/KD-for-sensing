_base_: image_gps_jepa_gps_query_pool_best_beambench_fair_lowmem.yaml

experiment:
  name: fusion_image_gps_jepa_predictive_hybrid_beambench_fair_lowmem
  ablation: predictive_hybrid_fusion
  model_group: jepa_predictive_hybrid
output:
  dir: outputs/analysis/predictive_jepa_robustness/train
  run_name: fusion_image_gps_jepa_predictive_hybrid_beambench_fair_lowmem
data:
  dataset:
    seq_len: 4
    num_pred: 1
difficulty:
  enabled: true
  profiles:
    - id: predictive_jepa_robustness_train_p4
      stage: train
      split: train
      condition: P4_joint_predictive_recovery
      seed: 17
      fallback: deterministic_jitter
      operators:
        - type: predictive_jepa_robustness
          history_window: 3
          target_time_index: -1
          gps_counterfactual_fallback: deterministic_jitter
model:
  seq_length: 4
  num_pred: 1
  primary:
    seq_length: 4
    num_pred: 1
    paper_metadata:
      model_group: jepa_predictive_hybrid
      predictive_robustness_suite: predictive_jepa_robustness
      condition_id_inputs_forbidden:
        - c_idx
        - d_idx
        - predictive_condition_id
        - gps_condition
        - image_condition
    encoders:
      image:
        pooling: hybrid_residual_query
        gps_query_pool: null
        pooler:
          type: hybrid_residual_query
          latent_dim: 64
          condition_dim: 64
          content_queries: 2
          gps_queries: 2
          num_heads: 4
          dropout: 0.0
          condition_source: projected_gps
          require_condition: true
          residual_alpha_init: 0.1
          return_attention: false
        temporal_auxiliary:
          enabled: true
          history_window: 3
          insufficient_history: raw
    representation_core:
      type: feature_consistency_gate
      d_model: 64
      output_dim: 64
      history_window: 3
      image_index: 0
      gps_index: 1
      dropout: 0.1
training:
  epochs: 100
  early_stopping_metric: val_adba
  early_stopping_mode: max
evaluation:
  difficulty:
    enabled: true
    profiles:
      - id: predictive_jepa_robustness_eval_p0
        stage: evaluation
        split: test
        condition: P0_clean_current
        seed: 17
        operators:
          - type: predictive_jepa_robustness
            history_window: 3
