_base_: image_gps_supervised_2604_s32_s34_lowmem.yaml

experiment:
  name: geometry_prior_logit_fusion_2604_s32_s34_lowmem
  ablation: geometry_prior_logit_fusion
  seed: 17
model:
  gps_input_seq_len: 2
  primary:
    geometry_prior:
      enabled: true
      type: gps_geometry_prior
      feature_mode: relative_polar
      prior_mode: circular_gaussian
      mode: assistive
      sigma: 2.5
      fallback_mode: uniform
      label_space: beam64
      normalization_artifact: deepsense6g_2604_s32_s34_stratified80_seq5
      calibration_source: train_split:gps_relative_polar
      history_window: 5
      gps_source_window: 2
    logit_fusion:
      enabled: true
      type: geometry_prior_logit_fusion
      mode: assistive
      prior_weight: 0.25
      max_prior_weight: 0.45
      min_image_weight: 0.55
      disagreement_threshold: 0.35
output:
  run_name: geometry_prior_logit_fusion_2604_s32_s34_lowmem
