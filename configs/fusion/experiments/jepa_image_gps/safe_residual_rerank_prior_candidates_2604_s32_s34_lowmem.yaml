_base_: geometry_prior_logit_fusion_2604_s32_s34_lowmem.yaml

experiment:
  name: safe_residual_rerank_prior_candidates_2604_s32_s34_lowmem
  ablation: safe_residual_rerank_prior_candidates
model:
  primary:
    reranker:
      enabled: true
      type: safe_residual_beam_reranker
      anchor_top_k: 8
      prior_top_k: 10
      neighborhood_radius: 2
      max_candidates: 20
      max_residual_scale: 0.3
      anchor_confidence_threshold: 0.55
      image_observability_threshold: 0.75
      disagreement_threshold: 0.35
      fallback_policy: no_regret
      fallback_on_gps_invalid: true
      gps_invalid_residual_scale: 0.1
      diagnostics_mode: full
loss:
  safe_rerank:
    enabled: true
    weight: 0.15
    candidate_ce_weight: 1.0
    pairwise_margin_weight: 0.05
    margin: 0.1
    no_regret_weight: 0.1
    anchor_dba_threshold: 1
output:
  run_name: safe_residual_rerank_prior_candidates_2604_s32_s34_lowmem
