name: jepa_visual_architecture_sweep_smoke
run_tier: smoke
output_root: outputs/analysis/jepa_visual_architecture_sweep
manifest: configs/diagnostics/jepa_visual_architecture_sweep_manifest.yaml
strict_comparability:
  split: beambench_tableiii_input_s32_s34_train_s31_s34_test
  scene_set: [32, 33, 34]
  seed: 17
  history_window: 5
  gps_input_source_window: 2
  prediction_horizon: 1
  beam_label_space: beam64
  metric_profile: beambench_linear_topk
  distance_metric: linear
  normalization_artifact: config_resolved
  difficulty_digest: smoke
  output_root: outputs/analysis/jepa_visual_architecture_sweep
candidates:
  - patch16_mean_baseline
  - patch14_stage1_gps_query
  - patch16_local_depthwise
  - patch16_cvt_depthwise
  - conv_stem_s16_stage1
  - resnet18_layer4_tokens
  - gps_query_k_tokens_core
  - gps_only_control
