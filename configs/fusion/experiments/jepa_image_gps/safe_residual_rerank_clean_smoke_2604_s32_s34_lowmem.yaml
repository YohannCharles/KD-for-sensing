    weight: 0.05
    candidate_ce_weight: 1.0
    pairwise_margin_weight: 0.0
    no_regret_weight: 0.1
    anchor_dba_threshold: 1
output:
  run_name: safe_residual_rerank_clean_smoke_2604_s32_s34_lowmem
