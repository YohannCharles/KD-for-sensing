experiment:
  name: token_transformer_image_radar_no_kd
  task: fusion
  seed: 42
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [image, radar]
    image_channels: 1
    radar_channels: 2
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
  student:
    type: token_transformer_fusion
    modalities: [image, radar]
    image_channels: 1
    radar_channels: 2
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    num_heads: 4
    num_layers: 2
    dropout: 0.1
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
  beam_soft:
    enabled: false
    weight: 0.0
  unimodal_aux:
    weight: 0.0
training:
  epochs: 100
  lr: 0.0004
  weight_decay: 0.0
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
  modality_dropout:
    enabled: false
    drop_prob: 0.0
    min_keep: 1
  counterfactual:
    enabled: false
    mode: sample_one
    start_epoch: 0
    weight: 0.0
output:
  dir: outputs
  run_name: token_transformer_image_radar_no_kd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
