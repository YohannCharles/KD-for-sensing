experiment:
  name: physics_informed_mmw_debug
  task: fusion
  seed: 7
  device: auto
data:
  use_csi_input: false
  csi_input_mode: none
  history_len: 5
  partial_subcarrier_ratio: 0.25
  partial_antenna_ratio: 0.25
  csi_noise_snr_db: 20
  allow_oracle_full_csi_input: false
  dataset:
    type: mmw
    condition: sunny
    scene: Town10_skybridge_seed24
    seq_len: 4
    num_pred: 1
    portion: 0.02
    enabled_modalities:
    - image
    image_profile: rgb_imagenet
    image_size:
    - 224
    - 224
    use_csi: false
    path_semantic:
      enabled: true
      return_path_params: true
      return_raw_path_params: true
    physical_label:
      enabled: true
    physics_supervision:
      required_fields: []
      use_csi_input: false
      csi_input_mode: none
      history_len: 5
      partial_subcarrier_ratio: 0.25
      partial_antenna_ratio: 0.25
      csi_noise_snr_db: 20
      allow_oracle_full_csi_input: false
      num_paths: 3
    return_modality_availability: true
    return_metadata: true
  dataloader:
    train_batch_size: 2
    test_batch_size: 2
    num_workers: 0
model:
  modalities:
  - image
  feature_size: 64
  num_classes: 64
  num_pred: 1
  downsample_ratio: 1
  seq_length: 4
  primary:
    type: pinn_multimodal_beam
    modalities:
    - image
    hidden_dim: 64
    num_classes: 64
    num_pred: 1
    num_paths: 3
    num_subcarriers: 1
    num_antennas: 64
    use_direct_head: true
    use_physics_head: true
    physics_beta: 0.5
loss:
  type: cross_entropy
  physics:
    enabled: true
    beam_ce_weight: 1.0
    csi_reconstruction:
      enabled: true
      weight: 0.1
    path_consistency:
      enabled: true
      weight: 0.05
    beam_power_distribution:
      enabled: true
      weight: 0.05
    array_consistency:
      enabled: true
      weight: 0.01
training:
  epochs: 1
  lr: 0.0005
  weight_decay: 0.0
  grad_clip: 5.0
  use_early_stopping: false
output:
  dir: outputs
  run_name: physics_informed_mmw_debug
scheduler:
  type: none
