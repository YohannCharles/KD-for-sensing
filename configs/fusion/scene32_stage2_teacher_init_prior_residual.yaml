experiment:
  name: scene32_stage2_teacher_init_prior_residual
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
  student:
    type: craf_fusion
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    num_heads: 4
    num_layers: 2
    dropout: 0.1
    reliability:
      gate_type: prior_residual_sigmoid
      min_gate: 0.0
      hidden_size: 32
      use_confidence_features: true
      residual_zero_init: true
      dataset_prior:
        image: 0.20
        radar: 0.20
        gps: 0.85
        lidar: 0.15
        mmwave: 0.90
teacher:
  registry_path: outputs/scene32/teacher_registry.json
  load_encoders: true
  freeze_encoders: true
  strict: true
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
  beam_soft:
    enabled: true
    weight: 0.03
    sigma: 2.0
    circular: true
  unimodal_aux:
    weight: 0.0
  gate_weight: 0.0
  prior_regularization:
    enabled: true
    weight: 0.05
    loss_type: mse
training:
  epochs: 100
  warmup_epochs: 0
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
  modality_dropout:
    enabled: false
    drop_prob: 0.0
    min_keep: 1
  counterfactual:
    enabled: false
    mode: sample_one
    start_epoch: 0
    weight: 0.0
  reliability_kd:
    enabled: false
    weight: 0.0
evaluation:
  modality_subsets:
    enabled: true
    subsets: [gps, mmwave, gps_mmwave, strong_only, weak_only, all]
output:
  dir: outputs
  run_name: scene32_stage2_teacher_init_prior_residual
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
