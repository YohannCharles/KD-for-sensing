experiment:
  name: craf_all_modalities_stabilized_no_kd
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
  student:
    type: craf_fusion
    modalities: [image, radar, gps, lidar, mmwave]
    image_channels: 1
    radar_channels: 2
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    num_heads: 4
    num_layers: 2
    dropout: 0.1
    reliability:
      gate_type: softmax
      gate_temperature_start: 2.0
      gate_temperature_end: 0.7
      gate_temperature_anneal_epochs: 60
      scale_by_available: true
      min_gate: 0.03
      use_dataset_prior: false
distillation:
  type: no_kd
  teacher_model_name: null
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
  beam_soft:
    enabled: true
    weight: 0.03
    sigma: 2.0
    circular: true
  unimodal_aux:
    weight: 0.0
  uni_weight_warmup: 0.1
  uni_weight_after_warmup: 0.0
  gate_weight: 0.1
  gate_ramp_epochs: 10
training:
  epochs: 100
  warmup_epochs: 25
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
  modality_dropout:
    enabled: true
    drop_prob: 0.1
    min_keep: 1
  counterfactual:
    enabled: true
    mode: context_marginal
    start_epoch: 25
    weight: 0.1
    ignore_delta_eps: 0.03
    use_ce_only: true
    num_drop_per_batch: 1
    min_keep: 1
    no_grad_drop_forward: true
output:
  dir: outputs
  run_name: craf_all_modalities_stabilized_no_kd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
