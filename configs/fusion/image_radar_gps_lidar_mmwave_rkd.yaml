paths:
  weights_dir: outputs/scene32/image_radar_gps_lidar_mmwave_teacher_no_kd/checkpoints
experiment:
  name: image_radar_gps_lidar_mmwave_rkd
  task: fusion
  seed: 0
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_roi: [-30.0, 30.0, -30.0, 30.0, -3.0, 5.0]
    lidar_normalize: false
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: fusion_teacher
    modalities: [image, radar, gps, lidar, mmwave]
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
  student:
    type: fusion_student
    modalities: [image, radar, gps, lidar, mmwave]
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 2]
    gps_input_size: 3
    lidar_channels: 3
    mmwave_input_size: 64
distillation:
  type: rkd
  temperature: 3.0
  alpha: 0.4
  alpha_warmup_epochs: 0
  teacher_model_name: best.pth
  rkd_pairs_per_anchor: 4
  rkd_distance_weight: 10.0
  rkd_angle_weight: 10.0
training:
  epochs: 100
  lr: 0.00075
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
output:
  dir: outputs
  run_name: image_radar_gps_lidar_mmwave_rkd
