paths:
  weights_dir: outputs/scene32/mmwave_teacher_no_kd/checkpoints
experiment:
  name: mmwave_rkd
  task: mmwave
  seed: 42
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 32
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_mmwave: true
    mmwave_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: mmwave_teacher
    mmwave_input_size: 64
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 1]
  student:
    type: mmwave_student
    mmwave_input_size: 64
    feature_size: 64
    num_classes: 64
    gru_params: [64, 64, 1]
distillation:
  type: rkd
  teacher_model_name: best.pth
  temperature: 3.0
  alpha: 0.1
  alpha_warmup_epochs: 0
  rkd_pairs_per_anchor: 4
  rkd_distance_weight: 100.0
  rkd_angle_weight: 100.0
training:
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs
  run_name: mmwave_rkd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
