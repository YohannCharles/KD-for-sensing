experiment:
  name: deepsense6g_camera_ae_residual_correction
  protocol: target_adapt_beambench_camera_residual
  default_ablation: camera_ae_residual_gated_anchor

data:
  dataset_type: deepsense6g
  data_root: dataset/DeepSense6G
  gps_sweep_root: outputs/analysis/deepsense6g_gps_adapter_v2_support_sweep
  label_space: mapping_disabled
  support_ratio: 0.15
  num_beams: 64
  label: future_beam1_argmax
  train_split: train
  test_split: test
  train_csv_name: train_seqs_RA_GPS_LIDAR.csv
  test_csv_name: test_seqs_RA_GPS_LIDAR.csv
  scenes:
    - scenario31
    - scenario32
    - scenario33
    - scenario34

image:
  enabled: true
  size: 64
  channels: 3
  path_columns:
    - camera8
    - camera
    - rgb
    - image
    - image_path
    - camera_path
    - rgb_path
  common_dirs:
    - camera
    - cameras
    - image
    - images
    - rgb
    - RGB

ae:
  latent_dim: 128
  batch_size: 32
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  val_fraction: 0.15
  patience: 5
  resume: true
  num_workers: 0
  reconstruction_examples: 8
  use_target_query_unlabeled: false

residual:
  gps_protocol: target_adapt_beambench
  gps_ablation: best
  gps_prior_fallback_sigma: 2.0
  delta_radius: 8
  overflow_policy: uniform
  good_error_threshold: 4
  query_label_used_for_training: false
  model_selection_split: target_support_internal_validation
  allow_query_labels_for_evaluation: true
  missing_feature_policy: fallback_gps_context

model:
  name: camera_gps_residual_fusion
  num_beams: 64
  gps_context_dim: 9
  camera_feature_dim: 128
  hidden_dim: 128
  dropout: 0.1
  delta_radius: 8
  gate_bias_init: -2.0
  overflow_policy: uniform

loss:
  final_circular_soft_ce_weight: 1.0
  residual_delta_ce_weight: 0.5
  gate_bce_weight: 0.1
  good_anchor_kl_weight: 0.1
  aux_direct_ce_weight: 0.0
  gate_entropy_weight: 0.0
  hard_sample_weight: 1.0
  good_error_threshold: 4.0
  circular_sigma: 2.0
  ignore_index: -100

train:
  seed: 42
  mode: source_pretrain_target_finetune
  epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  source_pretrain_epochs: 5
  support_finetune_epochs: 15
  early_stopping_metric: target_support_DBA
  early_stopping_split: target_support_internal_validation

rerank:
  enabled: true
  optional_ablation: camera_ae_query_rerank
  gps_topk: 16
  local_radius: 8
  hidden_dim: 128
  score_temperature: 1.0

metrics:
  dba_delta: 5.0
  good_error_threshold: 4
  topk:
    - 1
    - 3
    - 5
  gps_r15_expected:
    DBA: 0.6707
    mean_circular_error: 2.344
    error_lt4: 0.8523
  gps_reproduction_tolerance:
    DBA: 0.02
    mean_circular_error: 0.20
    error_lt4: 0.03

outputs:
  analysis_root: outputs/analysis/deepsense6g_camera_residual
  root: outputs/analysis/deepsense6g_camera_residual
  training_root: outputs/training/deepsense6g_camera_residual
  ae_training_root: outputs/training/deepsense6g_camera_ae
  feature_root: outputs/features/deepsense6g_camera_ae
  default_result_dir: outputs/analysis/deepsense6g_camera_residual/r15/mapping_disabled
  default_ae_dir: outputs/training/deepsense6g_camera_ae/r15/mapping_disabled
  default_feature_dir: outputs/features/deepsense6g_camera_ae/r15/mapping_disabled
  manifest_dir: manifest
  figures_dir: figures
  write_predictions: true
  write_diagnostics: true
  write_config_snapshot: true

ablation:
  enabled:
    - gps_prior_only
    - gps_context_only_residual
    - camera_ae_only_direct_beam
    - camera_ae_plus_gps_concat_direct_beam
    - camera_ae_residual_gated
    - camera_ae_residual_gated_anchor
    - camera_ae_residual_gated_anchor_source_pretrain
  optional:
    - camera_ae_query_rerank
