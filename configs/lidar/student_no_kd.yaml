experiment:
  name: lidar_student_no_kd
  task: lidar
  seed: 42
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_lidar: true
    lidar_bev_size:
    - 224
    - 224
    lidar_roi:
    - -30.0
    - 30.0
    - -30.0
    - 30.0
    - -3.0
    - 5.0
    lidar_fov_degrees: null
    lidar_cache_dir: lidar_bev_cache
    lidar_normalize: false
    lidar_normalization:
      enabled: true
      mode: streaming_stats
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  d_model: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: modular_sequence
    modalities: [lidar]
    lidar_channels: 3
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      lidar:
        type: lidar_cnn
        output_dim: 64
        lidar_channels: 3
    representation_core:
      type: single_gru
      d_model: 64
      hidden_size: 64
      num_layers: 1
    heads:
      beam:
        type: beam_head
        dropout: 0.1
  student:
    type: modular_sequence
    modalities: [lidar]
    lidar_channels: 3
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      lidar:
        type: lidar_cnn
        output_dim: 64
        lidar_channels: 3
    representation_core:
      type: single_gru
      d_model: 64
      hidden_size: 64
      num_layers: 1
    heads:
      beam:
        type: beam_head
        dropout: 0.1
distillation:
  type: no_kd
  teacher_model_name: null
  temperature: 3.0
  alpha: 0.4
  alpha_warmup_epochs: 0
  rkd_pairs_per_anchor: 4
  rkd_distance_weight: 50.0
  rkd_angle_weight: 50.0
training:
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs
  run_name: lidar_student_no_kd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
