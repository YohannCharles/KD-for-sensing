experiment:
  name: gps_neural_coarse_smoke
  task: gps
  objective: beam
  device: auto
data:
  dataset:
    type: synthetic_sequence
    length: 16
    seq_len: 8
    num_pred: 3
    num_classes: 64
    modalities:
    - gps
  dataloader:
    batch_size: 2
    num_workers: 0
model:
  num_classes: 64
  num_pred: 3
  seq_length: 8
  primary:
    type: gps_lightweight
    gps_input_size: 3
    feature_size: 16
    num_classes: 64
    gru_params:
    - 16
    - 16
    - 1
    num_pred: 3
    coarse_anchor:
      enabled: true
      anchor_source: gps_neural_coarse
      num_classes: 64
      group_size: 8
      hidden_size: 16
      loss_weight: 0.2
      beam_auxiliary: true
      beam_auxiliary_weight: 0.1
loss:
  type: cross_entropy
training:
  epochs: 1
  lr: 0.001
  use_early_stopping: false
  cpu_threads:
    intra_op: 4
    inter_op: 1
output:
  dir: outputs/gps_coarse_anchor
  progress:
    enabled: true
