experiment:
  name: gps_supervised
  task: gps
  seed: 42
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  seq_length: 8
  primary:
    type: modular_sequence
    modalities:
    - gps
    gps_input_size: 3
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      gps:
        type: gps_mlp
        output_dim: 64
        gps_input_size: 3
        hidden_size: 64
        dropout: 0.1
    projectors:
      gps:
        type: linear
        dropout: 0.0
    representation_core:
      type: single_gru
      d_model: 64
      hidden_size: 64
      num_layers: 1
    heads:
      beam:
        type: beam_head
        dropout: 0.1
training:
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: false
  model_selection: false
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs
  run_name: gps_supervised
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
