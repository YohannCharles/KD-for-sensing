experiment:
  name: gps_relative_polar_no_kd
  task: gps
  seed: 42
data:
  dataset:
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    prefetch_factor: 1
model:
  teacher:
    type: gps_teacher
    gps_input_size: 3
    feature_size: 64
    num_classes: 64
    gru_params:
    - 64
    - 64
    - 1
  student:
    type: gps_teacher
    gps_input_size: 3
    feature_size: 64
    num_classes: 64
    gru_params:
    - 64
    - 64
    - 1
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
distillation:
  type: no_kd
  teacher_model_name: null
output:
  run_name: gps_relative_polar_no_kd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
training:
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
