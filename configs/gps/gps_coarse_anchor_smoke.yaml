experiment:
  name: gps_coarse_anchor_smoke

data:
  data_root: dataset/MMW/sunny
  split_tag: l5p3_group_safe
  source_scenes: []
  target_scenes: []

coarse_anchor:
  enabled: true
  anchor_source: geometry_calibrated
  num_classes: 64
  group_size: 8
  horizon: 1
  calibration_mode: source
  beam_start_degrees: 0.0
  beam_direction: 1
  beam_offset: 0
  boresight_angle_degrees: 0.0
  auto_calibrate_boresight_angle: false
  auto_calibrate_beam_mapping: false
  score_width: 2.0
  score_temperature: 1.0
  neighbor_top_k: 5
  emit_beam_scores: true
  write_predictions: true
  write_metrics: true
  output_dir: outputs/gps_coarse_anchor

output:
  dir: outputs/gps_coarse_anchor
