paths:
  weights_dir: outputs/gps_teacher_no_kd/checkpoints
experiment:
  name: gps_logits_kd
  task: gps
  seed: 42
  device: auto
data:
  dataset:
    type: scenario9
    data_root: dataset/scenario9
    train_csv_name: train_seqs_RA_GPS.csv
    test_csv_name: test_seqs_RA_GPS.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    num_workers: 8
model:
  feature_size: 64
  gru_hidden_size: 64
  num_classes: 64
  seq_length_teacher: 8
  seq_length_student: 8
  num_pred: 3
  downsample_ratio: 1
  teacher:
    type: gps_teacher
    gps_input_size: 3
    feature_size: 64
    num_classes: 64
    gru_params:
    - 64
    - 64
    - 1
  student:
    type: gps_student
    gps_input_size: 3
    feature_size: 64
    num_classes: 64
    gru_params:
    - 64
    - 64
    - 1
distillation:
  type: logits_kd
  temperature: 4.0
  alpha: 0.3
  alpha_warmup_epochs: 0
  teacher_model_name: best.pth
  rkd_pairs_per_anchor: 4
  rkd_distance_weight: 100.0
  rkd_angle_weight: 100.0
training:
  epochs: 100
  lr: 0.0008
  weight_decay: 0.0
  grad_clip: 10.0
  patience: 20
  use_early_stopping: true
  min_delta: 0.0001
output:
  dir: outputs
  run_name: gps_logits_kd
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
