experiment:
  name: gps_window_town10_matrix
data:
  data_root: dataset/MMW/sunny
  split_tag: l5p3_group_safe
  source_scenes:
    - Town10_skybridge_seed24
  target_scenes:
    - Town10_crossroad_seed24
    - Town10_Hroad_seed42
gps_window:
  algorithm: constant_velocity
  num_classes: 64
  group_size: 8
  horizon: 3
  history_window: 5
  min_history: 2
  angle_smoothing: true
  smoothing_window: 3
  angular_velocity_weight: 0.25
  velocity_decay: 0.9
  beam_offset: 0
  score_width: 2.0
  score_temperature: 1.0
  neighbor_top_k: 5
  fallback: majority
  calibration_mode: source
output:
  dir: outputs/gps_window_baseline_town10_matrix
sweep:
  enabled: true
  algorithm: [geometry_last, constant_velocity]
  history_window: [3, 5]
  smoothing_window: [0, 3]
  angle_smoothing: [false, true]
  velocity_decay: [0.8, 1.0]
  beam_offset: [-2, -1, 0, 1, 2]
  score_width: [1.5, 2.0, 3.0]
  fallback: [majority]
  fallback_weight: [1.0]
  max_runs: 24

