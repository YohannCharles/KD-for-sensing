experiment:
  task: fusion
  objective: beam
  seed: 0
  train_seed: 0
  device: auto
data:
  split_protocol: mmw_id_stratified_block_v1
  split_seed: 0
  block_size: 32
  split_ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  split_manifest: outputs/splits/mmw_id_stratified_block_v1/seed_0.json
  dataset:
    type: mmw
    data_root: dataset/MMW/sunny
    seq_len: 5
    num_pred: 1
    image_profile: rgb_imagenet
    image_size: [224, 224]
    fft_tuple: [64, 256, 128]
    clipped_range: 128
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
  dataloader:
    train_batch_size: 32
    validation_batch_size: 32
    test_batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  domain_balanced_sampling:
    enabled: true
    seed: 0
    replacement: true
temporal_missing:
  enabled: true
  history_window: 5
  prediction_window: 1
  mode: balanced_pattern_schedule
  schedule_id: mmw_fair_pattern_v1
  panel_size: 600
  condition_counts:
    clean: 120
    drop1: 60
    drop2: 60
    drop3: 60
    token20: 60
    token40: 60
    token60: 60
    token80: 60
    token90: 60
  subset_balance: exact_within_drop_count
  token_balance: exact_aggregate_cell_marginals
  preserve_unmasked_for_superset: false
model:
  feature_size: 64
  d_model: 64
  num_classes: 64
  seq_length: 5
  num_pred: 1
  modalities: [image, radar, gps, lidar]
  image_profile: rgb_imagenet
training:
  epochs: 40
  max_epochs: 40
  lr: 0.0005
  weight_decay: 0.0001
  resume: false
  final_test:
    enabled: false
  amp:
    enabled: true
    dtype: float16
    grad_scaler: true
  validation:
    interval_epochs: 40
  allow_tf32: true
  cudnn_benchmark: false
scheduler:
  type: none
evaluation:
  k_values: [1, 5]
  dba_delta: 5
  missing_patterns:
    enabled: true
    patterns:
      - full
      - missing_image
      - missing_radar
      - missing_gps
      - missing_lidar
      - image_only
      - radar_only
      - gps_only
      - lidar_only
      - missing_image_radar
      - missing_image_gps
      - missing_image_lidar
      - missing_radar_gps
      - missing_radar_lidar
      - missing_gps_lidar
    prediction_index: last
output:
  dir: outputs/mmw_trajectory_u0
  run_name: seed0
  group_by_scene: false
  overwrite: false
  progress:
    enabled: false
