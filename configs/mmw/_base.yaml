experiment:
  task: fusion
  objective: beam
  seed: 1
  device: auto
paths:
  data_root: dataset/MMW
  output_dir: outputs
data:
  cache:
    policy: read_only
  dataset:
    type: mmw
    data_root: dataset/MMW/sunny
    seq_len: 5
    num_pred: 1
    image_profile: rgb_imagenet
    image_size: [224, 224]
    fft_tuple: [64, 256, 128]
    clipped_range: 128
    use_csi: false
    use_mmwave: false
    use_gps: true
    gps_feature_mode: relative_polar
    gps_normalize: true
    use_lidar: true
    lidar_bev_size: [224, 224]
    lidar_normalize: false
    input_profiles:
      image: rgb_imagenet
      radar: ra_da_maps
      gps: relative_polar_history
      lidar: bev_projection
  dataloader:
    train_batch_size: 32
    test_batch_size: 32
    validation_batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  domain_balanced_sampling:
    enabled: true
    seed: 1
    replacement: true
temporal_missing:
  enabled: true
  history_window: 5
  prediction_window: 1
  temporal_aggregation: masked_mean
  mode: stratified_modality_temporal
  train_missing_drop_counts: 0,1,2,3
  train_temporal_missing_rates: 0.0,0.2,0.4,0.6,0.8
  train_temporal_missing_types: modality_level,frame_level,modality_frame,block
  ensure_at_least_one_cell: true
  ensure_at_least_one_frame: true
  ensure_at_least_one_modality: true
  preserve_unmasked_for_superset: false
model:
  feature_size: 64
  d_model: 64
  num_classes: 64
  seq_length: 5
  num_pred: 1
  modalities: [image, radar, gps, lidar]
  image_profile: rgb_imagenet
training:
  epochs: 40
  max_epochs: 40
  lr: 0.0005
  weight_decay: 0.0001
  use_early_stopping: false
  model_selection: false
  resume: false
  amp:
    enabled: true
    dtype: float16
    grad_scaler: true
  epoch_subsampling:
    enabled: false
  validation:
    interval_epochs: 40
  allow_tf32: true
  cudnn_benchmark: true
scheduler:
  type: none
evaluation:
  k_values: [1, 5]
  dba_delta: 5
  missing_patterns:
    enabled: true
    patterns:
      - full
      - missing_image
      - missing_radar
      - missing_gps
      - missing_lidar
      - image_only
      - radar_only
      - gps_only
      - lidar_only
      - missing_image_radar
      - missing_image_gps
      - missing_image_lidar
      - missing_radar_gps
      - missing_radar_lidar
      - missing_gps_lidar
    prediction_index: last
output:
  dir: outputs/mmw_all_weather
  run_name: seed1
  group_by_scene: false
  overwrite: false
  progress:
    enabled: false
  tensorboard:
    enabled: false
checkpoint:
  registry:
    enabled: false
difficulty:
  enabled: false
  profiles: []
random_modality_dropout:
  enabled: false
mmw_all_weather_protocol:
  split_tag: h5p1_strict_v2
  screening_role: local_validation
  checkpoint_policy: fixed_epoch_last_pth
  domain_macro_primary: true
  weather_label_used_as_input: false
  enabled_modalities: [image, radar, gps, lidar]
  excluded_sensitive_fields: [csi, channel, mmwave, beam_power, path, radio_labels]
