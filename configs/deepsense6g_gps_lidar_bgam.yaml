experiment:
  name: deepsense6g_gps_lidar_bgam_reranker
  protocol: target_adapt_beambench_gps_lidar_bgam
  default_ablation: gps_pseudo_history_soft_bgam

data:
  dataset_type: deepsense6g
  data_root: dataset/DeepSense6G
  gps_sweep_root: outputs/analysis/deepsense6g_gps_adapter_v2_support_sweep
  top8_manifest_path: outputs/analysis/deepsense6g_top8_selector/r15/mapping_enabled/manifest/top8_candidate_manifest.csv
  topk_candidate_source: outputs/analysis/deepsense6g_top8_selector/r15/mapping_enabled
  gps_v2_artifact_root: outputs/analysis/deepsense6g_gps_adapter_v2_support_sweep/r15/mapping_enabled
  label_space: mapping_enabled
  label_spaces:
    mapping_enabled:
      enabled: true
      label_space: deepsense6g_centered_beam_v1
      num_classes: 64
      direction: 1
      offset: 33
      fit_source: inline_beambench_center_index_31
    mapping_disabled:
      enabled: false
  support_ratio: 0.15
  num_beams: 64
  topk: 8
  label: future_beam1_argmax
  train_split: train
  test_split: test
  train_csv_name: train_seqs_RA_GPS_LIDAR.csv
  test_csv_name: test_seqs_RA_GPS_LIDAR.csv
  scenes:
    - scenario31
    - scenario32
    - scenario33
    - scenario34
  column_mapping:
    sample_id: sample_id
    scene: scene
    role: support_query_role
    target_label: target_label
    lidar_path: lidar_path
    lidar_bev_cache_path: lidar_bev_cache_path
    user_x: E
    user_y: N
    rsu_x: rsu_x
    rsu_y: rsu_y
    rsu_yaw: rsu_yaw
    user_lat: user_lat
    user_lon: user_lon
    rsu_lat: rsu_lat
    rsu_lon: rsu_lon

candidate:
  topk: 8
  num_beams: 64
  require_top8_manifest: false
  gps_protocol: target_adapt_beambench
  gps_ablation: best_by_scene

geometry:
  coordinate_frame: auto
  yaw_unit: radians
  yaw_zero_axis: x
  yaw_direction: ccw
  missing_rsu_yaw: use_default
  default_rsu_yaw: 0.0
  default_rsu_x: 0.0
  default_rsu_y: 0.0
  lat_lon_method: equirectangular
  beam_angle_convention: dft_ula_broadside_approximation
  beam_angle_table: ""
  fallback_beam_angle_table: dft_ula_approximation

lidar:
  enabled: true
  profile: bev_cache
  data_root: dataset/DeepSense6G
  cache_dir: outputs/cache/deepsense6g_lidar_bev
  missing_policy: zeros
  input_channels: 3
  bev_size:
    - 64
    - 64
  roi:
    - -30.0
    - 30.0
    - -30.0
    - 30.0
    - -3.0
    - 5.0
  fov_degrees: null
  remove_ground: false
  ground_z_threshold: 0.1
  cell_center_convention: center
  cache_version: bgam_bev_v1
  rebuild_cache_if_missing: false

bgam:
  enabled: true
  default_mode: history_pseudo_soft
  sigma: 0.35
  hard_half_width: 0.28
  adaptive_sigma:
    enabled: true
    entropy_scale: 0.20
    uncertainty_scale: 0.25
    max_sigma: 1.20
  topk_union:
    aggregation: weighted_max
  debug_masks:
    enabled: false
    max_samples: 8
    output_dir: debug_masks

history:
  enabled: true
  history_len: 8
  alignment_policy: nearest_past
  pseudo_label_source: gps_v2_logits
  allow_geometry_fallback: false
  sensor_period: 1.0
  beam_period: 1.0

gps:
  frozen_prior: true
  use_candidate_probs: true
  use_gps_logits: false
  logits_source: gps_v2_r15

model:
  name: gps_lidar_bgam_beam_predictor
  topk: 8
  num_beams: 64
  d_model: 64
  hidden_dim: 96
  dropout: 0.1
  fusion: concat_mlp
  lambda_lidar_init: 0.5
  lambda_lidar_max: 3.0
  lidar:
    in_channels: 3
    channels:
      - 32
      - 64
    freeze_lidar_encoder: false
  cross_attention:
    num_heads: 4
    num_queries: 1
  full64_head:
    enabled: false

loss:
  candidate_ce_weight: 1.0
  candidate_soft_ce_weight: 0.5
  nearest_miss_soft_weight: 0.25
  full64_ce_weight: 0.0
  prior_anchor_kl_weight: 0.05
  circular_sigma: 2.0
  ignore_index: -100
  num_beams: 64

train:
  seed: 42
  mode: support_only
  epochs: 2
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 2
  cpu_threads: 4
  interop_threads: 1
  pin_memory: auto
  prefetch_factor: 2
  persistent_workers: true
  cudnn_benchmark: true
  amp: false
  device: auto
  patience: 2
  validation_fraction: 0.25
  early_stopping_metric: target_support_DBA
  early_stopping_split: target_support_internal_validation
  max_train_samples: 64
  max_eval_samples: 128
  query_label_used_for_training: false

eval:
  batch_size: 8
  num_workers: 2
  pin_memory: auto
  prefetch_factor: 2
  persistent_workers: true
  max_samples: 128
  write_predictions: true
  checkpoint_required: false

ablation:
  enabled:
    - gps_only
    - lidar_only_no_bgam
    - gps_lidar_no_bgam
    - gps_lidar_topk_union_bgam
    - gps_pseudo_history_soft_bgam
    - gps_pseudo_history_topk_union_bgam
    - gps_pseudo_history_per_candidate_rerank
  trainable:
    - gps_pseudo_history_soft_bgam
    - gps_pseudo_history_per_candidate_rerank
  optional:
    - oracle_history_bgam_upper_bound

metrics:
  dba_delta: 5.0
  topk:
    - 1
    - 3
    - 5
    - 8

anti_leakage:
  query_label_used_for_training: false
  forbid_label_in_bgam: true
  forbid_query_normalizer_fit: true
  mask_sources:
    - theta_gps
    - distance_to_rsu
    - candidate_beams
    - candidate_probs
    - gps_entropy
    - history_pseudo_beams
    - history_pseudo_probs
    - history_pseudo_entropy
    - history_valid_mask
    - beam_angle_table

outputs:
  root: outputs/analysis/deepsense6g_gps_lidar_bgam
  default_result_dir: outputs/analysis/deepsense6g_gps_lidar_bgam/r15/mapping_enabled
  manifest_dir: manifest
  manifest_name: gps_lidar_bgam_manifest.csv
  metadata_name: gps_lidar_bgam_manifest_metadata.json
  write_predictions: true
  write_diagnostics: true
  write_config_snapshot: true
