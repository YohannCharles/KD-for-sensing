experiment:
  name: image_resnet18_rgb_supervised
  task: image
  seed: 42
  device: auto
data:
  dataset:
    type: deepsense6g
    scene: 31
    train_csv_name: train_seqs_RA_GPS_LIDAR.csv
    test_csv_name: test_seqs_RA_GPS_LIDAR.csv
    seq_len: 8
    num_pred: 3
    portion: 1.0
    image_profile: rgb_imagenet
    image_size:
    - 224
    - 224
  dataloader:
    train_batch_size: 16
    test_batch_size: 16
    num_workers: 4
    prefetch_factor: 1
model:
  feature_size: 64
  d_model: 64
  num_classes: 64
  num_pred: 3
  downsample_ratio: 1
  seq_length: 8
  primary:
    type: modular_sequence
    modalities:
    - image
    image_profile: rgb_imagenet
    feature_size: 64
    d_model: 64
    num_classes: 64
    num_pred: 3
    encoders:
      image:
        type: resnet18_imagenet_rgb
        output_dim: 64
        pretrained: true
        weights: DEFAULT
        freeze_backbone: true
        unfreeze_stages:
        - layer4
        dropout: 0.1
    representation_core:
      type: single_gru
      d_model: 64
      hidden_size: 64
      num_layers: 1
    heads:
      beam:
        type: beam_head
        dropout: 0.1
loss:
  type: focal_loss
  alpha: 1
  gamma: 2
training:
  epochs: 100
  lr: 0.0004
  weight_decay: 0.0001
  grad_clip: 10.0
  patience: 20
  use_early_stopping: false
  model_selection: false
  early_stopping_metric: val_adba
  early_stopping_mode: max
  min_delta: 0.0001
output:
  dir: outputs
  run_name: image_resnet18_rgb_supervised
scheduler:
  type: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-06
