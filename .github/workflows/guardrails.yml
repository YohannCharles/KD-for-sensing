name: guardrails

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  manual-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1
      - name: Install smoke dependencies
        run: python -m pip install -e ".[dev]"
      - name: CLI and config smoke
        run: make verify-cli-config PYTHON=python PYTEST="python -m pytest"
      - name: Python compile
        run: make verify-compile PYTHON=python PYTEST="python -m pytest"
      - name: Surface doctor and guardrail scans
        run: >
          python -m kd_sensing.cli.project_surface_doctor
          --scope scripts
          --scope configs
          --scope hotspots
          --scope security
          --scope closeout
          --format markdown
          --fail-on error

# This workflow is intentionally data-free: it must not read real dataset/,
# start kd-sensing-train, load checkpoints, or write runtime outputs/logs/cache.
