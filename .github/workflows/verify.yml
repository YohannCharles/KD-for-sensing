name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.3.1
      - name: Install smoke dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run quick verify
        run: make verify-quick PYTHON=python PYTEST="python -m pytest"
