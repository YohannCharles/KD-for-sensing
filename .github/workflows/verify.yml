name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: kd_sensing_smoke_dev
          environment-file: envs/smoke-dev.yml
          auto-activate-base: false
      - name: Install OpenSpec
        shell: bash -el {0}
        run: npm install -g @fission-ai/openspec@1.3.1
      - name: Verify
        shell: bash -el {0}
        run: >-
          make verify-full
          OPENSPEC="conda run -n kd_sensing_smoke_dev openspec"
          PYTHON="conda run -n kd_sensing_smoke_dev python"
          PYTEST="conda run -n kd_sensing_smoke_dev pytest"
