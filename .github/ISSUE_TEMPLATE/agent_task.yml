name: Agent task
description: Scope a coding-agent task with OpenSpec, validation, and artifact boundaries.
title: "[agent] "
labels:
  - agent-task
body:
  - type: input
    id: openspec_change
    attributes:
      label: OpenSpec change
      description: Provide the active change id, or explain why this is a narrow fix without a change.
      placeholder: add-example-change
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the intended outcome in one short paragraph.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: List anything the agent must not solve in this task.
  - type: checkboxes
    id: touched_areas
    attributes:
      label: Expected touched areas
      options:
        - label: model
        - label: data
        - label: config
        - label: cli
        - label: diagnostics
        - label: docs
        - label: claims
        - label: CI or security guardrails
  - type: textarea
    id: context
    attributes:
      label: Required context
      description: Link relevant OpenSpec artifacts, README sections, docs, tests, or prior PRs.
  - type: textarea
    id: allowed_artifacts
    attributes:
      label: Allowed local artifacts to read
      description: Name read-only local outputs/logs/cache/checkpoints if needed. Do not ask the agent to commit them.
      placeholder: "None, or outputs/analysis/... read-only"
  - type: textarea
    id: forbidden_paths
    attributes:
      label: Forbidden paths and operations
      value: |
        Do not modify /root/.container_env, /etc/profile, /etc/environment, SSH config, system credentials, dataset/, outputs/, logs/, cache/, or checkpoint files.
        Do not run real training, delete artifacts, archive changes, reset the worktree, or restore retired entrypoints unless explicitly requested.
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Include focused commands and any acceptable reason they may be skipped.
      placeholder: |
        openspec validate <change> --strict
        openspec validate --all --strict
        conda run -n kd_mm_beam pytest tests/test_architecture_boundaries.py -q
  - type: textarea
    id: rollback
    attributes:
      label: Stop or rollback conditions
      description: Define when the agent should pause for human guidance.
