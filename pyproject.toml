[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-sensing"
version = "0.1.0"
description = "Multimodal few-shot cross-scene beam prediction workflows for supervised and adaptation experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scipy",
    "scikit-image",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytorch-model-summary",
    "thop",
]
visualization = [
    "gradio",
    "plotly",
]

[project.scripts]
kd-sensing-train = "kd_sensing.cli.train:main"
kd-sensing-evaluate = "kd_sensing.cli.evaluate:main"
kd-sensing-preprocess = "kd_sensing.cli.preprocess:main"
kd-sensing-runs = "kd_sensing.cli.runs:console_main"
kd-sensing-clean-runtime-artifacts = "kd_sensing.cli.cleanup_runtime_artifacts:main"
kd-sensing-export-viewer-manifest = "kd_sensing.cli.export_viewer_manifest:main"
kd-sensing-visualize-modalities = "kd_sensing.cli.visualize_modalities:main"
kd-sensing-target-shot-split = "kd_sensing.cli.target_shot_split:main"
kd-sensing-distribution-shift = "kd_sensing.cli.distribution_shift:main"
kd-sensing-gps-window-baseline = "kd_sensing.cli.gps_window_baseline:main"
kd-sensing-gps-coarse-anchor = "kd_sensing.cli.gps_coarse_anchor:main"
kd-sensing-mmw-town-gps-v2 = "kd_sensing.cli.mmw_town_gps_v2:main"
kd-sensing-plot-mmw-town-gps-v2 = "kd_sensing.cli.plot_mmw_town_gps_v2:main"
kd-sensing-compare-mmw-town-gps-v2 = "kd_sensing.cli.compare_mmw_town_gps_v2:main"
kd-sensing-prepare-mmw-town-top8-candidate-manifest = "kd_sensing.cli.prepare_mmw_town_top8_candidate_manifest:main"
kd-sensing-prepare-mmw-town-gps-lidar-bgam-manifest = "kd_sensing.cli.prepare_mmw_town_gps_lidar_bgam_manifest:main"
kd-sensing-run-mmw-town-gps-lidar-bgam = "kd_sensing.cli.run_mmw_town_gps_lidar_bgam:main"
kd-sensing-evaluate-mmw-town-gps-lidar-bgam = "kd_sensing.cli.evaluate_mmw_town_gps_lidar_bgam:main"
kd-sensing-inspect-deepsense6g-residual-inputs = "kd_sensing.cli.inspect_deepsense6g_residual_inputs:main"
kd-sensing-prepare-deepsense6g-residual-manifest = "kd_sensing.cli.prepare_deepsense6g_residual_manifest:main"
kd-sensing-run-deepsense6g-residual-fusion = "kd_sensing.cli.run_deepsense6g_residual_fusion:main"
kd-sensing-plot-deepsense6g-residual-fusion = "kd_sensing.cli.plot_deepsense6g_residual_fusion:main"
kd-sensing-compare-deepsense6g-residual-with-gps-v2 = "kd_sensing.cli.compare_deepsense6g_residual_with_gps_v2:main"
kd-sensing-prepare-deepsense6g-camera-residual-manifest = "kd_sensing.cli.prepare_deepsense6g_camera_residual_manifest:main"
kd-sensing-train-deepsense6g-camera-ae = "kd_sensing.cli.train_deepsense6g_camera_ae:main"
kd-sensing-extract-deepsense6g-camera-ae-features = "kd_sensing.cli.extract_deepsense6g_camera_ae_features:main"
kd-sensing-run-deepsense6g-camera-residual = "kd_sensing.cli.run_deepsense6g_camera_residual:main"
kd-sensing-plot-deepsense6g-camera-residual = "kd_sensing.cli.plot_deepsense6g_camera_residual:main"
kd-sensing-compare-deepsense6g-camera-residual-with-gps-v2 = "kd_sensing.cli.compare_deepsense6g_camera_residual_with_gps_v2:main"
kd-sensing-prepare-deepsense6g-top8-candidate-manifest = "kd_sensing.cli.prepare_deepsense6g_top8_candidate_manifest:main"
kd-sensing-run-deepsense6g-top8-selector = "kd_sensing.cli.run_deepsense6g_top8_selector:main"
kd-sensing-plot-deepsense6g-top8-selector = "kd_sensing.cli.plot_deepsense6g_top8_selector:main"
kd-sensing-compare-deepsense6g-top8-selector-with-gps-v2 = "kd_sensing.cli.compare_deepsense6g_top8_selector_with_gps_v2:main"
kd-sensing-prepare-deepsense6g-gps-lidar-bgam-manifest = "kd_sensing.cli.prepare_deepsense6g_gps_lidar_bgam_manifest:main"
kd-sensing-run-deepsense6g-gps-lidar-bgam = "kd_sensing.cli.run_deepsense6g_gps_lidar_bgam:main"
kd-sensing-evaluate-deepsense6g-gps-lidar-bgam = "kd_sensing.cli.evaluate_deepsense6g_gps_lidar_bgam:main"

[tool.setuptools.packages.find]
where = ["src"]
