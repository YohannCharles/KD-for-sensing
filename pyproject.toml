[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-sensing"
version = "0.1.0"
description = "MMW T2 and baseline multimodal beam-prediction workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scipy",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
kd-sensing-train = "kd_sensing.cli.train:main"
kd-sensing-evaluate = "kd_sensing.cli.evaluate:main"
kd-sensing-preprocess = "kd_sensing.cli.preprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: focused checks that are intentionally slower than unit smoke tests",
    "integration: checks that exercise subprocess, CLI, or file workflow boundaries",
    "local_data: checks that require explicit local dataset artifacts",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]
