[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-sensing"
version = "0.1.0"
description = "Clean MMW U0, retained baseline, and DeepSense6G multimodal beam-prediction workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
kd-sensing-train = "kd_sensing.cli.train:main"
kd-sensing-evaluate = "kd_sensing.cli.evaluate:main"
kd-sensing-preprocess = "kd_sensing.cli.preprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["All_models", "cache", "dataset", "logs", "outputs", "paper", "results"]

[tool.ruff.lint]
# Bug-catching tier only.  The local experiment surface under `tools/` still
# uses a dense one-off style, so enabling style rules here would bury real
# findings.  Widen this list once that surface has been formatted.
select = ["E9", "F401", "F63", "F7", "F811", "F82"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: focused checks that are intentionally slower than unit smoke tests",
    "integration: checks that exercise subprocess, CLI, or file workflow boundaries",
    "local_data: checks that require explicit local dataset artifacts",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]
