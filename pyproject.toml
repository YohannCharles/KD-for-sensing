[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-sensing"
version = "0.1.0"
description = "Multimodal few-shot cross-scene beam prediction workflows for supervised and adaptation experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scipy",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
hdf5 = [
    "h5py",
]
lmdb = [
    "lmdb",
]

[project.scripts]
kd-sensing-train = "kd_sensing.cli.train:main"
kd-sensing-evaluate = "kd_sensing.cli.evaluate:main"
kd-sensing-preprocess = "kd_sensing.cli.preprocess:main"
kd-sensing-runs = "kd_sensing.cli.runs:console_main"
kd-sensing-clean-runtime-artifacts = "kd_sensing.cli.cleanup_runtime_artifacts:main"
kd-sensing-organize-runtime-outputs = "kd_sensing.cli.organize_runtime_outputs:main"
kd-sensing-paper-export = "kd_sensing.cli.paper_artifact_export:main"
kd-sensing-eval-u-mask-matrix = "kd_sensing.cli.eval_u_mask_beam_jepa_matrix:main"
kd-sensing-mmw-town-gps-v2 = "kd_sensing.cli.mmw_town_gps_v2:main"
kd-sensing-inspect-mmw-physics = "kd_sensing.cli.inspect_mmw_physics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: focused checks that are intentionally slower than unit smoke tests",
    "integration: checks that exercise subprocess, CLI, or file workflow boundaries",
    "local_data: checks that require explicit local dataset artifacts",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]
