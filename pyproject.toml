[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-sensing"
version = "0.1.0"
description = "Multi-modal few-shot cross-scene beam prediction workflows with legacy KD baselines."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scipy",
    "scikit-image",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytorch-model-summary",
    "thop",
]
visualization = [
    "gradio",
    "plotly",
]

[project.scripts]
kd-sensing-train = "kd_sensing.cli.train:main"
kd-sensing-evaluate = "kd_sensing.cli.evaluate:main"
kd-sensing-preprocess = "kd_sensing.cli.preprocess:main"
kd-sensing-runs = "kd_sensing.cli.runs:console_main"
kd-sensing-hist-beam-loso = "kd_sensing.cli.hist_beam_loso:main"
kd-sensing-export-viewer-manifest = "kd_sensing.cli.export_viewer_manifest:main"
kd-sensing-visualize-modalities = "kd_sensing.cli.visualize_modalities:main"

[tool.setuptools.packages.find]
where = ["src"]
