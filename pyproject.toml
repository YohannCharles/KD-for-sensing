[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-sensing"
version = "0.1.0"
description = "Multimodal few-shot cross-scene beam prediction workflows for supervised and adaptation experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scipy",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
hdf5 = [
    "h5py",
]
lmdb = [
    "lmdb",
]

[project.scripts]
kd-sensing-train = "kd_sensing.cli.train:main"
kd-sensing-evaluate = "kd_sensing.cli.evaluate:main"
kd-sensing-preprocess = "kd_sensing.cli.preprocess:main"
kd-sensing-runs = "kd_sensing.cli.runs:console_main"
kd-sensing-research-dashboard = "kd_sensing.cli.research_dashboard:main"
kd-sensing-research-preview = "kd_sensing.cli.research_preview:main"
kd-sensing-clean-runtime-artifacts = "kd_sensing.cli.cleanup_runtime_artifacts:main"
kd-sensing-organize-runtime-outputs = "kd_sensing.cli.organize_runtime_outputs:main"
kd-sensing-jepa-visual-analysis = "kd_sensing.cli.jepa_visual_analysis:main"
kd-sensing-jepa-gps-shortcut-benchmark = "kd_sensing.cli.jepa_gps_shortcut_benchmark:main"
kd-sensing-predictive-gps-query-visualizations = "kd_sensing.cli.predictive_gps_query_visualizations:main"
kd-sensing-target-shot-split = "kd_sensing.cli.target_shot_split:main"
kd-sensing-distribution-shift = "kd_sensing.cli.distribution_shift:main"
kd-sensing-wcl2025-missing-modality-audit = "kd_sensing.cli.wcl2025_missing_modality:main"
kd-sensing-paper-export = "kd_sensing.cli.paper_artifact_export:main"
kd-sensing-dataset-audit = "kd_sensing.cli.dataset_reproducibility_audit:main"
kd-sensing-eval-u-mask-matrix = "kd_sensing.cli.eval_u_mask_beam_jepa_matrix:main"
kd-sensing-mmw-town-gps-v2 = "kd_sensing.cli.mmw_town_gps_v2:main"
kd-sensing-plot-mmw-town-gps-v2 = "kd_sensing.cli.plot_mmw_town_gps_v2:main"
kd-sensing-compare-mmw-town-gps-v2 = "kd_sensing.cli.compare_mmw_town_gps_v2:main"
kd-sensing-train-beambench-image-ae-gps = "kd_sensing.cli.train_beambench_image_ae_gps:main"
kd-sensing-run-beambench-image-ae-gps-tableiii = "kd_sensing.cli.run_beambench_image_ae_gps_tableiii:main"
kd-sensing-tii-vlrg-transformer = "kd_sensing.cli.tii_vlrg_transformer:main"
kd-sensing-inspect-mmw-physics = "kd_sensing.cli.inspect_mmw_physics:main"
kd-sensing-model-architecture-summary = "kd_sensing.cli.model_architecture_summary:main"
kd-sensing-project-surface-doctor = "kd_sensing.cli.project_surface_doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: focused checks that are intentionally slower than unit smoke tests",
    "integration: checks that exercise subprocess, CLI, or file workflow boundaries",
    "local_data: checks that require explicit local dataset artifacts",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]
